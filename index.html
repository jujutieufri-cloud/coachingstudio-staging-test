        r.message ? h("div",{style:"font-size:12px;color:#9a9a85;margin-top:8px;font-style:italic"}, "\"" + r.message + "\"") : null
      )
    ));
    const actions = h("div",{style:"display:flex;gap:8px;margin-top:12px"});
    const confirmBtn = h("button",{class:"btn-sm",style:"border-color:#4a9e6a44;color:#4a9e6a"},"✓ Confirmer");
    const rejectBtn = h("button",{class:"btn-sm",style:"border-color:#d0707044;color:#d07070"},"✕ Rejeter");
    function bloquerBoutons(txtConfirm, txtReject) {
      confirmBtn.disabled = true; rejectBtn.disabled = true;
      if (txtConfirm) confirmBtn.textContent = txtConfirm;
      if (txtReject) rejectBtn.textContent = txtReject;
    }
    function debloquerBoutons(err) {
      confirmBtn.disabled = false; rejectBtn.disabled = false;
      confirmBtn.textContent = "✓ Confirmer"; rejectBtn.textContent = "✕ Rejeter";
      if (err) {
        const errMsg = h("div",{style:"color:#d07070;font-size:12px;margin-top:6px"}, "Échec : " + err.message);
        card.appendChild(errMsg);
      }
    }
    confirmBtn.addEventListener("click", () => {
      bloquerBoutons("Confirmation…", null);
      RdvRequests.setStatus(r.id, "confirme", (err) => { if (err) debloquerBoutons(err); });
    });
    rejectBtn.addEventListener("click", () => {
      bloquerBoutons(null, "Rejet…");
      RdvRequests.setStatus(r.id, "rejete", (err) => { if (err) debloquerBoutons(err); });
    });
    actions.appendChild(confirmBtn); actions.appendChild(rejectBtn);
    card.appendChild(actions);
    wrap.appendChild(card);
  });

  if (traites.length) {
    wrap.appendChild(h("div",{style:"font-weight:700;font-size:13px;color:#5A5648;margin:18px 0 10px"}, "Traitées"));
    traites.slice(0,10).forEach(r => {
      const col = r.status === "confirme" ? "#4a9e6a" : (r.status === "annule" ? "#d0a070" : "#d07070");
      const label = r.status === "confirme" ? "Confirmé" : (r.status === "annule" ? "Annulé" : "Rejeté");
      const row = h("div",{style:"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #D8CBA8;font-size:12.5px;gap:10px"});
      row.appendChild(h("div",{style:"color:#2E2A20;flex:1"}, r.prenom + " " + r.nom + " — " + r.motif));
      row.appendChild(h("span",{style:"color:"+col}, label));
      if (r.status === "confirme") {
        const cancelBtn = h("button",{class:"btn-sm",style:"border-color:#d0707044;color:#d07070;padding:4px 10px;font-size:13.5px"},"✕ Annuler");
        cancelBtn.addEventListener("click", () => {
          if (!confirm("Annuler ce rendez-vous et libérer le créneau ?")) return;
          cancelBtn.disabled = true;
          cancelBtn.textContent = "Annulation…";
          RdvRequests.annuler(r.id, (err) => {
            if (err) {
              cancelBtn.disabled = false;
              cancelBtn.textContent = "✕ Annuler";
              cancelBtn.style.background = "#d0707022";
              const errMsg = h("div",{style:"color:#d07070;font-size:11px;margin-top:4px"}, "Échec : " + err.message);
              row.appendChild(errMsg);
            }
          });
        });
        row.appendChild(cancelBtn);
      }
      wrap.appendChild(row);
    });
  }

  return wrap;
}

function clampNum(val, min, max, fallback) {
  var n = parseInt(val, 10);
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.firstElementChild || d;
}

function profileColor(p) { return PC[p] || "#4a9e6a"; }

function badgeProfil(p) {
  const col = profileColor(p);
  return h("span",{class:"badge-profil",style:`background:${col}22;color:${col};border:1px solid ${col}44`}, p);
}

function badgeStatus(s) {
  const col = s==="actif"?"#4a9e6a":s==="pause"?"#d4885a":"#6B6355";
  return h("span",{class:"status-badge",style:`background:${col}18;color:${col};border:1px solid ${col}33`}, s);
}

function badgeCat(c) {
  const col = CAT_COLORS[c] || "#5A5648";
  return h("span",{class:"cat-badge",style:`background:${col}1a;color:${col};border:1px solid ${col}33`}, c);
}

function avatar(name, profile, size) {
  size = size || 44;
  const col = profileColor(profile);
  return h("div",{class:"avatar",style:`width:${size}px;height:${size}px;background:${col}25;color:${col};font-size:${size*0.4}px`}, (name||"?")[0]);
}

function lbl(text) { return h("label",{class:"lbl"}, text); }

function inputEl(opts) {
  const el = h("input", {type:opts.type||"text", placeholder:opts.placeholder||""});
  el.value = opts.value || "";
  if (opts.onInput) el.addEventListener("input", e => opts.onInput(e.target.value));
  if (opts.onChange) el.addEventListener("change", e => opts.onChange(e.target.value));
  return el;
}

function textareaEl(opts) {
  const el = h("textarea", {placeholder:opts.placeholder||""});
  el.value = opts.value || "";
  el.style.height = opts.height || "auto";
  if (opts.onInput) el.addEventListener("input", e => opts.onInput(e.target.value));
  if (opts.onBlur) el.addEventListener("blur", e => opts.onBlur(e.target.value));
  return el;
}

function selectEl(opts) {
  const el = h("select", {});
  opts.options.forEach(o => {
    const opt = h("option", {value:o}, o);
    if (o === opts.value) opt.selected = true;
    el.appendChild(opt);
  });
  if (opts.onChange) el.addEventListener("change", e => opts.onChange(e.target.value));
  return el;
}

function field(labelText, inputElement) {
  return h("div", {}, lbl(labelText), inputElement);
}

function caduMoisCourant() {
  const maintenant = new Date();
  const cleMoisCourant = maintenant.getFullYear() + "-" + String(maintenant.getMonth()+1).padStart(2,"0");
  let reel = 0;
  state.clients.forEach(c => {
    (c.paiements || []).forEach(p => {
      if (p.date && p.date.slice(0,7) === cleMoisCourant && p.statut === "payé") {
        reel += Number(p.montant || 0);
      }
    });
  });
  return reel;
}

const PROTOCOLE_STEPS = [
  {id:"objectif",   num:1, label:"Objectif",      icon:"🎯"},
  {id:"bilan",      num:2, label:"Bilan initial",  icon:"📊"},
  {id:"seances",    num:3, label:"Séances",        icon:"📖"},
  {id:"miparcours", num:4, label:"Mi-parcours",    icon:"🧭"},

];

function buildProtocole(c) {
  c.protocole = c.protocole || { step:"objectif", demandeInitiale:"", objectifFormule:"", adhesion:0 };
  c.protocoleSeances = c.protocoleSeances || [];
  const pr = c.protocole;
  const wrap = h("div",{});

  wrap.appendChild(h("p",{style:"color:#5A5648;font-size:12.5px;margin-bottom:10px"},"Un seul protocole, étape par étape — de l'objectif initial au rapport final."));

  const stepBar = h("div",{style:"display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap"});
  function stepRempli(id) {
    if (id==="objectif") return !!(pr.demandeInitiale || pr.objectifFormule || (c.objectifs&&c.objectifs.length));
    if (id==="bilan") return !!(c.evaluation && Object.values(c.evaluation).some(v=>v>0));
    if (id==="seances") return !!(c.protocoleSeances && c.protocoleSeances.length);
    if (id==="miparcours") return !!(c.bilanMiParcours && c.bilanMiParcours.date);
    if (id==="survie") return !!(c.kitSurvie && (c.kitSurvie.profilCoache || (c.kitSurvie.signaux||[]).some(Boolean)));
    if (id==="cloture") return !!(pr.cloture && pr.cloture.date);
    return false;
  }
  PROTOCOLE_STEPS.forEach(s => {
    const active = pr.step === s.id;
    const rempli = stepRempli(s.id);
    const btn = h("button",{style:"position:relative;flex:1;min-width:88px;padding:8px 4px;border-radius:8px;border:1.5px solid "+(active?"#9C7A2E":rempli?"#4a9e6a88":"#D8CBA8")+";background:"+(active?"#9C7A2E":"transparent")+";color:"+(active?"#fff":"#6B6355")+";font-size:11px;font-weight:700;cursor:pointer"},
      (rempli && !active ? "✓ " : "") + s.icon + " " + s.num + ". " + s.label
    );
    btn.addEventListener("click", () => { pr.step = s.id; save(); render(); });
    stepBar.appendChild(btn);
  });
  wrap.appendChild(stepBar);

  const rapportBtn = h("button",{class:"btn-sm",style:"margin-bottom:16px;border-color:#9C7A2E;color:#9C7A2E"},"🖨️ Générer le rapport complet");
  rapportBtn.addEventListener("click", () => genererRapport(c));
  wrap.appendChild(rapportBtn);

  const body = h("div",{});
  if (pr.step === "objectif")   body.appendChild(stepObjectif(c));
  if (pr.step === "bilan")      body.appendChild(stepBilanInitial(c));
  if (pr.step === "seances")    body.appendChild(stepSeances(c));
  if (pr.step === "miparcours") body.appendChild(stepMiParcours(c));
  if (pr.step === "survie")     body.appendChild(stepKitSurvie(c));
  if (pr.step === "cloture")    body.appendChild(stepCloture(c));
  wrap.appendChild(body);

  const idx = PROTOCOLE_STEPS.findIndex(s=>s.id===pr.step);
  const navRow = h("div",{style:"display:flex;justify-content:space-between;gap:10px;margin-top:20px"});
  const prevBtn = h("button",{class:"btn-g"}, "← Précédent");
  if (idx<=0) prevBtn.disabled = true;
  else prevBtn.addEventListener("click", () => { pr.step = PROTOCOLE_STEPS[idx-1].id; save(); render(); });
  const nextBtn = h("button",{class:"btn"}, idx<PROTOCOLE_STEPS.length-1 ? "Suivant →" : "🖨️ Terminer & générer le rapport");
  if (idx<PROTOCOLE_STEPS.length-1) nextBtn.addEventListener("click", () => { pr.step = PROTOCOLE_STEPS[idx+1].id; save(); render(); });
  else nextBtn.addEventListener("click", () => genererRapport(c));
  navRow.appendChild(prevBtn); navRow.appendChild(nextBtn);
  wrap.appendChild(navRow);

  return wrap;
}

function roueDeVieSVG(scores) {
  const cx=150, cy=150, maxR=105, n=DOMAINES_ROUE.length;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;
  let svg = `<svg viewBox="0 0 300 300" style="width:100%;max-width:300px;display:block;margin:0 auto">`;
  [0.2,0.4,0.6,0.8,1].forEach(lv => {
    const pts = DOMAINES_ROUE.map((d,i) => {
      const a=angle(i), r=maxR*lv;
      return (cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1);
    }).join(" ");
    svg += `<polygon points="${pts}" fill="none" stroke="#D8CBA8" stroke-width="1"/>`;
  });
  DOMAINES_ROUE.forEach((d,i) => {
    const a=angle(i), x=cx+maxR*Math.cos(a), y=cy+maxR*Math.sin(a);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#D8CBA8" stroke-width="1"/>`;
  });
  const dataPts = DOMAINES_ROUE.map((d,i) => {
    const a=angle(i), r=maxR*((scores[d.key]||0)/10);
    return (cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1);
  }).join(" ");
  svg += `<polygon points="${dataPts}" fill="#9C7A2E33" stroke="#9C7A2E" stroke-width="2"/>`;
  DOMAINES_ROUE.forEach((d,i) => {
    const a=angle(i), r=maxR*((scores[d.key]||0)/10);
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#9C7A2E"/>`;
  });
  DOMAINES_ROUE.forEach((d,i) => {
    const a=angle(i), lx=cx+(maxR+20)*Math.cos(a), ly=cy+(maxR+20)*Math.sin(a);
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="15" text-anchor="middle" dominant-baseline="middle">${d.emoji}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"},
      h("div",{style:"font-size:13px;color:#2E2A20"}, d.emoji+" "+d.label+" — "+d.question), valSpan
    );
    rowBox.appendChild(hdr);

    const modeToggle = h("button",{style:"background:transparent;border:none;color:#9C7A2E;font-size:11px;text-decoration:underline;cursor:pointer;padding:0;margin-bottom:6px"},
      rv.qcmMode[d.key] ? "↔ Repasser en curseur manuel" : "📋 Questionnaire guidé (choix A/B)"
    );
    modeToggle.addEventListener("click", () => { rv.qcmMode[d.key] = !rv.qcmMode[d.key]; save(); render(); });
    rowBox.appendChild(modeToggle);

    if (rv.qcmMode[d.key]) {
      rv.qcmAnswers[d.key] = rv.qcmAnswers[d.key] || [null,null];
      const ans = rv.qcmAnswers[d.key];
      rowBox.appendChild(buildQCMBlock(ROUE_QCM[d.key], ans, (i,val) => {
        ans[i] = val;
        const answered = ans.filter(v=>v!==null);
        if (answered.length) rv.scores[d.key] = Math.round(answered.reduce((s,v)=>s+v,0)/answered.length);
        save(); render();
      }));
    } else {
      const slider = h("input",{type:"range",min:"0",max:"10",value:String(rv.scores[d.key]||0),style:"width:100%"});
      slider.addEventListener("input", () => {
        rv.scores[d.key] = Number(slider.value);
        valSpan.textContent = slider.value;
        svgWrap.innerHTML = roueDeVieSVG(rv.scores);
        updateSynthese();
        save();
      });
      rowBox.appendChild(slider);
    }
    slidersWrap.appendChild(rowBox);
  });
  box.appendChild(slidersWrap);

  const synthese = h("div",{style:"margin-top:6px;padding:10px 12px;background:#E4DAC055;border-radius:8px;font-size:12.5px;color:#6B6355"});
  function updateSynthese() {
    const entries = DOMAINES_ROUE.map(d => ({...d, score: rv.scores[d.key]||0}));
    if (!entries.some(e=>e.score>0)) { synthese.textContent = "Note les 8 domaines pour voir apparaître les priorités."; return; }
    const bas = entries.reduce((a,b)=>b.score<a.score?b:a);
    const haut = entries.reduce((a,b)=>b.score>a.score?b:a);
    synthese.innerHTML = `<b>Domaine le plus bas :</b> ${bas.emoji} ${bas.label} (${bas.score}/10) — « Que se passerait-il si ça montait de 1 ? »<br><b>Domaine le plus haut :</b> ${haut.emoji} ${haut.label} (${haut.score}/10) — « Comment cette force peut-elle aider les autres ? »`;
  }
  updateSynthese();
  box.appendChild(synthese);

  // Choix explicite du domaine à prioriser — pas juste une suggestion, un vrai choix qui sert ensuite
  const choixBox = h("div",{style:"margin-top:14px"});
  choixBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:13px;margin-bottom:8px"},"❓ Dans quel domaine as-tu/avez-vous envie de progresser en priorité ?"));
  const chipsWrap = h("div",{style:"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px"});
  function renderChips() {
    chipsWrap.innerHTML = "";
    DOMAINES_ROUE.forEach(d => {
      const score = rv.scores[d.key]||0;
      const active = rv.domainePriorite === d.key;
      const chip = h("button",{style:"padding:7px 12px;border-radius:20px;border:1.5px solid "+(active?"#9C7A2E":"#D8CBA8")+";background:"+(active?"#9C7A2E":"transparent")+";color:"+(active?"#fff":"#2E2A20")+";font-size:12.5px;cursor:pointer"},
        d.emoji+" "+d.label+" ("+score+"/10)"
      );
      chip.addEventListener("click", () => {
        rv.domainePriorite = active ? null : d.key;
        save(); render();
      });
      chipsWrap.appendChild(chip);
    });
  }
  renderChips();
  choixBox.appendChild(chipsWrap);

  if (rv.domainePriorite) {
    const dSel = DOMAINES_ROUE.find(d=>d.key===rv.domainePriorite);
    const useBtn = h("button",{class:"btn-sm",style:"border-color:#9C7A2E;color:#9C7A2E"},"→ Utiliser ce domaine pour formuler l'objectif");
    useBtn.addEventListener("click", () => {
      c.protocole.objectifFormule = "Progresser sur « "+dSel.label+" » (parti de "+(rv.scores[dSel.key]||0)+"/10 sur la Roue de la vie).";
      save(); render();
      notifCoach("Objectif pré-rempli à partir de la Roue de la vie.");
    });
    choixBox.appendChild(useBtn);
  }
  box.appendChild(choixBox);

  const planBox = h("div",{style:"margin-top:12px"});
  planBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:13px;margin-bottom:6px"},"❓ Une action concrète pour la semaine, sur le domaine choisi"));
  planBox.appendChild(textareaEl({value:rv.planAction, placeholder:"Une seule action, testable et concrète.", height:"50px", onInput:v=>{rv.planAction=v; save();}}));
  box.appendChild(planBox);

  const dateRow = h("div",{style:"margin-top:10px"});
  const dateInp = h("input",{type:"date",value:rv.date||""});
  dateInp.addEventListener("change", () => { rv.date = dateInp.value; save(); });
  dateRow.appendChild(h("label",{style:"font-size:11px;color:#6B6355;display:block;margin-bottom:3px"},"Date de cette roue"));
  dateRow.appendChild(dateInp);
  box.appendChild(dateRow);

  return box;
}

function buildObjectifsListe(c) {
  const wrap = h("div",{});
  c.objectifs = c.objectifs || [];
  let showForm = false;
  let newObj = {titre:"",echeance:"",statut:"en cours"};

  function render2() {
    wrap.innerHTML="";
    const atteints = c.objectifs.filter(o=>o.statut==="atteint").length;
    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"},
      h("span",{style:"color:#5A5648;font-size:13px"},`${atteints}/${c.objectifs.length} atteint(s)`)
    );
    const addBtn = h("button",{class:"btn-sm",style:"border-color:#9C7A2E44;color:#9C7A2E"},showForm?"✕ Annuler":"+ Ajouter");
    addBtn.addEventListener("click",()=>{ showForm=!showForm; newObj={titre:"",echeance:"",statut:"en cours"}; render2(); });
    hdr.appendChild(addBtn);
    wrap.appendChild(hdr);

    if (showForm) {
      const box = h("div",{class:"card",style:"padding:14px;margin-bottom:12px;border-color:#9C7A2E33"});
      const g = h("div",{class:"grid2",style:"margin-bottom:10px"});
      const ti = inputEl({placeholder:"Ex: Poser des limites claires",onInput:v=>newObj.titre=v});
      g.appendChild(h("div",{class:"span2"},field("OBJECTIF",ti)));
      const da = inputEl({type:"date",onChange:v=>newObj.echeance=v});
      g.appendChild(field("ÉCHÉANCE",da));
      const st = selectEl({options:["en cours","atteint","suspendu"],value:"en cours",onChange:v=>newObj.statut=v});
      g.appendChild(field("STATUT",st));
      box.appendChild(g);
      const sv = h("button",{class:"btn",style:"padding:8px 18px;font-size:13px"},"Ajouter");
      sv.addEventListener("click",()=>{
        if (!newObj.titre.trim()) return;
        c.objectifs.push({...newObj,id:Date.now()+""});
        save(); showForm=false; render2();
      });
      box.appendChild(sv);
      wrap.appendChild(box);
    }

    if (!c.objectifs.length) {
      wrap.appendChild(h("p",{style:"color:#6B6355;font-size:13px;padding:8px 0"},"Aucun objectif défini."));
    } else {
      c.objectifs.forEach(o => {
        const col = o.statut==="atteint"?"#4a9e6a":o.statut==="suspendu"?"#6B6355":"#5aaec8";
        const chk = h("div",{class:"obj-check",style:`border-color:${col};background:${o.statut==="atteint"?col:"transparent"};color:#F7F2E7`}, o.statut==="atteint"?"✓":"");
        chk.addEventListener("click",()=>{ o.statut = o.statut==="atteint"?"en cours":"atteint"; save(); render2(); });
        const sbadge = h("span",{style:`padding:2px 8px;border-radius:20px;background:${col}18;color:${col};font-size:12px;font-weight:600`},o.statut);
        const del = h("button",{style:"background:transparent;border:none;cursor:pointer;color:#6B6355;font-size:18px;padding:0 4px"},"×");
        del.addEventListener("click",()=>{ c.objectifs = c.objectifs.filter(x=>x.id!==o.id); save(); render2(); });
        wrap.appendChild(h("div",{class:"obj-row"}, chk,
          h("div",{style:"flex:1"},
            h("div",{style:`color:${o.statut==="atteint"?"#6B6355":"#2E2A20"};font-size:14px;text-decoration:${o.statut==="atteint"?"line-through":"none"}`},o.titre),
            o.echeance?h("div",{style:"color:#6B6355;font-size:13px;margin-top:2px"},"Échéance : "+o.echeance):null
          ), sbadge, del
        ));
      });
    }
  }
  render2();
  return wrap;
}

function stepBilanInitial(c) {
  const wrap = h("div",{});
  c.evaluation = c.evaluation || {};
  const dims = dimensionsPourProfil(c.profile);
  wrap.appendChild(h("h3",{style:"font-size:19px;color:#2E2A20;font-weight:600;margin-bottom:4px;font-style:italic"},"📊 Étape 2 — Bilan initial"));
  wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;margin-bottom:4px"},"❓ Notez chaque dimension de 0 (aucune difficulté) à 10 (difficulté majeure)."));
  wrap.appendChild(h("p",{style:"color:#9C7A2E;font-size:12px;margin-bottom:16px;font-weight:600"},"Dimensions adaptées au profil : "+(c.profile||"non défini")));

  const scoreBox = h("div",{class:"card",style:"padding:20px;margin-bottom:16px;text-align:center"});
  function scoreTotal(){ return dims.reduce((s,d)=>s+(c.evaluation[d.key]||0),0); }
  function zone(score){
    const max=dims.length*10; const pct=max?score/max:0;
    if (pct<0.33) return {label:"Zone verte",color:"#4a9e6a",txt:"Fonctionnement sain — Prévention et optimisation"};
    if (pct<0.66) return {label:"Zone orange",color:"#c8a042",txt:"Signaux à surveiller — Ajuster le rythme"};
    return {label:"Zone rouge",color:"#d07070",txt:"Épuisement marqué — Prioriser le repos et le soutien"};
  }
  function renderScore(){
    scoreBox.innerHTML="";

      c.evaluationQcmMode[d.key] ? "↔ Repasser en curseur manuel" : "📋 Questionnaire guidé (choix A/B)"
    );
    modeToggle.addEventListener("click", () => { c.evaluationQcmMode[d.key] = !c.evaluationQcmMode[d.key]; save(); render(); });
    card.appendChild(modeToggle);

    if (c.evaluationQcmMode[d.key] && DIM_QCM[d.key]) {
      c.evaluationQcmAnswers[d.key] = c.evaluationQcmAnswers[d.key] || [null,null];
      const ans = c.evaluationQcmAnswers[d.key];
      card.appendChild(buildQCMBlock(DIM_QCM[d.key], ans, (i,val) => {
        ans[i] = val;
        const answered = ans.filter(v=>v!==null);
        if (answered.length) c.evaluation[d.key] = Math.round(answered.reduce((s,v)=>s+v,0)/answered.length);
        save(); render();
      }));
    } else {
      const slider = h("input",{type:"range",min:"0",max:"10",value:String(c.evaluation[d.key]||0),style:"width:100%"});
      slider.addEventListener("input", () => { c.evaluation[d.key]=Number(slider.value); valSpan.textContent=slider.value; renderScore(); save(); });
      card.appendChild(slider);
    }
    wrap.appendChild(card);

  c.protocole.signauxAlerte = c.protocole.signauxAlerte || [];

  gfBox.appendChild(h("div",{style:"color:#8B7355;font-size:11.5px;margin-bottom:10px"},"Le coach agit dans son champ de compétence et oriente vers un professionnel de santé si l'un de ces signaux est présent — norme reprise des standards de coaching TDAH (NBEFC)."));
  const flagsList = h("div",{});
  function renderFlags() {

      const cb = h("input",{type:"checkbox"});
      cb.checked = checked;
      cb.addEventListener("change", () => {
        if (cb.checked) { if (!sa.includes(f.id)) sa.push(f.id); }
        else { c.protocole.signauxAlerte = sa.filter(x=>x!==f.id); }
        save(); render();
      });
      row.appendChild(cb);
      row.appendChild(h("span",{}, f.label));

function stepSeances(c) {
  const wrap = h("div",{});
  c.protocoleSeances = c.protocoleSeances || [];
  wrap.appendChild(h("h3",{style:"font-size:19px;color:#2E2A20;font-weight:600;margin-bottom:4px;font-style:italic"},"📖 Étape 3 — Séances de travail"));
  wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;margin-bottom:16px"},"Choisissez un déroulé, menez la séance, puis complétez le compte-rendu — chaque séance validée nourrit le rapport."));

  const profilClient = (c.profile||"").toUpperCase();
  const enReconversion = profilClient.includes("BURNOUT") || profilClient.includes("RECONVERSION");
  const stade = c.protocole.stadeChangement;
  let suggestionId = null;

  // Le stade de changement prime : pas d'entraînement aux compétences si le client n'est pas prêt à agir
  if (stade === "precontemplation" || stade === "contemplation") {
    suggestionId = c.protocoleSeances.length ? "d5" : "d1"; // psychoéducation / évaluation, pas d'action
  } else if (stade === "maintien") {
    suggestionId = "d6"; // consolidation
  } else if (enReconversion && !c.protocoleSeances.length) {
    suggestionId = "d5"; // bilan burnout systématique en premier quand le motif l'indique
  } else {
    const e = c.evaluation || {};
    if (profilClient.includes("TDAH") && ((e.gestionTemps||0)+(e.dispersion||0)+(e.impulsivite||0))>=6) suggestionId="d2";
    else if (profilClient.includes("HPI") && ((e.syndromeImposteur||0)+(e.questionnement||0))>=6) suggestionId="d3";
    else if ((profilClient.includes("HSP")||profilClient.includes("HPE")) && ((e.intensiteEmo||0)+(e.surchargeSensorielle||0))>=6) suggestionId="d4";
    else if (enReconversion) suggestionId = "d6"; // check-in reconversion par défaut si rien d'autre ne ressort
  }
  if (!suggestionId && !c.protocoleSeances.length) suggestionId = "d1";

  const form = h("div",{class:"card",style:"padding:16px;margin-bottom:16px;border-color:#9C7A2E44"});
  form.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:14px;margin-bottom:8px"},"❓ Quel déroulé pour cette séance ?"));
  const sel = h("select",{style:"width:100%;margin-bottom:6px"});
  DEROULES.forEach(d => {
    const opt = h("option",{value:d.id}, d.titre + " · " + PHASES_LABELS[d.phase] + (d.id===suggestionId?" — suggéré":""));
    if (d.id===(suggestionId||DEROULES[0].id)) opt.selected = true;
    sel.appendChild(opt);
  });
  form.appendChild(sel);
  if (suggestionId) {
    const stadeTxt = stade ? " (stade : " + STADES_CHANGEMENT.find(s=>s.id===stade).label + ")" : "";
    form.appendChild(h("div",{style:"font-size:11.5px;color:#9C7A2E;margin-bottom:10px"},"💡 Suggéré à partir du profil, du bilan initial et du stade de changement"+stadeTxt+"."));
  }
  if (enReconversion) {
    const bridgeBtn = h("button",{class:"btn-sm",style:"margin-bottom:10px;border-color:#4a9e6a;color:#4a9e6a"},"🌱 Ouvrir le parcours Reconversion/Burnout pour ce client");
    bridgeBtn.addEventListener("click", () => { state.tab="reconversion"; state.selClientId=null; save(); render(); });
    form.appendChild(bridgeBtn);
  }

  const dateInp = inputEl({type:"date", value:new Date().toISOString().slice(0,10)});
  form.appendChild(h("div",{style:"margin:10px 0"}, field("DATE", dateInp)));

  form.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:14px;margin:14px 0 8px"},"❓ Résumé de la séance (une fois menée)"));
  const resumeTa = textareaEl({placeholder:"Points abordés, avancées, réactions du client...", height:"70px"});
  form.appendChild(resumeTa);

  form.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:14px;margin:14px 0 8px"},"❓ Devoir donné"));
  const devoirTa = textareaEl({placeholder:"Reprend le devoir du déroulé, à ajuster si besoin.", height:"50px"});
  const initT = DEROULES.find(d=>d.id===(suggestionId||DEROULES[0].id));
  if (initT) devoirTa.value = initT.devoirs;
  sel.addEventListener("change", () => {
    const t = DEROULES.find(d=>d.id===sel.value);
    if (t) devoirTa.value = t.devoirs;
  });
  form.appendChild(devoirTa);

  const validBtn = h("button",{class:"btn",style:"margin-top:12px"},"✅ Valider cette séance");
  validBtn.addEventListener("click", () => {
    const t = DEROULES.find(d=>d.id===sel.value);
    if (!t) return;
    c.protocoleSeances.push({
      date: dateInp.value || new Date().toISOString().slice(0,10),
      derouleId: t.id, derouleNom: t.titre,
      resume: resumeTa.value.trim(), devoir: devoirTa.value.trim()
    });
    c.sessions = (c.sessions||0)+1;
    c.sessionHistory = c.sessionHistory || [];
    c.sessionHistory.push(`Séance ${c.sessions} — [${t.titre}] ${resumeTa.value.trim()}`);
    state.clients = state.clients.map(x=>x.id===c.id?c:x);
    save(); render();
    notifCoach("Séance enregistrée — le rapport est à jour.");
  });
  form.appendChild(validBtn);
  wrap.appendChild(form);

  wrap.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:14px;margin:18px 0 10px"},"Historique des séances (" + c.protocoleSeances.length + ")"));
  if (!c.protocoleSeances.length) {
    wrap.appendChild(h("p",{style:"color:#6B6355;font-size:13px"},"Aucune séance enregistrée pour l'instant."));
  } else {
    [...c.protocoleSeances].reverse().forEach(s => {
      const card = h("div",{class:"card",style:"padding:14px 16px;margin-bottom:8px"});
      card.appendChild(h("div",{style:"display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"},
        h("div",{style:"font-weight:700;color:#2E2A20;font-size:13px"}, s.derouleNom),
        h("div",{style:"color:#8B7355;font-size:12px"}, s.date)
      ));
      if (s.resume) card.appendChild(h("div",{style:"color:#5A5648;font-size:12.5px;margin-top:6px"}, s.resume));
      if (s.devoir) card.appendChild(h("div",{style:"color:#6B6355;font-size:12px;margin-top:4px;font-style:italic"}, "📝 "+s.devoir));
      wrap.appendChild(card);
    });
  }

  return wrap;
}

function escHtmlRapport(s) {

function genererRapport(c) {
  const pr = c.protocole || {};
  const dims = dimensionsPourProfil(c.profile);
  const scoreEval = (c.evaluation && Object.keys(c.evaluation).length) ? dims.reduce((s,d)=>s+(c.evaluation[d.key]||0),0) : null;
  const maxEval = dims.length*10;
  const bmp = c.bilanMiParcours;
  const kit = c.kitSurvie;
  const cl = pr.cloture || {};
  const seances = c.protocoleSeances || [];
  const esc = escHtmlRapport;

  let rep = "";
  rep += `<h1>Rapport de suivi — ${esc(c.name||"")}</h1>`;
  rep += `<div class="meta">Profil : ${esc(c.profile||"—")} · Généré le ${new Date().toLocaleDateString('fr-FR')}</div>`;

  rep += `<h2>🎯 Objectif</h2>`;
  rep += `<p><b>Demande initiale :</b> ${esc(pr.demandeInitiale||"—")}</p>`;
  rep += `<p><b>Objectif reformulé :</b> ${esc(pr.objectifFormule||"—")}</p>`;
  rep += `<p><b>Adhésion du client :</b> ${pr.adhesion||0}/10</p>`;
  if (pr.stadeChangement) {
    const st = STADES_CHANGEMENT.find(s=>s.id===pr.stadeChangement);
    rep += `<p><b>Stade de changement (Prochaska & DiClemente) :</b> ${esc(st?st.label:pr.stadeChangement)}</p>`;
  }
  if (c.objectifs && c.objectifs.length) {
    rep += `<ul>` + c.objectifs.map(o=>`<li>${esc(o.titre)} — <i>${esc(o.statut)}</i></li>`).join("") + `</ul>`;
  }

  if (c.roueDeVie && Object.values(c.roueDeVie.scores||{}).some(v=>v>0)) {
    rep += `<h2>🎡 Roue de la vie</h2>`;
    if (c.roueDeVie.date) rep += `<p><b>Date :</b> ${esc(c.roueDeVie.date)}</p>`;
    rep += `<ul>` + DOMAINES_ROUE.map(d=>`<li>${d.emoji} ${esc(d.label)} : ${c.roueDeVie.scores[d.key]||0}/10</li>`).join("") + `</ul>`;
    if (c.roueDeVie.domainePriorite) {
      const dp = DOMAINES_ROUE.find(d=>d.key===c.roueDeVie.domainePriorite);
      if (dp) rep += `<p><b>Domaine prioritaire choisi :</b> ${dp.emoji} ${esc(dp.label)}</p>`;
    }
    if (c.roueDeVie.planAction) rep += `<p><b>Action décidée :</b> ${esc(c.roueDeVie.planAction)}</p>`;
  }

  if (c.ikigai && (c.ikigai.aime.filter(Boolean).length || c.ikigai.doue.filter(Boolean).length || c.ikigai.mondeBesoin.filter(Boolean).length || c.ikigai.payer.filter(Boolean).length)) {
    const ik = c.ikigai;
    rep += `<h2>🎯 Parcours Ikigaï</h2>`;
    if (ik.aime.filter(Boolean).length) rep += `<p><b>❤️ Ce que j'aime :</b> ${ik.aime.filter(Boolean).map(esc).join(", ")}</p>`;
    if (ik.doue.filter(Boolean).length) rep += `<p><b>⭐ Ce en quoi je suis doué(e) :</b> ${ik.doue.filter(Boolean).map(esc).join(", ")}</p>`;
    if (ik.mondeBesoin.filter(Boolean).length) rep += `<p><b>🌍 Ce dont le monde a besoin :</b> ${ik.mondeBesoin.filter(Boolean).map(esc).join(", ")}</p>`;
    if (ik.payer.filter(Boolean).length) rep += `<p><b>💰 Ce pour quoi je peux être payé(e) :</b> ${ik.payer.filter(Boolean).map(esc).join(", ")}</p>`;
    if (ik.synthese) rep += `<p><b>Synthèse / direction :</b> ${esc(ik.synthese)}</p>`;
  }

  rep += `<h2>📊 Bilan initial</h2>`;
  if (scoreEval!==null) {
    rep += `<p><b>Score global :</b> ${scoreEval} / ${maxEval}</p>`;
    rep += `<ul>` + dims.map(d=>`<li>${esc(d.label)} : ${c.evaluation[d.key]||0}/10</li>`).join("") + `</ul>`;
  } else rep += `<p>Non renseigné.</p>`;
  if (pr.signauxAlerte && pr.signauxAlerte.length) {
    const labels = pr.signauxAlerte.map(id => { const f=SIGNAUX_ALERTE.find(x=>x.id===id); return f?f.label:id; });
    rep += `<p style="color:#a04545"><b>🚦 Signaux d'alerte relevés :</b> ${labels.map(esc).join(", ")} — orientation vers un professionnel de santé recommandée.</p>`;
  }

  rep += `<h2>📖 Historique des séances (${seances.length})</h2>`;
  if (seances.length) {
    seances.forEach(s => {
      rep += `<div class="seance-block"><b>${esc(s.date)} — ${esc(s.derouleNom)}</b>`;
      if (s.resume) rep += `<p>${esc(s.resume)}</p>`;
      if (s.devoir) rep += `<p><i>Devoir : ${esc(s.devoir)}</i></p>`;
      rep += `</div>`;
    });
  } else rep += `<p>Aucune séance enregistrée.</p>`;

  rep += `<h2>🧭 Bilan mi-parcours</h2>`;
  if (bmp && bmp.date) {
    rep += `<p><b>Date :</b> ${esc(bmp.date)}</p>`;
    rep += `<ul><li>Organisation : ${bmp.scores.organisation}/10</li><li>Émotions : ${bmp.scores.emotions}/10</li><li>Relations : ${bmp.scores.relations}/10</li><li>Confiance : ${bmp.scores.confiance}/10</li></ul>`;
    if (bmp.progres) rep += `<p><b>Progrès observés :</b> ${esc(bmp.progres)}</p>`;
    if (bmp.difficile) rep += `<p><b>Ce qui reste difficile :</b> ${esc(bmp.difficile)}</p>`;
    if (bmp.prochaineEtape) rep += `<p><b>Prochaine étape :</b> ${esc(bmp.prochaineEtape)}</p>`;
  } else rep += `<p>Non renseigné.</p>`;

  rep += `<h2>🎒 Kit de survie</h2>`;
  if (kit && (kit.profilCoache||(kit.signaux&&kit.signaux.length)||(kit.outils&&kit.outils.length)||(kit.mantras&&kit.mantras.length))) {
    if (kit.profilCoache) rep += `<p><b>Profil :</b> ${esc(kit.profilCoache)}</p>`;
    if (kit.signaux && kit.signaux.filter(Boolean).length) rep += `<p><b>Signaux d'alerte :</b> ${kit.signaux.filter(Boolean).map(esc).join(", ")}</p>`;
    if (kit.outils && kit.outils.filter(Boolean).length) rep += `<p><b>Outils préférés :</b> ${kit.outils.filter(Boolean).map(esc).join(", ")}</p>`;
    if (kit.croyanceLimitante) rep += `<p><b>Croyance limitante → ressource :</b> ${esc(kit.croyanceLimitante)} → ${esc(kit.croyanceRessource||"")}</p>`;
    if (kit.mantras && kit.mantras.filter(Boolean).length) rep += `<p><b>Mantras :</b> ${kit.mantras.filter(Boolean).map(esc).join(" · ")}</p>`;
  } else rep += `<p>Non renseigné.</p>`;

  rep += `<h2>✅ Bilan final</h2>`;
  rep += `<p><b>Date de clôture :</b> ${esc(cl.date||"—")}</p>`;
  rep += `<p><b>Objectif :</b> ${esc(cl.statutObjectif||"—")}</p>`;
  if (cl.changements) rep += `<p><b>Changements observés :</b> ${esc(cl.changements)}</p>`;
  if (cl.recommandations) rep += `<p><b>Recommandations :</b> ${esc(cl.recommandations)}</p>`;

  const fullHtml = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Rapport — ${esc(c.name||"")}</title>
  <style>
    body{font-family:Georgia,serif;color:#2E2A20;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6}
    h1{font-size:24px;color:#4A4030;margin-bottom:4px}
    h2{font-size:17px;color:#9C7A2E;margin-top:28px;border-bottom:1px solid #E4DAC0;padding-bottom:6px}
    .meta{color:#8B7355;font-size:13px;margin-bottom:20px}
    .seance-block{background:#FBF7EC;border-radius:8px;padding:10px 14px;margin-bottom:8px}
    ul{padding-left:20px}
    @media print{ .printbar{display:none} }
  </style></head><body>
  <div class="printbar" style="margin-bottom:20px"><button onclick="window.print()" style="padding:8px 16px;font-size:13px;cursor:pointer">🖨️ Imprimer / Enregistrer en PDF</button></div>
  ${rep}
  </body></html>`;

  const win = window.open("", "_blank");
  if (!win) { notifCoach("Autorise les pop-ups pour voir le rapport."); return; }
  win.document.open();
  win.document.write(fullHtml);
  win.document.close();
}

function buildFiche(c) {
  let editMode = false;
  const wrap = h("div",{});

  function showView() {
    wrap.innerHTML="";
    if (c.email || c.tel) {
      const contactBox = h("div",{style:"display:flex;gap:20px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #D8CBA8;flex-wrap:wrap"});
      if (c.email) contactBox.appendChild(h("div",{style:"font-size:13px;color:#5A5648"}, "📧 ", h("span",{style:"color:#2E2A20"}, c.email)));
      if (c.tel) contactBox.appendChild(h("div",{style:"font-size:13px;color:#5A5648"}, "📞 ", h("span",{style:"color:#2E2A20"}, c.tel)));
      wrap.appendChild(contactBox);
    }

    // --- Envoi du questionnaire d'accueil ---
    const qBox = h("div",{style:"margin-bottom:18px;padding:14px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0"});
    qBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:13.5px;margin-bottom:10px"},"📨 Questionnaire d'accueil"));
    const lienQuest = "https://julien-coaching.vercel.app/questionnaire-accueil.html?client="+encodeURIComponent(c.id)+"&nom="+encodeURIComponent(c.name||"")+"&email="+encodeURIComponent(c.email||"");
    const msgQuest = "Bonjour "+(c.name||"")+", avant notre premier échange, je vous propose de répondre à ce petit questionnaire (5 min) : "+lienQuest;
    const btnRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap"});
    if (c.email) {
      const bMail = h("a",{class:"btn-sm",href:"mailto:"+c.email+"?subject="+encodeURIComponent("Avant notre rendez-vous")+"&body="+encodeURIComponent(msgQuest)},"✉️ Email");
      btnRow.appendChild(bMail);
    }
    if (c.tel) {
      const telClean = c.tel.replace(/[^\d+]/g,"");
      const bSms = h("a",{class:"btn-sm",href:"sms:"+telClean+"?body="+encodeURIComponent(msgQuest)},"💬 SMS");
      btnRow.appendChild(bSms);
      const telWa = telClean.replace(/^0/,"33").replace(/^\+/,"");
      const bWa = h("a",{class:"btn-sm",href:"https://wa.me/"+telWa+"?text="+encodeURIComponent(msgQuest),target:"_blank"},"🟢 WhatsApp");
      btnRow.appendChild(bWa);
    }
    const bCopy = h("button",{class:"btn-sm"},"🔗 Copier le lien");
    bCopy.addEventListener("click",()=>{ navigator.clipboard.writeText(lienQuest).then(()=>notifCoach("Lien copié !")); });
    btnRow.appendChild(bCopy);
    if (!c.email && !c.tel) qBox.appendChild(h("p",{style:"color:#5A5648;font-size:12.5px"},"Ajoute un email ou téléphone pour pouvoir l'envoyer."));
    qBox.appendChild(btnRow);
    wrap.appendChild(qBox);

    // --- Réponses reçues ---
    const repBox = h("div",{id:"questReponses-"+c.id,style:"margin-bottom:18px"});
    repBox.appendChild(h("p",{style:"color:#5A5648;font-size:12.5px"},"Chargement des réponses…"));
    wrap.appendChild(repBox);
    if (c.email || c.tel) {
      const db = firebase.firestore();
      let q = db.collection("questionnaires");
      (c.email ? q.where("email","==",c.email).get() : Promise.resolve({docs:[]}))
        .then(snap => {
          repBox.innerHTML = "";
          if (!snap.docs.length) { repBox.appendChild(h("p",{style:"color:#5A5648;font-size:12.5px"},"Aucune réponse au questionnaire pour l'instant.")); return; }
          repBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:13.5px;margin-bottom:10px"},"📋 Réponses au questionnaire"));
          snap.docs.forEach(docu => {
            const r = docu.data();
            const card = h("div",{class:"card",style:"padding:14px 16px;margin-bottom:10px;font-size:13px"});
            const qa = [
              ["Ce qui l'amène à consulter", r.q1],
              ["Ce qui est important pour lui/elle", r.q2],
              ["Ce qu'il/elle attend des séances", r.q3],
              ["À savoir avant le 1er RDV", r.q4],
              ["Style d'accompagnement préféré", r.q5],
            ];
            qa.forEach(([label,val]) => {
              if (!val) return;
              card.appendChild(h("div",{style:"margin-bottom:8px"},
                h("div",{style:"color:#9C7A2E;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em"},label),
                h("div",{style:"color:#2E2A20;margin-top:2px"},val)
              ));
            });
            repBox.appendChild(card);
          });
        })
        .catch(e => { console.error("lecture questionnaires:",e); repBox.innerHTML=""; repBox.appendChild(h("p",{style:"color:#5A5648;font-size:12.5px"},"Impossible de charger les réponses pour l'instant.")); });
    } else {
      repBox.innerHTML = "";
    }
    const g = h("div",{class:"grid2"});
    if (c.objective) g.appendChild(h("div",{},
      h("div",{style:"color:#6B6355;font-size:13px;letter-spacing:.08em;margin-bottom:5px"},"OBJECTIF"),
      h("div",{style:"color:#2E2A20;font-size:14px;line-height:1.6"},c.objective)
    ));
    if (c.nextSession) g.appendChild(h("div",{},
      h("div",{style:"color:#6B6355;font-size:13px;letter-spacing:.08em;margin-bottom:5px"},"PROCHAINE SÉANCE"),
      h("div",{style:"color:#9C7A2E;font-size:14px;font-weight:600"},c.nextSession)
    ));
    wrap.appendChild(g);
    if (c.forfaitNom && c.forfaitTotal) {
      const pct = Math.min(100, Math.round((c.forfaitUtilisees||0) / c.forfaitTotal * 100));
      const forfaitBox = h("div",{style:"margin-top:18px;background:#FFFFFF;padding:14px 16px;border-radius:8px;border:1px solid #E4DAC0"});
      forfaitBox.appendChild(h("div",{style:"display:flex;justify-content:space-between;margin-bottom:8px"},
        h("div",{style:"color:#6B6355;font-size:13px;letter-spacing:.08em"},"FORFAIT EN COURS"),
        h("div",{style:"color:#9C7A2E;font-size:12px;font-weight:700"}, (c.forfaitUtilisees||0) + " / " + c.forfaitTotal + " séances")
      ));
      forfaitBox.appendChild(h("div",{style:"font-size:14px;color:#2E2A20;margin-bottom:8px"}, c.forfaitNom));
      const barBg = h("div",{style:"background:#E4DAC0;border-radius:6px;height:8px;overflow:hidden"});
      barBg.appendChild(h("div",{style:"background:#4a9e6a;height:100%;width:"+pct+"%"}));
      forfaitBox.appendChild(barBg);
      wrap.appendChild(forfaitBox);
    }
    if (c.notes) {
      wrap.appendChild(h("div",{style:"margin-top:18px"},
        h("div",{style:"color:#6B6355;font-size:13px;letter-spacing:.08em;margin-bottom:5px"},"NOTES"),
        h("div",{style:"color:#5A5648;font-size:14px;line-height:1.7;background:#FFFFFF;padding:12px 16px;border-radius:8px;border:1px solid #E4DAC0"},c.notes)
      ));
    }
    const row = h("div",{style:"display:flex;gap:10px;margin-top:22px"});
    const editBtn = h("button",{class:"btn"},"Modifier");
    editBtn.addEventListener("click",()=>{ editMode=true; showEdit(); });
    const delBtn = h("button",{class:"btn-g",style:"color:#d07070;border-color:#d0707044;margin-left:auto"},"Supprimer");
    delBtn.addEventListener("click",()=>{
      if (!confirm("Supprimer "+c.name+" ?")) return;
      state.clients = state.clients.filter(x=>x.id!==c.id);
      save(); setState({selClientId:null});
    });
    row.appendChild(editBtn); row.appendChild(delBtn);
    wrap.appendChild(row);
  }

  function showEdit() {
    wrap.innerHTML="";
    const ed = {...c};
    const g = h("div",{class:"grid2",style:"gap:12px"});
    const n = inputEl({value:c.name, onInput:v=>ed.name=v}); g.appendChild(field("PRÉNOM & NOM",n));
    const a = inputEl({type:"number",value:c.age||"", onInput:v=>ed.age=v}); g.appendChild(field("ÂGE",a));
    const p = selectEl({options:PROFILES,value:c.profile,onChange:v=>ed.profile=v}); g.appendChild(field("PROFIL",p));
    const s = selectEl({options:["actif","pause","terminé"],value:c.status,onChange:v=>ed.status=v}); g.appendChild(field("STATUT",s));
    const em = inputEl({type:"email",value:c.email||"",onInput:v=>ed.email=v}); g.appendChild(field("EMAIL",em));
    const tl = inputEl({type:"tel",value:c.tel||"",onInput:v=>ed.tel=v}); g.appendChild(field("TÉLÉPHONE",tl));
    const ob = h("div",{class:"span2"}); const oi = inputEl({value:c.objective||"",onInput:v=>ed.objective=v}); ob.appendChild(field("OBJECTIF",oi)); g.appendChild(ob);
    const db = h("div",{}); const di = inputEl({type:"date",value:c.nextSession||"",onChange:v=>ed.nextSession=v}); db.appendChild(field("PROCHAINE SÉANCE",di)); g.appendChild(db);
    wrap.appendChild(g);
    const nt = textareaEl({value:c.notes||"",height:"80px",onInput:v=>ed.notes=v});
    wrap.appendChild(h("div",{style:"margin-top:12px"},field("NOTES",nt)));
    const row = h("div",{style:"display:flex;gap:10px;margin-top:16px"});
    const sv = h("button",{class:"btn"},"Enregistrer");
    sv.addEventListener("click",()=>{
      Object.assign(c,ed);
      state.clients = state.clients.map(x=>x.id===c.id?c:x);
      save(); editMode=false; showView();
    });
    const ca = h("button",{class:"btn-g"},"Annuler");
    ca.addEventListener("click",()=>{ editMode=false; showView(); });
    row.appendChild(sv); row.appendChild(ca);
    wrap.appendChild(row);
  }

  showView();
  return wrap;
}

function buildPaiements(c) {
  const wrap = h("div",{});
  let showForm = false;
  let newPay = {date:"",montant:"",statut:"payé"};

  function render2() {
    wrap.innerHTML="";
    if (!c.paiements) c.paiements=[];
    const totalPaye = c.paiements.filter(p=>p.statut==="payé").reduce((s,p)=>s+Number(p.montant||0),0);
    const totalAttente = c.paiements.filter(p=>p.statut==="en attente").reduce((s,p)=>s+Number(p.montant||0),0);

    const summary = h("div",{style:"display:flex;gap:20px;margin-bottom:14px"},
      h("div",{},h("div",{style:"color:#6B6355;font-size:13px"},"ENCAISSÉ"),h("div",{style:"color:#4a9e6a;font-size:20px;font-weight:700"},totalPaye.toFixed(0)+" €")),
      h("div",{},h("div",{style:"color:#6B6355;font-size:13px"},"EN ATTENTE"),h("div",{style:"color:#9C7A2E;font-size:20px;font-weight:700"},totalAttente.toFixed(0)+" €"))
    );
    const addBtn = h("button",{class:"btn-sm",style:"border-color:#9C7A2E44;color:#9C7A2E;margin-left:auto"},showForm?"✕ Annuler":"+ Ajouter");
    addBtn.addEventListener("click",()=>{ showForm=!showForm; newPay={date:"",montant:"",statut:"payé"}; render2(); });
    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"}, summary, addBtn);
    wrap.appendChild(hdr);

    if (showForm) {
      const box = h("div",{class:"card",style:"padding:16px;margin-bottom:14px;border-color:#9C7A2E33"});
      const g = h("div",{class:"grid2",style:"margin-bottom:10px"});
      const da = inputEl({type:"date",onChange:v=>newPay.date=v});
      g.appendChild(field("DATE",da));
      const mo = inputEl({type:"number",placeholder:"Ex: 80",onInput:v=>newPay.montant=v});
      g.appendChild(field("MONTANT (€)",mo));
      const st = selectEl({options:["payé","en attente"],value:"payé",onChange:v=>newPay.statut=v});
      g.appendChild(field("STATUT",st));
      box.appendChild(g);
      const sv = h("button",{class:"btn",style:"padding:8px 18px;font-size:13px"},"Ajouter");
      sv.addEventListener("click",()=>{
        if (!newPay.montant || !newPay.date) return;
        c.paiements.push({...newPay,id:Date.now()+""});
        state.clients = state.clients.map(x=>x.id===c.id?c:x);
        save(); showForm=false; render2();
      });
      box.appendChild(sv);
      wrap.appendChild(box);
    }

    if (!c.paiements.length) {
      wrap.appendChild(h("p",{style:"color:#6B6355;font-size:13px;padding:16px 0"},"Aucun paiement enregistré."));
    } else {
      [...c.paiements].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(pay => {
        const col = pay.statut==="payé" ? "#4a9e6a" : "#9C7A2E";
        const del = h("button",{style:"background:transparent;border:none;cursor:pointer;color:#6B6355;font-size:18px;padding:0 4px"},"×");
        del.addEventListener("click",()=>{
          c.paiements = c.paiements.filter(x=>x.id!==pay.id);
          state.clients = state.clients.map(x=>x.id===c.id?c:x);
          save(); render2();
        });
        const badge = h("span",{style:`padding:2px 8px;border-radius:20px;background:${col}18;color:${col};font-size:12px;font-weight:600`},pay.statut);

    const filtered = BIBLIO.filter(r => {
      const mC = state.bibCat==="Tous" || r.cat===state.bibCat;

        )
      );

      const copyBtn = h("button",{class:"btn-sm",style:"font-size:13px"},"Copier");
      copyBtn.addEventListener("click",e=>{
        e.stopPropagation();
        try { navigator.clipboard.writeText(r.titre+"\n\n"+r.contenu); } catch(e){}
        copyBtn.textContent="✓ Copié"; copyBtn.style.color="#4a9e6a"; copyBtn.style.borderColor="#4a9e6a44";

let _renderScheduled = false;
function render() {
  if (_renderScheduled) return;
  _renderScheduled = true;
  Promise.resolve().then(() => {
    _renderScheduled = false;
    renderNow();
  });
}

function renderNow() {
  renderNav();
  const main = document.getElementById("main");
  main.innerHTML = "";

  let content;
  if (state.tab==="dashboard")    content = renderDashboard();
  else if (state.tab==="clients") content = renderClients();
  else if (state.tab==="agenda") content = renderAgendaTab();
  else if (state.tab==="finances") content = renderFinancesTab();
  else if (state.tab==="clairiere") content = renderClairiereTab();
  else if (state.tab==="reconversion") content = renderReconversionTab();
  else if (state.tab==="deroules") content = renderDeroulesTab();
  else if (state.tab==="rdv") content = renderRdvTab();
  else if (state.tab==="reglages") content = renderReglagesTab();
  else if (state.tab==="bibliotheque") content = renderBibliotheque();
  else if (state.tab==="ressources")   content = renderRessources();
  else if (state.tab==="notes")        content = renderNotes();
  else content = renderDashboard();

  main.appendChild(content);
}

(function() {

  btn.addEventListener('click', function() {
    collapsed = !collapsed;
    sidebar.classList.toggle('collapsed', collapsed);
    btn.textContent = collapsed ? '›' : '‹';
    btn.title = collapsed ? 'Ouvrir le panneau' : 'Réduire le panneau';
  });

  // Tiroir mobile
  const menuBtn = document.getElementById('mobileMenuBtn');
  const overlay = document.getElementById('mobileOverlay');
  function ouvrirMenu() {
    sidebar.classList.add('mobile-open');
    overlay.classList.add('show');
  }
  function fermerMenu() {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('show');
  }
  menuBtn.addEventListener('click', function() {
    if (sidebar.classList.contains('mobile-open')) fermerMenu(); else ouvrirMenu();
  });
  overlay.addEventListener('click', fermerMenu);
  sidebar.addEventListener('click', function(e) {
    if (e.target.closest('.nav-item')) fermerMenu();
  });
})();

        <input type="checkbox" class="hpi-check" data-i="${i}" style="width:18px;height:18px;cursor:pointer;">
        <span>${t}</span>
      </label>`;
    });
    html += `</div>`;
    
    // HSP
    html += `<div class="qform">
      <h4>✨ Traits HSP</h4>`;
    HSP_TRAITS.forEach((t, i) => {
      html += `<label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <input type="checkbox" class="hsp-check" data-i="${i}" style="width:18px;height:18px;cursor:pointer;">
        <span>${t}</span>
      </label>`;
    });
    html += `</div>`;
    
    // Burnout
    html += `<div class="qform">
      <h4>📉 Niveau d'épuisement (0-10)</h4>
      <input type="range" id="burnoutSlider" min="0" max="10" value="5" style="width:100%;margin:10px 0;">
      <div style="text-align:center;font-weight:bold;color:#9C7A2E;" id="burnoutValue">5/10</div>
    </div>`;
    
    html += `<button type="submit" class="btn" style="width:100%;margin-top:20px;">✨ Calculer mon profil</button>`;
    html += `</form>`;
  }
  
  document.getElementById('main').innerHTML = html;
  
  // Listeners
  document.querySelectorAll('#burnoutSlider').forEach(el => {
    el.addEventListener('input', (e) => {
      document.getElementById('burnoutValue').textContent = e.target.value + '/10';
    });
  });
}

function submitIntake(e, clientId) {
  e.preventDefault();
  
  // Calculer scores
  const asrsAnswers = document.querySelectorAll('.asrs-btn.selected');
  const asrsScore = Array.from(asrsAnswers).reduce((sum, el) => sum + parseInt(el.dataset.v), 0);
  
  const hpiChecks = document.querySelectorAll('.hpi-check:checked');
  const hpiScore = hpiChecks.length;
  
  const hspChecks = document.querySelectorAll('.hsp-check:checked');
  const hspScore = hspChecks.length;
  
  const burnout = parseInt(document.getElementById('burnoutSlider').value);
  
  // Déterminer profil
  let profile = [];
  if (asrsScore >= 13) profile.push('TDAH');
  if (hpiScore >= 3) profile.push('HPI');
  if (hspScore >= 3) profile.push('HSP');
  
  profile = profile.length > 0 ? profile.join('+') : 'Autres';
  
  // Déterminer sévérité
  const severity = (asrsScore / 24 + burnout / 10) / 2;
  let severityLabel = severity > 0.67 ? 'SÉVÈRE' : (severity > 0.33 ? 'MODÉRÉ' : 'LÉGER');
  
  // Recommander timing (simplifié)
  const timingMap = {
    'TDAH-LÉGER': {duration: 45, freq: 1.5},
    'TDAH-MODÉRÉ': {duration: 45, freq: 2},
    'TDAH-SÉVÈRE': {duration: 30, freq: 2.5},
    'HPI-LÉGER': {duration: 75, freq: 1},
    'HPI-MODÉRÉ': {duration: 60, freq: 1.5},
    'HPI+TDAH': {duration: 45, freq: 2},
  };
  
  let timing = {duration: 45, frequency: 1.5};
  if (profile === 'TDAH') {
    timing = timingMap[`TDAH-${severityLabel}`] || timing;
  } else if (profile === 'HPI') {
    timing = timingMap[`HPI-${severityLabel}`] || timing;
  } else if (profile === 'HPI+TDAH') {
    timing = timingMap['HPI+TDAH'];
  }
  
  const intakeData = {
    profile,
    severity: severityLabel,
    asrsScore,
    hpiScore,
    hspScore,
    burnout,
    timing: {duration: timing.duration, frequency: timing.freq},
    date: new Date().toISOString()
  };
  
  // Sauver
  state.clients[clientId].intake = intakeData;
  localStorage.setItem('coaching_state', JSON.stringify(state));
  
  if (db) {
    db.collection('clients').doc(clientId).update({
      intake: intakeData,
      intakeDate: new Date()
    }).catch(err => console.warn('Firebase offline'));
  }
  
  showIntakeTab(clientId);
}

function editIntake(clientId) {
  state.clients[clientId].intake = null;
  showIntakeTab(clientId);
}

function selectASRS(btn) {
  const q = btn.dataset.q;
  document.querySelectorAll(`[data-q="${q}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

// === FUNCTIONS LIVE ===

function showLiveTab(clientId) {
  const client = state.clients[clientId];
  
  if (!client.intake) {
    alert('❌ Compléter l\'INTAKE d\'abord');
    return;
  }
  
  liveSession.clientId = clientId;
  liveSession.step = 'welcome';
  renderLiveWelcome(client);
}

function renderLiveWelcome(client) {

    <h2>🧠 Séance de Neuro-Coaching En Live</h2>
    <div class="qform" style="background:#e6f1fb;border-left:4px solid #378add;">
      <h3>${client.name}</h3>
      <div><strong>Profil:</strong> <span style="background:#${PC[client.profile] || '#ccc'};color:white;padding:3px 8px;border-radius:3px;font-size:12px;">${client.profile}</span></div>
      <div style="margin-top:8px;"><strong>Timing:</strong> ${client.intake.timing.duration} min × ${client.intake.timing.frequency}x/sem</div>
    </div>
    
    <div class="qform">
      <label class="lbl">Niveau d'énergie/charge immédiat (1-10)</label>
      <input type="range" id="liveEnergy" min="1" max="10" value="5" style="margin:10px 0;">
      <div style="text-align:center;font-weight:bold;color:#9C7A2E;" id="liveEnergyValue">5/10</div>
    </div>
    
    <div class="qform">
      <label class="lbl">Notes contexte</label>
      <textarea id="liveNotes" placeholder="Observations préalables..." style="height:80px;"></textarea>
    </div>
    
    <button class="btn" onclick="goToLiveBranch()" style="width:100%;margin-top:20px;">➔ Diagnostic branche</button>
  `;
  
  document.getElementById('main').innerHTML = html;
  
  document.getElementById('liveEnergy').addEventListener('input', (e) => {
    liveSession.clientEnergy = e.target.value;
    document.getElementById('liveEnergyValue').textContent = e.target.value + '/10';
  });
  
  document.getElementById('liveNotes').addEventListener('input', (e) => {
    liveSession.notes = e.target.value;
  });
}

function goToLiveBranch() {
  liveSession.step = 'branch';
  let html = `<h2>🧠 Étape 1: État neuro-fonctionnel immédiat</h2>`;
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin:20px 0;">`;
  
  Object.entries(LIVE_BRANCHES).forEach(([key, branch]) => {
    html += `
      <div onclick="selectLiveBranch('${key}')" style="border:2px solid #ddd;padding:20px;border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;">
        <div style="font-size:2.5rem;margin-bottom:10px;">${branch.emoji}</div>
        <div style="font-weight:600;margin-bottom:6px;">${branch.label}</div>
        <div style="font-size:13px;color:#6B6355;">${branch.options.length} options</div>
      </div>
    `;
  });
  
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function selectLiveBranch(branchId) {
  liveSession.branch = LIVE_BRANCHES[branchId];
  liveSession.step = 'option';
  
  let html = `<h2>${liveSession.branch.emoji} Étape 2: Approche</h2>`;
  html += `<div class="qform" style="background:#ecfdf5;border-left:4px solid #059669;margin-bottom:20px;font-size:13px;">${liveSession.branch.science}</div>`;
  html += `<div style="display:flex;flex-direction:column;gap:10px;">`;
  
  liveSession.branch.options.forEach(opt => {
    html += `
      <button onclick="selectLiveOption('${opt.id}')" class="btn-g" style="text-align:left;padding:15px;font-weight:600;">
        ${opt.name}
        <div style="font-size:12px;color:#6B6355;font-weight:400;margin-top:4px;">Champs: ${opt.fields.join(', ')}</div>
      </button>
    `;
  });
  
  html += `</div><button class="btn-g" onclick="goToLiveBranch()" style="margin-top:20px;">← Retour</button>`;
  document.getElementById('main').innerHTML = html;
}

function selectLiveOption(optionId) {
  liveSession.option = LIVE_BRANCHES[liveSession.branch.id].options.find(o => o.id === optionId);
  liveSession.step = 'form';
  
  let html = `<h2>${liveSession.branch.emoji} ${liveSession.branch.id} — ${liveSession.option.name}</h2>`;
  html += `<form id="liveForm" onsubmit="generateLiveScript(event)">`;
  
  liveSession.option.fields.forEach(field => {
    let label = {
      observation: 'Observation neutre (OSBD)',
      emotion: 'Émotion dominante',
      idea: 'Idée/Projet en hyperfocus',
      priority: 'Objectif prioritaire',
      blockedTask: 'Tâche bloquée',
      fear: 'Peur/Frein identifié',
      firstStep: 'Premier pas (2 min max)',
      resource: 'Ressource à activer',
      saturatedBy: 'Saturé par...',
      needFor: 'Besoin de...',
      stimulus: 'Stimulus excitant',
      mainGoal: 'Objectif principal',
      reward: 'Source dopaminergique'
    }[field] || field;
    
    html += `<div class="qform">
      <label class="lbl">${label}</label>
      <textarea id="field_${field}" data-field="${field}" placeholder="..." style="height:60px;"></textarea>
    </div>`;
  });
  
  html += `<button type="submit" class="btn" style="width:100%;">🗣️ Générer script</button>`;
  html += `</form>`;
  
  document.getElementById('main').innerHTML = html;
}

function generateLiveScript(e) {
  e.preventDefault();
  
  liveSession.values = {};
  liveSession.option.fields.forEach(field => {
    liveSession.values[field] = document.getElementById(`field_${field}`).value;
  });
  
  const template = SCRIPTS_TEMPLATES[liveSession.option.id];
  liveSession.script = template ? template(liveSession.values) : "Script template non trouvé";
  
  liveSession.step = 'action';
  renderLiveAction();
}

function renderLiveAction() {
  let html = `<h2>🎯 Synthèse & Engagements</h2>`;
  
  html += `<div class="qform" style="background:#f3e8ff;border-left:4px solid #7c3aed;">
    <h4>🗣️ Script coaching (éditable)</h4>
    <div id="scriptBox" contenteditable="true" style="background:#ffffff;border:1px solid #c084fc;border-radius:6px;padding:15px;min-height:100px;font-size:14px;line-height:1.6;outline:none;" onblur="liveSession.script = this.innerHTML">${liveSession.script}</div>
  </div>`;
  
  html += `<div class="qform">
    <label class="lbl">💡 Boîte à idées (tangentes)</label>
    <textarea id="liveIdeaBox" placeholder="Idées à explorer plus tard..." style="height:60px;"></textarea>
  </div>`;
  
  html += `<div class="qform">
    <label class="lbl">🎯 Micro-action engagée (<48h)</label>
    <input type="text" id="liveMicroAction" placeholder="Action spécifique et mesurable..." style="height:auto;">
  </div>`;
  
  html += `<div class="qform">
    <label class="lbl">📅 Suivi inter-séance</label>
    <select id="liveFollowUp" style="height:auto;">
      <option value="J+2">Message flash à J+2</option>
      <option value="J+7">Bilan complet à J+7</option>
      <option value="next">Prochaine séance</option>
    </select>
  </div>`;
  
  html += `<button class="btn" onclick="saveLiveSession()" style="width:100%;margin-top:20px;">💾 Enregistrer la séance</button>`;
  html += `<button class="btn-g" onclick="goToLiveBranch()" style="width:100%;margin-top:8px;">← Retour</button>`;
  
  document.getElementById('main').innerHTML = html;
  
  document.getElementById('liveIdeaBox').value = liveSession.ideaBox;
  document.getElementById('liveMicroAction').value = liveSession.microAction;
  document.getElementById('liveFollowUp').value = liveSession.followUp;
  
  document.getElementById('liveIdeaBox').addEventListener('input', (e) => {
    liveSession.ideaBox = e.target.value;
  });
  
  document.getElementById('liveMicroAction').addEventListener('input', (e) => {
    liveSession.microAction = e.target.value;
  });
  
  document.getElementById('liveFollowUp').addEventListener('change', (e) => {
    liveSession.followUp = e.target.value;
  });
}

function saveLiveSession() {
  liveSession.script = document.getElementById('scriptBox').innerHTML;
  
  const sessionData = {
    clientId: liveSession.clientId,
    date: new Date().toISOString(),
    energy: liveSession.clientEnergy,
    notes: liveSession.notes,
    branch: liveSession.branch.id,
    branchLabel: liveSession.branch.label,
    option: liveSession.option.id,
    optionName: liveSession.option.name,
    values: liveSession.values,
    script: liveSession.script,
    microAction: liveSession.microAction,
    ideaBox: liveSession.ideaBox,
    followUp: liveSession.followUp,
    intake: state.clients[liveSession.clientId].intake
  };
  
  // Sauver localStorage
  if (!state.sessions) state.sessions = {};
  if (!state.sessions[liveSession.clientId]) state.sessions[liveSession.clientId] = [];
  state.sessions[liveSession.clientId].unshift(sessionData);
  localStorage.setItem('coaching_state', JSON.stringify(state));
  
  // Sauver Firebase
  if (db) {
    db.collection('sessions').add(sessionData).catch(err => console.warn('Firebase offline'));
  }
  
  alert('✅ Séance enregistrée!');
  
  // Rafraîchir affichage fiche client
  showClientFiche(liveSession.clientId);
}
