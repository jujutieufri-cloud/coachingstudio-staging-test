function renderNotes() {
  const wrap = h("div",{class:"fade",style:"display:flex;flex-direction:column;height:calc(100vh - 64px)"});
  const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-shrink:0"},
    h("div",{},
      h("h1",{style:"font-size:30px;color:#2E2A20;font-weight:600;font-style:italic"},"Journal de Bord"),
      h("p",{style:"color:#5A5648;font-size:13px;margin-top:4px"},"Notes libres, réflexions, observations de pratique")
    )
  );
  const savedLbl = h("span",{style:"color:#4a9e6a99;font-size:12px;font-style:italic"},"✓ Sauvegardé");
  hdr.appendChild(savedLbl);
  wrap.appendChild(hdr);

  const ta = document.createElement("textarea");
  ta.id = "notesArea";
  ta.value = state.notes;
  ta.placeholder = "Notes libres…\n\nIdées, réflexions, observations, formations…\n\nTout est sauvegardé automatiquement.";
  ta.style.cssText = "flex:1;line-height:1.9;padding:22px;font-size:14px;border-radius:14px;min-height:0;width:100%;background:#FFFFFF;border:1px solid #D8CBA8;border-radius:14px;color:#2E2A20;font-family:inherit;resize:none;outline:none";
  ta.addEventListener("input", e => {
    state.notes = e.target.value;
    savedLbl.textContent = "…";
    savedLbl.style.color = "#6B6355";
    clearTimeout(notesTimer);
    notesTimer = setTimeout(()=>{
      localStorage.setItem("cs4-notes", state.notes);
      savedLbl.textContent = "✓ Sauvegardé";
      savedLbl.style.color = "#4a9e6a99";
    }, 800);
  });
  ta.addEventListener("focus", e => { ta.style.borderColor="#9C7A2E"; });
  ta.addEventListener("blur", e => { ta.style.borderColor="#D8CBA8"; });
  wrap.appendChild(ta);
  return wrap;
}

// ══════════════════════════════════════════
//  RENDER PRINCIPAL
// ══════════════════════════════════════════
let _renderScheduled = false;
function render() {
  if (_renderScheduled) return;
  _renderScheduled = true;
  Promise.resolve().then(() => {
    _renderScheduled = false;
    renderNow();
  });
}

function renderNow() {
  renderNav();
  const main = document.getElementById("main");
  main.innerHTML = "";

  let content;
  if (state.tab==="dashboard")    content = renderDashboard();
  else if (state.tab==="clients") content = renderClients();
  else if (state.tab==="agenda") content = renderAgendaTab();
  else if (state.tab==="finances") content = renderFinancesTab();
  else if (state.tab==="clairiere") content = renderClairiereTab();
  else if (state.tab==="rdv") content = renderRdvTab();
  else if (state.tab==="reglages") content = renderReglagesTab();
  else if (state.tab==="bibliotheque") content = renderBibliotheque();
  else if (state.tab==="ressources")   content = renderRessources();
  else if (state.tab==="notes")        content = renderNotes();
  else content = renderDashboard();

  main.appendChild(content);
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
render();

// ══════════════════════════════════════════
//  TOGGLE SIDEBAR
// ══════════════════════════════════════════
(function() {
  const sidebar = document.getElementById('sidebar');
  const btn = document.getElementById('toggleBtn');
  let collapsed = false;
  btn.addEventListener('click', function() {
    collapsed = !collapsed;
    sidebar.classList.toggle('collapsed', collapsed);
    btn.textContent = collapsed ? '›' : '‹';
    btn.title = collapsed ? 'Ouvrir le panneau' : 'Réduire le panneau';
  });

  // Tiroir mobile
  const menuBtn = document.getElementById('mobileMenuBtn');
  const overlay = document.getElementById('mobileOverlay');
  function ouvrirMenu() {
    sidebar.classList.add('mobile-open');
    overlay.classList.add('show');
  }
  function fermerMenu() {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('show');
  }
  menuBtn.addEventListener('click', function() {
    if (sidebar.classList.contains('mobile-open')) fermerMenu(); else ouvrirMenu();
  });
  overlay.addEventListener('click', fermerMenu);
  sidebar.addEventListener('click', function(e) {
    if (e.target.closest('.nav-item')) fermerMenu();
  });
})();
</script>
