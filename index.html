<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CoachingStudio</title>
<link rel="icon" type="image/svg+xml" href="img/phare.svg"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:#F7F2E7;color:#2E2A20}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#FDFBF5}::-webkit-scrollbar-thumb{background:#D8CBA8;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .25s ease}
input,textarea,select{font-family:inherit;color:#2E2A20;background:#FFFFFF;border:1px solid #D8CBA8;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#9C7A2E}
input::placeholder,textarea::placeholder{color:#6B6355}
select option{background:#FBF7EC}
textarea{resize:vertical}
button{cursor:pointer;font-family:inherit;border:none;transition:opacity .15s,background .15s}
.btn{background:#9C7A2E;color:#F7F2E7;border-radius:8px;padding:9px 20px;font-weight:700;font-size:14px}
.btn:hover{opacity:.85}
.btn-g{background:transparent;color:#5A5648;border:1px solid #D8CBA8;border-radius:8px;padding:9px 16px;font-size:13px}
.btn-g:hover{background:#F0E9D8}
.btn-sm{background:transparent;color:#5A5648;border:1px solid #D8CBA8;border-radius:7px;padding:4px 11px;font-size:12px}
.btn-sm:hover{background:#F0E9D8}
.card{background:#FFFFFF;border:1px solid #E4DAC0;border-radius:14px}
.lbl{color:#5A5648;font-size:13px;display:block;margin-bottom:4px;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
#app{display:flex;height:100vh;overflow:hidden}
html,body{overflow-x:hidden;max-width:100vw}
#mobileMenuBtn{display:none}
#mobileOverlay{display:none}
@media(max-width:860px){
  #mobileMenuBtn{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:14px;left:14px;z-index:300;
    width:42px;height:42px;border-radius:10px;
    background:#FFFFFF;border:1px solid #E4DAC0;box-shadow:0 2px 10px rgba(0,0,0,.12);
    font-size:20px;color:#2E2A20;cursor:pointer;
  }
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:250;
    width:250px!important;padding:22px 10px!important;
    transform:translateX(-100%);transition:transform .25s ease;
    box-shadow:0 0 30px rgba(0,0,0,.25);
  }
  #sidebar.mobile-open{transform:translateX(0)}
  #sidebar.collapsed{width:250px}
  #sidebar.collapsed .brand,#sidebar.collapsed .sidebar-foot,#sidebar.collapsed .nav-label,#sidebar.collapsed .dot,#sidebar.collapsed .badge,#sidebar.collapsed .divider{display:flex!important}
  #sidebar .toggle-btn{display:none}
  #mobileOverlay.show{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:240;
  }
  #main{width:100%;padding:70px 16px 24px!important}
  .card{max-width:100%!important;box-sizing:border-box}
  .grid2{grid-template-columns:1fr!important}
}
@media(max-width:600px){
  div[style*="grid-template-columns:repeat(5,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
  div[style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
  div[style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr!important}
}

/* Sidebar */
#sidebar{width:224px;background:#FFFFFF;border-right:1px solid #E4DAC0;display:flex;flex-direction:column;padding:22px 10px;flex-shrink:0;transition:width .25s ease,padding .25s ease;overflow:hidden}
#sidebar.collapsed{width:52px;padding:12px 8px}
#sidebar.collapsed .brand,#sidebar.collapsed .sidebar-foot,#sidebar.collapsed .nav-label,#sidebar.collapsed .dot,#sidebar.collapsed .badge,#sidebar.collapsed .divider{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px;font-size:17px}
#sidebar.collapsed .toggle-btn{margin:0 auto}
.brand{padding-left:8px;margin-bottom:28px}
.brand h1{font-size:22px;color:#2E2A20;font-weight:700}.brand h1 span{color:#9C7A2E}
.brand p{color:#6B6355;font-size:12px;letter-spacing:.12em;margin-top:3px}
.divider{height:1px;background:#E4DAC0;margin:8px 0}
nav{flex:1}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:10px;border:none;background:transparent;color:#5A5648;font-size:13.5px;font-weight:400;margin-bottom:3px;text-align:left;white-space:nowrap}
.nav-cat-label{padding:14px 14px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9C7A2E;opacity:.75}
#sidebar.collapsed .nav-cat-label{display:none}
.nav-item:hover{background:#F0E9D8;color:#2E2A20}
.nav-item.active{background:#9C7A2E18;color:#9C7A2E;font-weight:700}
.nav-item .dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:#9C7A2E;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:#9C7A2E30;color:#9C7A2E;border-radius:20px;padding:1px 8px;font-size:13px;font-weight:700;flex-shrink:0}
.sidebar-foot{padding-left:8px;padding-top:12px;color:#6B6355;font-size:12px;line-height:1.7}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #D8CBA8;background:transparent;color:#5A5648;font-size:15px;cursor:pointer;transition:background .15s,color .15s;flex-shrink:0}
.toggle-btn:hover{background:#F0E9D8;color:#9C7A2E}
.toggle-row{display:flex;justify-content:flex-end;margin-bottom:16px}
/* Main */
#main{flex:1;overflow-y:auto;padding:32px 36px}
/* Badges */
.badge-profil{display:inline-block;border-radius:20px;padding:2px 9px;font-size:13px;font-weight:700}
.status-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.cat-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700}
/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
/* Lists */
.client-row{padding:15px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:background .15s;flex-wrap:wrap}
@media(max-width:600px){.client-row{gap:10px}.client-row>div:last-of-type{flex-direction:row!important;align-items:center!important}}
.client-row:hover{background:#F0E9D8}
/* Subtabs */
.subtabs{display:flex;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid #E4DAC0}
.subtab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:#5A5648;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.active{color:#9C7A2E;font-weight:700;border-bottom-color:#9C7A2E}
/* Stat cards */
.stat-card{padding:18px;display:flex;align-items:center;gap:14px}
.stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.stat-lbl{font-size:13px;color:#5A5648;margin-top:3px}
/* Biblio */
.fiche-body{margin-top:16px;padding:16px 18px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;color:#5A5648;font-size:13.5px;line-height:2;white-space:pre-wrap;display:none}
.fiche-body.open{display:block}
/* Session row */
.sess-row{display:flex;gap:12px;padding:12px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;margin-bottom:8px}
.sess-num{width:26px;height:26px;border-radius:50%;background:#9C7A2E18;color:#9C7A2E;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
/* Obj row */
.obj-row{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;margin-bottom:8px}
.obj-check{width:22px;height:22px;border-radius:6px;border:2px solid;background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;cursor:pointer}
/* Progress bar */
.prog-track{height:3px;background:#E4DAC0;border-radius:4px;margin-top:4px}
.prog-bar{height:3px;border-radius:4px}
/* Action buttons on dashboard */
.action-card{padding:18px;cursor:pointer;text-align:center;border-radius:14px;border:1px dashed;transition:background .15s}
/* Quick form */
.qform{padding:24px;margin-bottom:20px;border-radius:14px;border:1px solid #9C7A2E44;background:#FFFFFF}
/* Notes textarea */
#notesArea{flex:1;line-height:1.9;padding:22px;font-size:14px;border-radius:14px;min-height:0}
/* Tooltip */
.copied{color:#4a9e6a!important;border-color:#4a9e6a44!important}
/* Accordion arrow */
.arr{color:#6B6355;font-size:18px;user-select:none}
</style>
</head>
<body>
<button id="mobileMenuBtn" title="Menu">☰</button>
<div id="mobileOverlay"></div>
<div id="app">
  <div id="sidebar">
    <div class="toggle-row">
      <button class="toggle-btn" id="toggleBtn" title="Réduire le panneau">&#8249;</button>
    </div>
    <div class="brand" style="display:flex;align-items:center;gap:10px">
      <img src="img/logo.png" alt="Julien Coaching" style="height:50px;width:auto;flex-shrink:0">
      <div>
        <h1>Coach<span>Studio</span></h1>
        <p>PROFILS ATYPIQUES</p>
      </div>
    </div>
    <div class="divider"></div>
    <nav id="nav"></nav>
    <div class="divider"></div>
    <div class="sidebar-foot" id="sidefoot"></div>
    <div style="padding:10px 18px 16px;display:flex;gap:8px;">
      <button id="btnExport" class="btn-g" style="flex:1;font-size:13px;padding:7px 8px;">⬇ Sauvegarder</button>
      <button id="btnImport" class="btn-g" style="flex:1;font-size:13px;padding:7px 8px;">⬆ Restaurer</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
    </div>
  </div>
  <div id="main"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ══════════════════════════════════════════
//  DONNÉES & CONFIG
// ══════════════════════════════════════════
const PC = {HPI:"#9880d0",HSP:"#d4885a",TDAH:"#5aaec8","HPI+HSP":"#b87898","HPI+TDAH":"#8090c8","HSP+TDAH":"#88a8b0",Mixte:"#4a9e6a"};
const PROFILES = ["HPI","HSP","TDAH","HPI+HSP","HPI+TDAH","HSP+TDAH","Mixte"];
const CAT_COLORS = {"Questions puissantes":"#9C7A2E","NLP":"#9880d0","Sophrologie & somatique":"#5ab8a8","Protocole burnout":"#d07070","Outils pratiques":"#4a9e6a","Communication assertive":"#5aaec8","Régulation émotionnelle":"#d4885a"};

const SAMPLE = [
  {id:"s1",name:"Sophie M.",profile:"HPI+HSP",age:34,objective:"Gestion du burnout et reconnexion à soi",sessions:4,nextSession:"2026-03-18",status:"actif",notes:"Très analytique. Réagit bien aux métaphores.",sessionHistory:["Séance 1 — Accueil, exploration burnout","Séance 2 — Croyances limitantes (NLP)","Séance 3 — Roue de vie","Séance 4 — Plan de reconnexion"],objectifs:[{id:"o1",titre:"Poser des limites avec sa hiérarchie",echeance:"2026-04-01",statut:"en cours"},{id:"o2",titre:"Cohérence cardiaque chaque matin",echeance:"",statut:"atteint"}]},
  {id:"s2",name:"Thomas K.",profile:"TDAH",age:28,objective:"Organisation et gestion du temps",sessions:2,nextSession:"2026-03-20",status:"actif",notes:"Préfère les outils visuels et étapes courtes.",sessionHistory:["Séance 1 — Exploration TDAH","Séance 2 — Système 3 blocs"],objectifs:[{id:"o3",titre:"Appliquer le système 3 blocs 2 semaines",echeance:"2026-04-05",statut:"en cours"}]},
];

const BIBLIO = [
  {id:"q1",cat:"Questions puissantes",profil:"Tous",titre:"Ouverture & exploration",source:"Meta-Coaching — Hall & Duval",
   contenu:`1. Qu'est-ce qui est le plus important pour toi là, maintenant ?
2. Si tu n'avais aucune limite, que ferais-tu ?
3. Qu'est-ce que cette situation te coûte de ne pas changer ?
4. De quoi as-tu besoin pour avancer ?
5. Qu'est-ce qui serait différent si ce problème était résolu ?
6. Qu'est-ce que tu sais déjà, au fond de toi ?
7. Quel serait le premier petit pas possible aujourd'hui ?`},
  {id:"q2",cat:"Questions puissantes",profil:"HPI",titre:"Décélération & ancrage (HPI)",source:"Assenheim — Mon Cerveau est Hyper",
   contenu:`1. Parmi toutes ces idées, laquelle résonne le plus avec qui tu es vraiment ?
2. Si tu devais choisir UNE seule priorité cette semaine, laquelle ?
3. Qu'est-ce que tu ressens dans ton corps quand tu penses à ça ?
4. Tu analyses beaucoup — qu'est-ce que TOI tu veux vraiment ?
5. À quel moment tu t'es senti pleinement toi-même récemment ?`},
  {id:"q3",cat:"Questions puissantes",profil:"HSP",titre:"Validation & besoins (HSP)",source:"Coaching HSP — approche somatique",
   contenu:`1. Qu'est-ce que tu as absorbé des autres aujourd'hui qui n'est pas le tien ?
2. Où dans ton corps ressens-tu ça ?
3. Qu'est-ce dont tu as besoin pour te sentir en sécurité ici ?
4. Si ta sensibilité était un superpouvoir, comment tu l'utiliserais là ?
5. Quelle est la frontière que tu as du mal à maintenir en ce moment ?`},
  {id:"q4",cat:"Questions puissantes",profil:"TDAH",titre:"Focus & momentum (TDAH)",source:"Coaching TDAH — approche forces",
   contenu:`1. Quelle est la SEULE chose que tu ferais si tu ne pouvais en faire qu'une ?
2. Qu'est-ce qui te donne de l'énergie vs ce qui t'en prend ?
3. À quel moment de la journée tu es le plus efficace ?
4. C'est quoi le vrai obstacle : la tâche ou ce qu'elle représente ?
5. Comment rendre ça plus fun, plus rapide, plus stimulant ?`},
  {id:"n1",cat:"NLP",profil:"Tous",titre:"Recadrage de contenu",source:"NLP — Bandler & Grinder",
   contenu:`OBJECTIF : Changer la signification attribuée à un événement.

1. Identifier la croyance limitante : « Qu'est-ce que tu dis sur toi dans cette situation ? »
2. Questionner : « Est-ce TOUJOURS vrai ? Dans 100% des cas ? »
3. Proposer une autre perspective : « Et si ça signifiait autre chose ? »
4. Ancrer la nouvelle signification : « Si c'était une preuve de ta force ? »
5. Test : « Sur 1 à 10, comment tu te sens avec cette nouvelle façon de voir ? »

EXEMPLE : "Je suis trop sensible" → "Je perçois ce que les autres ne voient pas encore"`},
  {id:"n2",cat:"NLP",profil:"HPI",titre:"Ligne du temps — décision (HPI)",source:"NLP — Ligne du temps",
   contenu:`OBJECTIF : Débloquer une décision via la sagesse temporelle.

1. Imaginer une ligne du temps devant soi.
2. Avancer vers le FUTUR : « Imagine que tu as fait ce choix. Comment tu te sens ? »
3. Explorer les conséquences à 1 an, 5 ans, 10 ans.
4. Revenir au présent : « Depuis ce futur, quel conseil tu te donnes ? »
5. Ancrer la ressource : geste ou mot-clé associé à la clarté ressentie.

ADAPTÉ HPI : Le HPI visualise plusieurs futurs simultanément — choisir le plus ALIGNÉ, pas le plus optimal.`},
  {id:"n3",cat:"NLP",profil:"HSP",titre:"Ancrage ressource (HSP)",source:"NLP — Ancrage",
   contenu:`OBJECTIF : Créer une ancre corporelle de sécurité rapidement accessible.

1. Identifier un souvenir de sécurité absolue.
2. Immersion sensorielle : voir, entendre, ressentir dans le corps.
3. Au pic de l'état ressource : poser l'ancre (pression sur le poignet).
4. Répéter 3 fois pour renforcer.
5. Tester : activer l'ancre et vérifier le retour de l'état ressource.

ADAPTÉ HSP : Ancres discrètes (poignet, lobe de l'oreille) utilisables en public.`},
  {id:"n4",cat:"NLP",profil:"TDAH",titre:"Modélisation état de flow (TDAH)",source:"NLP + Csikszentmihalyi — Flow",
   contenu:`OBJECTIF : Reproduire volontairement un état de concentration intense.

1. « Rappelle-toi d'un moment où tu étais totalement absorbé. »
2. Mapping sensoriel : environnement, sensations, énergie.
3. Identifier les déclencheurs : heure, type de tâche, niveau de défi.
4. Créer un rituel d'entrée : musique, posture, durée (pomodoro 25 min).
5. Ancrer et tester.

ADAPTÉ TDAH : Le flow arrive quand la tâche est juste assez difficile — calibrer le défi.`},
  {id:"s1b",cat:"Sophrologie & somatique",profil:"Tous",titre:"Cohérence cardiaque 3-6-5",source:"Dr David O'Hare",
   contenu:`OBJECTIF : Réguler le système nerveux en 5 minutes.
→ 3 fois par jour / 6 respirations par minute / 5 minutes

1. S'installer, colonne droite.
2. Inspiration nasale : 5 secondes.
3. Expiration buccale : 5 secondes.
4. Maintenir 5 minutes.
5. Observer sans juger.

EFFETS : Réduction cortisol, clarté mentale, retour au calme.
CONSEIL : Matin + avant séance + avant de dormir.
ADAPTÉ TDAH : Utiliser une app de guidage visuel (RespiRelax).`},
  {id:"s2b",cat:"Sophrologie & somatique",profil:"HSP",titre:"Protocole de décharge sensorielle",source:"Peter Levine — Somatic Experiencing",
   contenu:`OBJECTIF : Libérer les tensions d'hyperstimulation.
DURÉE : 15-20 minutes

1. SCAN CORPOREL (3 min) : Balayer le corps de la tête aux pieds. Nommer les tensions sans les changer.

2. SECOUSSE CONSCIENTE (5 min) : Pieds écartés, laisser les genoux fléchir et vibrer doucement. Laisser monter progressivement.

3. EXPIRATION SONORE (3 min) : Inspirer profond, expirer avec un son (soupir, "aaah"). Répéter jusqu'au relâchement.

4. ANCRAGE (5 min) : S'allonger. Sentir le poids du corps. Nommer 5 choses vues, 4 entendues, 3 touchées.

SIGNAL : Bâillement spontané, chaleur dans les mains.`},
  {id:"s3b",cat:"Sophrologie & somatique",profil:"HPI",titre:"Scan de désaccélération mentale",source:"Jon Kabat-Zinn — MBSR",
   contenu:`OBJECTIF : Passer de la pensée arborescente à la présence.
DURÉE : 10 minutes

1. OBSERVATION (2 min) : Les pensées comme des nuages. Ne pas les suivre ni les repousser.

2. DESCENTE (3 min) : Attention sur les pieds → chevilles → mollets → bassin → ventre → poitrine → épaules → visage.

3. POINT DE GRAVITÉ (3 min) : Centre dans le bas-ventre. Respirer depuis ce centre.

4. QUESTION D'ANCRAGE (2 min) : « Qu'est-ce qui est vrai, là, maintenant ? » Laisser la réponse venir du corps.

ADAPTÉ HPI : Si les pensées s'emballent, les noter avant de commencer.`},
  {id:"s4b",cat:"Sophrologie & somatique",profil:"TDAH",titre:"Activation physique pré-séance",source:"Dr John Ratey — Spark",
   contenu:`OBJECTIF : Stimuler dopamine et noradrénaline avant un travail cognitif.
DURÉE : 5-10 minutes

1. ACTIVATION (2 min) : Tête de gauche à droite, cercles épaules, marche genoux levés.

2. CROISEMENTS (2 min) : Genou gauche + main droite, alternance rapide. Active les deux hémisphères.

3. RESPIRATION ACTIVANTE (2 min) : Inspiration 3 sec / rétention 1 sec / expiration forte. × 10.

4. INTENTION (1 min) : « Aujourd'hui je vais travailler sur… et je m'autorise à… »

POURQUOI : L'exercice augmente BDNF et dopamine, essentiels pour l'attention TDAH.`},
  {id:"b1b",cat:"Protocole burnout",profil:"Tous",titre:"Évaluation initiale burnout (5 axes)",source:"Christina Maslach + modèle CARE",
   contenu:`5 AXES À ÉVALUER (de 0 à 10) :

① ÉPUISEMENT PHYSIQUE
→ Signes : sommeil non récupérateur, douleurs, infections.

② ÉPUISEMENT ÉMOTIONNEL
→ Signes : émoussement, cynisme, irritabilité.

③ ÉPUISEMENT COGNITIF
→ Signes : brouillard mental, oublis, indécision.

④ PERTE DE SENS
→ Signes : détachement, sentiment d'inutilité.

⑤ ISOLEMENT
→ Signes : repli, évitement social, honte.

INTERPRÉTATION :
≤ 25 = vigilance
25-40 = burnout modéré
> 40 = arrêt recommandé`},
  {id:"b2b",cat:"Protocole burnout",profil:"HPI",titre:"Reconnecter au sens — post-burnout (HPI)",source:"Cathy Assenheim",
   contenu:`PHASE 1 — PERMISSION DE SE REPOSER (séances 1-2)
→ Déconstruire : "je dois produire pour avoir de la valeur"
→ Exercice : liste de 10 choses que tu ES, sans verbe d'action.

PHASE 2 — RÉINVENTAIRE DES FORCES (séances 3-4)
→ Roue de l'énergie : ce qui recharge vs ce qui vide.
→ Question : "Qu'est-ce que tu ferais si tu ne pouvais pas échouer ?"

PHASE 3 — RECONSTRUCTION DU SENS (séances 5-6)
→ Valeurs non négociables.
→ Contrat avec soi-même : 3 engagements.
→ Rituels de ressourcement quotidien.

VIGILANCE : Le HPI peut intellectualiser le burnout sans en vivre la guérison. Ancrer dans le corps.`},
  {id:"b3b",cat:"Protocole burnout",profil:"HSP",titre:"Récupération sensorielle (HSP)",source:"Elaine Aron + Somatic Experiencing",
   contenu:`SEMAINE 1-2 : DÉCONNEXION
→ Réduire stimuli, rituels de silence (10 min entre activités)
→ Journal des "voleurs d'énergie"

SEMAINE 3-4 : RESTAURATION
→ Nature, créativité, beauté
→ Cohérence cardiaque + marche 20 min/jour
→ Budget d'énergie : 10 jetons/jour

SEMAINE 5-6 : RECALIBRATION
→ Besoins fondamentaux non satisfaits
→ Zones tampon entre stimulations

//  SAUVEGARDE / RESTAURATION (export-import JSON)
// ══════════════════════════════════════════
function exportBackup() {
  const payload = {
    version: "cs4",
    exportedAt: new Date().toISOString(),
    clients: state.clients,
    ressources: state.ressources,
    notes: state.notes,
    appointments: state.appointments
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `coachingstudio-sauvegarde-${d}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert("Fichier invalide : impossible de lire ce JSON.");
      return;
    }
    if (!data.clients || !Array.isArray(data.clients)) {
      alert("Fichier invalide : format de sauvegarde non reconnu.");
      return;
    }

const CoachLink = {
  user: null,
  linkedFamilies: JSON.parse(localStorage.getItem("cs4-linkedFamilies") || "[]"),
  familyData: {},
  unsubs: {},

  init() {
    firebase.auth().onAuthStateChanged(u => {
      this.user = u;
      if (u) this.linkedFamilies.forEach(code => this.listen(code));
      if (u && !CoachSettings.data) CoachSettings.listen();
      if (["clairiere","rdv","reglages"].includes(state.tab)) render();

  login(email, password) {
    return firebase.auth().signInWithEmailAndPassword(email, password)
      .catch(e => { notifCoach(traduireErreurAuth(e.code)); throw e; });
  },

  logout() { firebase.auth().signOut(); },

  claimShareCode(shareCode, cb) {
    const code = (shareCode || "").trim().toUpperCase();
    if (!code) return;
    const db = firebase.firestore();
    db.collection("coachLinks").doc(code).get().then(snap => {
      if (!snap.exists) { notifCoach("Code invalide ou déjà utilisé."); return; }
      const familyCode = snap.data().familyCode;
      const famRef = db.collection("familles").doc(familyCode);
      const coachEntry = { uid: this.user.uid, email: this.user.email, addedAt: new Date().toISOString() };
      famRef.update({
        authorizedCoaches: firebase.firestore.FieldValue.arrayUnion(coachEntry),
        authorizedCoachUids: firebase.firestore.FieldValue.arrayUnion(this.user.uid)
      }).then(() => {
        db.collection("coachLinks").doc(code).delete().catch(()=>{});
        if (!this.linkedFamilies.includes(familyCode)) {
          this.linkedFamilies.push(familyCode);
          localStorage.setItem("cs4-linkedFamilies", JSON.stringify(this.linkedFamilies));
        }
        this.listen(familyCode);
        notifCoach("✅ Famille liée avec succès.");
        cb && cb();
      }).catch(e => notifCoach("Erreur : " + e.message));
    }).catch(e => notifCoach("Erreur : " + e.message));
  },

  listen(familyCode) {
    if (this.unsubs[familyCode]) return;
    const ref = firebase.firestore().collection("familles").doc(familyCode);
    this.unsubs[familyCode] = ref.onSnapshot(snap => {
      if (snap.exists) this.familyData[familyCode] = snap.data();
      if (state.tab === "clairiere") render();
    }, e => console.error("listen family:", e));
  },

  unlink(familyCode) {
    if (this.unsubs[familyCode]) { this.unsubs[familyCode](); delete this.unsubs[familyCode]; }
    this.linkedFamilies = this.linkedFamilies.filter(c => c !== familyCode);
    localStorage.setItem("cs4-linkedFamilies", JSON.stringify(this.linkedFamilies));
    delete this.familyData[familyCode];
    render();
  }
};

function computeMemberInsights(data, pid) {
  const journee = data.journee || {};
  const entries = Object.keys(journee)
    .filter(k => journee[k] && journee[k].pid === pid)
    .map(k => journee[k])
    .filter(e => e.date)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(-14);

  const routinesBySlot = (data.personRoutines && data.personRoutines[pid]) || {};
  const tasksDone = data.tasksDone || {};
  const incomplete = [];
  Object.keys(routinesBySlot).forEach(slot => {
    (routinesBySlot[slot] || []).forEach(r => {
      if (r.steps && r.steps.length) {
        r.steps.forEach(s => {
          const k = pid + '_' + slot + '_' + r.id + '_' + s.id;
          if (!tasksDone[k]) incomplete.push({slot, label: r.name + ' — ' + s.name});
        });
      } else {
        const k = pid + '_' + slot + '_' + r.id;
        if (!tasksDone[k]) incomplete.push({slot, label: r.name});
      }
    });
  });

  return { entries, incomplete };
}

function svgEnergyCurve(entries) {
  if (!entries.length) return h("div",{style:"font-size:13px;color:#6B6355;padding:6px 0"},"Pas encore de données d'énergie enregistrées.");
  const w = 240, hgt = 46, pad = 4;
  const step = entries.length > 1 ? (w - pad*2) / (entries.length - 1) : 0;
  const pts = entries.map((e,i) => {
    const val = typeof e.energie === 'number' ? e.energie : 0;
    const x = pad + i*step;
    const y = hgt - pad - (val/10)*(hgt - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", w); svg.setAttribute("height", hgt); svg.setAttribute("viewBox", `0 0 ${w} ${hgt}`);
  const poly = document.createElementNS(svgNS, "polyline");
  poly.setAttribute("points", pts);
  poly.setAttribute("fill","none"); poly.setAttribute("stroke","#4a9e6a"); poly.setAttribute("stroke-width","2");
  svg.appendChild(poly);
  return svg;
}

function renderMemberInsights(data, m) {
  const { entries, incomplete } = computeMemberInsights(data, m.id);
  const box = h("div",{style:"margin-top:8px;padding-top:8px;border-top:1px solid #D8CBA8"});

  box.appendChild(h("div",{style:"font-size:12.5px;color:#5A5648;margin-bottom:4px"},"Énergie (14 derniers jours, /10)"));
  box.appendChild(svgEnergyCurve(entries));

  if (entries.length) {

  if (incomplete.length) {

    list.appendChild(h("div",{style:"font-weight:600;margin-bottom:3px"}, "⚠️ Non complété actuellement (" + incomplete.length + ")"));
    incomplete.slice(0,5).forEach(item => {

    if (incomplete.length > 5) list.appendChild(h("div",{style:"color:#6a7a6a;font-style:italic"}, "+ " + (incomplete.length-5) + " autres"));
    box.appendChild(list);
  } else if (Object.keys((data.personRoutines||{})[m.id] || {}).length) {
    box.appendChild(h("div",{style:"margin-top:8px;font-size:13px;color:#4a9e6a"}, "✅ Toutes les routines définies sont à jour"));
  }

  return box;
}

const CoachSettings = {
  data: null,
  unsub: null,
  listen(cb) {
    if (this.unsub) return;
    this.unsub = firebase.firestore().collection("settings").doc("coach").onSnapshot(snap => {
      const raw = snap.exists ? (snap.data() || {}) : {};
      const mergedHoraires = {};
      JOURS.forEach(j => {
        const rawDay = (raw.horaires||{})[j];
        let plages;
        if (rawDay && Array.isArray(rawDay.plages)) {
          plages = [0,1].map(i => ({ ...DEFAULT_SETTINGS.horaires[j].plages[i], ...(rawDay.plages[i]||{}) }));
        } else if (rawDay && rawDay.debut) {
          // ancien format (une seule plage débi/fin) : migration en douceur
          plages = [
            { ouvert: !!rawDay.ouvert, debut: rawDay.debut, fin: rawDay.fin },
            { ...DEFAULT_SETTINGS.horaires[j].plages[1] }
          ];
        } else {
          plages = DEFAULT_SETTINGS.horaires[j].plages.map(p => ({...p}));
        }
        mergedHoraires[j] = { plages };
      });
      this.data = {
        ...DEFAULT_SETTINGS,
        ...raw,
        horaires: mergedHoraires,
        dureeRdv: raw.dureeRdv || DEFAULT_SETTINGS.dureeRdv,
        tarifs: { ...DEFAULT_SETTINGS.tarifs, ...(raw.tarifs||{}) },
        messageInfo: { ...DEFAULT_SETTINGS.messageInfo, ...(raw.messageInfo||{}) },
        conges: raw.conges || []
      };
      if (!raw.horaires) {
        // Le document n'a jamais reçu d'horaires : on les initialise
        // pour que le site public ne se retrouve jamais sans données.
        this.save({ horaires: DEFAULT_SETTINGS.horaires });
      }
      if (cb) cb();
      if (state.tab === "reglages") render();
    }, e => { console.error("listen settings:", e); this.data = { ...DEFAULT_SETTINGS }; if (cb) cb(); });
  },
  save(patch) {
    firebase.firestore().collection("settings").doc("coach").set(patch, { merge: true })
      .then(() => notifCoach("✅ Réglages enregistrés"))
      .catch(e => notifCoach("Erreur : " + e.message));
  }
};

const RdvRequests = {
  items: [],
  unsub: null,
  autoTraites: new Set(),
  autoSupprimees: new Set(),
  listen() {
    if (this.unsub || !CoachLink.user) return;
    this.unsub = firebase.firestore().collection("rdvRequests")
      .orderBy("createdAt", "desc")
      .onSnapshot(snap => {
        this.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this.autoConfirmerClientsExistants();
        this.nettoyerAnciennesDemandes();
        if (state.tab === "rdv" || state.tab === "agenda") render();
      }, e => console.error("listen rdvRequests:", e));
  },
  autoConfirmerClientsExistants() {
    this.items
      .filter(r => r.status === "nouveau" && !this.autoTraites.has(r.id))
      .forEach(r => {
        const client = trouverClientExistant(r);
        if (client) {
          this.autoTraites.add(r.id);
          if (r.motif === "Séance Découverte (gratuite)") {
            // La séance découverte gratuite est réservée aux nouveaux clients.
            this.setStatus(r.id, "rejete");
            notifCoach("⛔ Séance découverte refusée automatiquement : " + client.name + " est déjà client (offre réservée aux nouveaux).");
          } else {
            this.setStatus(r.id, "confirme");
            notifCoach("✅ RDV auto-confirmé (client existant) : " + client.name);
          }
        }
      });
  },
  nettoyerAnciennesDemandes() {
    const db = firebase.firestore();
    const seuil = Date.now() - 3 * 24 * 60 * 60 * 1000; // 3 jours
    this.items
      .filter(r => r.status !== "nouveau" && r.createdAt && new Date(r.createdAt).getTime() < seuil && !this.autoSupprimees.has(r.id))
      .forEach(r => {
        this.autoSupprimees.add(r.id);
        db.collection("rdvRequests").doc(r.id).delete()
          .catch(e => console.error("nettoyage rdvRequests:", e));
      });
  },
  setStatus(id, status, callback) {
    const db = firebase.firestore();
    const req = this.items.find(r => r.id === id);
    db.collection("rdvRequests").doc(id).update({ status })
      .then(() => {
        if (status === "confirme" && req) {
          if (req.date && req.heure) {
            const slotId = req.date + "_" + req.heure;
            db.collection("bookedSlots").doc(slotId).set({ date: req.date, heure: req.heure })
              .catch(e => console.error("bookedSlots:", e));
          }
          creerOuMajClientDepuisRdv(req);
        } else if (status === "rejete" && req && req.date && req.heure) {
          // Le créneau avait été réservé automatiquement à l'envoi : on le libère.
          const slotId = req.date + "_" + req.heure;
          db.collection("bookedSlots").doc(slotId).delete()
            .catch(e => console.error("bookedSlots (liberation):", e));
        }
        if (callback) callback(null);
      })
      .catch(e => {
        notifCoach("Erreur : " + e.message);
        if (callback) callback(e);
      });
  },
  annuler(id, callback) {
    const db = firebase.firestore();
    const req = this.items.find(r => r.id === id);
    db.collection("rdvRequests").doc(id).update({ status: "annule" })
      .then(() => {
        if (req && req.date && req.heure) {
          const slotId = req.date + "_" + req.heure;
          db.collection("bookedSlots").doc(slotId).delete()
            .catch(e => console.error("bookedSlots (annulation):", e));
          state.appointments = state.appointments.filter(a =>
            !(a.source === "site" && a.date === req.date && a.heure === req.heure));
          save();
        }
        notifCoach("Rendez-vous annulé, créneau libéré.");
        if (callback) callback(null);
        render();
      })
      .catch(e => {
        notifCoach("Erreur : " + e.message);
        if (callback) callback(e);
      });
  }
};

const FORFAIT_SEANCES = {
  "Forfait Déclic": 3,
  "Programme Sérénité": 8,
  "Forfait Famille Hérisson": 4
};
const MOTIF_TARIF_KEY = {
  "Séance Découverte (gratuite)": "decouverte",
  "Forfait Déclic": "declic",
  "Programme Sérénité": "codeChaine",
  "Forfait Famille Hérisson": "famille"
};

function montantPourMotif(motif) {
  const key = MOTIF_TARIF_KEY[motif];
  if (key && CoachSettings.data && CoachSettings.data.tarifs && CoachSettings.data.tarifs[key] != null) {
    return Number(CoachSettings.data.tarifs[key]);
  }
  return 0;
}

function appliquerForfait(client, motif) {
  const total = FORFAIT_SEANCES[motif];
  if (!total) return; // séance à l'unité / découverte / autre : pas de suivi de forfait
  if (client.forfaitNom !== motif || !client.forfaitTotal) {
    client.forfaitNom = motif;
    client.forfaitTotal = total;
    client.forfaitUtilisees = 1;
  } else {
    client.forfaitUtilisees = Math.min(total, (client.forfaitUtilisees||0) + 1);
  }
}

function normalizePhone(raw) {
  if (!raw) return "";
  let d = String(raw).replace(/[^\d+]/g, "");
  if (d.startsWith("+33")) d = "0" + d.slice(3);
  else if (d.startsWith("0033")) d = "0" + d.slice(4);
  return d;
}

function ajouterRdvAgenda({ clientId, clientName, date, heure, motif, notes, source, reqId }) {
  state.appointments.push({
    id: "a" + Date.now() + Math.random().toString(36).slice(2,6),
    clientId: clientId || null,
    clientName: clientName || "Client",
    date: date || "",
    heure: heure || "",
    motif: motif || "",
    notes: notes || "",
    source: source || "manuel",
    reqId: reqId || null
  });
  save();
  if (date && heure) {
    const slotId = date + "_" + heure;
    firebase.firestore().collection("bookedSlots").doc(slotId).set({ date, heure })
      .catch(e => console.error("bookedSlots (agenda manuel):", e));
  }
}

function supprimerRdvAgenda(id) {
  const item = state.appointments.find(a => a.id === id);
  state.appointments = state.appointments.filter(a => a.id !== id);
  save();
  if (item && item.date && item.heure) {
    const slotId = item.date + "_" + item.heure;
    firebase.firestore().collection("bookedSlots").doc(slotId).delete()
      .catch(e => console.error("bookedSlots delete:", e));
  }
  if (item && item.reqId) {
    firebase.firestore().collection("rdvRequests").doc(item.reqId).update({ status: "annule" })
      .catch(e => console.error("annulation rdvRequests:", e));
  }
}

function trouverClientExistant(req) {
  const emailNorm = (req.email || "").trim().toLowerCase();
  const telNorm = normalizePhone(req.tel);
  return state.clients.find(c => {
    const sameEmail = emailNorm && (c.email||"").trim().toLowerCase() === emailNorm;
    const samePhone = telNorm && normalizePhone(c.tel) === telNorm;
    return sameEmail || samePhone;
  }) || null;
}

function creerOuMajClientDepuisRdv(req) {
  let client = trouverClientExistant(req);
  const montant = montantPourMotif(req.motif);

  if (client) {
    client.sessions = (client.sessions || 0) + 1;
    client.nextSession = req.date || client.nextSession || "";
    client.sessionHistory = client.sessionHistory || [];
    client.sessionHistory.push("Séance " + client.sessionHistory.length + 1 + " — " + (req.motif || "RDV") + (req.theme ? " (" + req.theme + ")" : "") + (req.date ? " le " + req.date : ""));
    appliquerForfait(client, req.motif);
    client.paiements = client.paiements || [];
    client.paiements.push({ id: Date.now()+"", date: req.date || new Date().toISOString().slice(0,10), montant, statut: "en attente" });
    save();
    ajouterRdvAgenda({ clientId: client.id, clientName: client.name, date: req.date, heure: req.heure, motif: req.motif, notes: req.message, source: "site", reqId: req.id });
    notifCoach("✅ Séance ajoutée à la fiche de " + client.name);
  } else {
    const nom = ((req.prenom||"") + " " + (req.nom||"")).trim() || "Nouveau client";
    const nouveauClient = {
      id: "c" + Date.now(),
      name: nom,
      email: req.email || "",
      tel: req.tel || "",
      profile: "À définir",
      age: null,
      objective: req.motif || "",
      sessions: 1,
      nextSession: req.date || "",
      status: "actif",
      notes: req.message || "",
      sessionHistory: ["Séance 1 — " + (req.motif || "RDV") + (req.theme ? " (" + req.theme + ")" : "") + (req.date ? " le " + req.date : "")],
      objectifs: [],
      paiements: [{ id: Date.now()+"", date: req.date || new Date().toISOString().slice(0,10), montant, statut: "en attente" }]
    };
    appliquerForfait(nouveauClient, req.motif);
    state.clients.push(nouveauClient);
    save();
    ajouterRdvAgenda({ clientId: nouveauClient.id, clientName: nom, date: req.date, heure: req.heure, motif: req.motif, notes: req.message, source: "site", reqId: req.id });
    notifCoach("✅ Nouvelle fiche client créée : " + nom);
  }
}

function isoDate(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function startOfWeekMonday(d) { const day = d.getDay(); const diff = (day===0?-6:1-day); const r = new Date(d); r.setDate(d.getDate()+diff); return r; }
const JOURS_COURT = ["lun","mar","mer","jeu","ven","sam","dim"];

function appointmentsForDate(dateStr) {
  return state.appointments.filter(a => a.date === dateStr).sort((a,b) => (a.heure||"").localeCompare(b.heure||""));
}

function resynchroniserCreneaux() {
  const avecCreneau = state.appointments.filter(a => a.date && a.heure);
  if (!avecCreneau.length) { notifCoach("Aucun rendez-vous avec créneau à synchroniser."); return; }
  const db = firebase.firestore();
  let fait = 0;
  const total = avecCreneau.length;
  avecCreneau.forEach(a => {
    const slotId = a.date + "_" + a.heure;
    db.collection("bookedSlots").doc(slotId).set({ date: a.date, heure: a.heure })
      .then(() => { fait++; if (fait === total) notifCoach("✅ " + total + " créneau(x) resynchronisé(s)."); })
      .catch(e => console.error("resync bookedSlots:", e));
  });
}

  JOURS_COURT.forEach(j => grid.appendChild(h("div",{style:"text-align:center;color:#6B6355;font-size:13px;font-weight:700;padding-bottom:4px;text-transform:capitalize"}, j)));

  const cursor = new Date(startGrid);
  for (let w = 0; w < 6; w++) {
    for (let i = 0; i < 7; i++) {
      const dStr = isoDate(cursor);
      const inMonth = cursor.getMonth() === month;
      const dayApts = appointmentsForDate(dStr);
      const isToday = dStr === todayStr;
      const isSelected = state.agendaSelectedDay === dStr;
      const cell = h("div",{style:`min-height:56px;border-radius:8px;padding:6px;cursor:pointer;background:${isSelected?"#9C7A2E22":"#FFFFFF"};border:1px solid ${isToday?"#9C7A2E66":"#E4DAC0"};opacity:${inMonth?1:0.35}`});
      cell.appendChild(h("div",{style:"font-size:12px;color:"+(isToday?"#9C7A2E":"#2E2A20")+";font-weight:600"}, String(cursor.getDate())));
      if (dayApts.length) {
        cell.appendChild(h("div",{style:"margin-top:4px;font-size:9.5px;color:#9C7A2E;font-weight:700"}, dayApts.length + " RDV"));
      }
      cell.addEventListener("click", () => { state.agendaSelectedDay = (state.agendaSelectedDay===dStr) ? null : dStr; render(); });
      grid.appendChild(cell);
      cursor.setDate(cursor.getDate()+1);
    }
  }
  wrap.appendChild(grid);

  if (state.agendaSelectedDay) {
    const dayApts = appointmentsForDate(state.agendaSelectedDay);
    const detail = h("div",{class:"card",style:"padding:16px 18px;margin-top:16px"});
    detail.appendChild(h("div",{style:"font-weight:700;font-size:13px;color:#2E2A20;margin-bottom:10px"}, state.agendaSelectedDay));
    if (!dayApts.length) detail.appendChild(h("p",{style:"color:#6B6355;font-size:12.5px"},"Aucun rendez-vous ce jour-là."));
    dayApts.forEach(a => detail.appendChild(appointmentRow(a)));
    wrap.appendChild(detail);
  }

  return wrap;
}

function buildAgendaForm() {
  const fd = { clientId:"", clientName:"", date:"", heure:"", motif:"", notes:"" };
  const form = h("div",{class:"qform",style:"margin-bottom:20px"});
  form.appendChild(h("h3",{style:"color:#9C7A2E;font-size:21px;margin-bottom:18px;font-style:italic"},"Nouveau rendez-vous"));

  const g = h("div",{class:"grid2",style:"margin-bottom:12px"});

  const clientOptions = ["— Nouveau / hors liste —", ...state.clients.map(c => c.name)];
  const clientSel = selectEl({ options: clientOptions, value: clientOptions[0], onChange: v => {
    fd.clientName = v === clientOptions[0] ? "" : v;
    const found = state.clients.find(c => c.name === v);
    fd.clientId = found ? found.id : "";
    if (found) { freeNameInp.style.display = "none"; } else { freeNameInp.style.display = "block"; }
  }});
  g.appendChild(field("CLIENT EXISTANT", clientSel));

  const dateInp = inputEl({ type:"date", onChange: v => fd.date = v });
  g.appendChild(field("DATE", dateInp));
  form.appendChild(g);

  const g2 = h("div",{class:"grid2",style:"margin-bottom:12px"});
  const heureInp = inputEl({ type:"time", onChange: v => fd.heure = v });
  g2.appendChild(field("HEURE", heureInp));
  const MOTIFS_AGENDA = ["Séance Découverte (gratuite)","Séance à l'unité","Forfait Déclic","Programme Sérénité","Forfait Famille Hérisson","Autre"];
  fd.motif = MOTIFS_AGENDA[0];
  const motifInp = selectEl({ options: MOTIFS_AGENDA, value: MOTIFS_AGENDA[0], onChange: v => fd.motif = v });
  g2.appendChild(field("MOTIF", motifInp));
  form.appendChild(g2);

  const freeNameInp = inputEl({ placeholder:"Nom (si nouveau ou hors liste)", onInput: v => fd.clientName = v });
  form.appendChild(h("div",{style:"margin-bottom:12px"}, field("NOM (si pas dans la liste)", freeNameInp)));

  const notesInp = textareaEl({ placeholder:"Notes...", height:"64px", onInput: v => fd.notes = v });
  form.appendChild(h("div",{style:"margin-bottom:18px"}, field("NOTES", notesInp)));

  const row = h("div",{style:"display:flex;gap:10px"});
  const saveBtn = h("button",{class:"btn"},"Ajouter au calendrier");
  saveBtn.addEventListener("click", () => {
    const nom = (fd.clientName || "").trim();
    if (!nom) { notifCoach("Merci d'indiquer un client ou un nom."); return; }
    if (!fd.date) { notifCoach("Merci d'indiquer une date."); return; }
    ajouterRdvAgenda({ clientId: fd.clientId, clientName: nom, date: fd.date, heure: fd.heure, motif: fd.motif, notes: fd.notes, source: "manuel" });

    // Si un client existant est sélectionné, on décompte la séance sur sa fiche (sessions + forfait).
    if (fd.clientId) {
      const client = state.clients.find(c => c.id === fd.clientId);
      if (client) {
        client.sessions = (client.sessions || 0) + 1;
        client.nextSession = fd.date || client.nextSession || "";
        client.sessionHistory = client.sessionHistory || [];
        client.sessionHistory.push("Séance " + client.sessionHistory.length + 1 + " — " + (fd.motif || "RDV (agenda)") + (fd.date ? " (" + fd.date + ")" : ""));
        appliquerForfait(client, fd.motif);
        save();
        notifCoach("📦 Séance décomptée pour " + client.name + (client.forfaitTotal ? " (" + client.forfaitUtilisees + "/" + client.forfaitTotal + ")" : ""));
      }
    }

    setState({ tab: "agenda" });
  });
  const cancelBtn = h("button",{class:"btn-g"},"Annuler");
  cancelBtn.addEventListener("click", () => setState({ tab: "agenda" }));
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  form.appendChild(row);
  return form;
}

function renderFinancesTab() {
  const wrap = h("div",{});

  // Agrégation de tous les paiements de tous les clients, groupés par mois
  const parMois = {}; // "2026-07" -> {reel:0, prevu:0, seances:0}
  state.clients.forEach(c => {
    (c.paiements || []).forEach(p => {
      if (!p.date) return;
      const mk = p.date.slice(0,7); // YYYY-MM
      if (!parMois[mk]) parMois[mk] = {reel:0, prevu:0, seances:0};
      const montant = Number(p.montant || 0);
      parMois[mk].prevu += montant;
      parMois[mk].seances += 1;
      if (p.statut === "payé") parMois[mk].reel += montant;
    });
  });

  const moisTries = Object.keys(parMois).sort().reverse();
  const totalReel = moisTries.reduce((s,mk) => s + parMois[mk].reel, 0);
  const totalPrevu = moisTries.reduce((s,mk) => s + parMois[mk].prevu, 0);
  const totalSeances = moisTries.reduce((s,mk) => s + parMois[mk].seances, 0);

  const maintenant = new Date();
  const cleMoisCourant = maintenant.getFullYear() + "-" + String(maintenant.getMonth()+1).padStart(2,"0");
  const dataMoisCourant = parMois[cleMoisCourant] || {reel:0, prevu:0, seances:0};
  const moisProchain = new Date(maintenant.getFullYear(), maintenant.getMonth()+1, 1);
  const cleMoisProchain = moisProchain.getFullYear() + "-" + String(moisProchain.getMonth()+1).padStart(2,"0");

    h("div",{style:"font-size:13px;color:#5A5648;margin-bottom:4px"},"PROGRAMMÉ CE MOIS-CI (total)"),

    h("div",{style:"font-size:24px;font-weight:800;color:#4a9e6a"}, totalReel.toFixed(0)+" €")
  ));
  summary.appendChild(h("div",{class:"card",style:"padding:16px;text-align:center"},
    h("div",{style:"font-size:13px;color:#5A5648;margin-bottom:4px"},"MONTANT PROGRAMMÉ (total)"),
    h("div",{style:"font-size:24px;font-weight:800;color:#9C7A2E"}, totalPrevu.toFixed(0)+" €")
  ));
  wrap.appendChild(summary);

function renderRdvTab() {
  const wrap = h("div",{});
  if (!CoachLink.user) { wrap.appendChild(renderCoachLogin()); return wrap; }
  RdvRequests.listen();

  const nouveaux = RdvRequests.items.filter(r => r.status === "nouveau");
  const traites = RdvRequests.items.filter(r => r.status !== "nouveau");

  wrap.appendChild(h("div",{style:"font-weight:700;font-size:14px;color:#2E2A20;margin-bottom:14px"},
    "📅 Nouvelles demandes (" + nouveaux.length + ")"));

  if (!nouveaux.length) {
    wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;padding:10px 0"},"Aucune nouvelle demande pour l'instant."));
  }

  nouveaux.forEach(r => {
    const card = h("div",{class:"card",style:"padding:16px;margin-bottom:12px;border-color:#9C7A2E33"});
    card.appendChild(h("div",{style:"display:flex;justify-content:space-between;align-items:start"},
      h("div",{},
        h("div",{style:"font-size:14px;font-weight:700;color:#2E2A20"}, r.prenom + " " + r.nom),
        h("div",{style:"font-size:12px;color:#9C7A2E;margin-top:2px"}, r.motif),
        r.theme ? h("div",{style:"font-size:12px;color:#9880d0;margin-top:2px"}, "💭 " + r.theme) : null,
        h("div",{style:"font-size:13.5px;color:#5A5648;margin-top:6px"}, "📧 " + r.email + (r.tel ? " · 📞 " + r.tel : "")),
        h("div",{style:"font-size:13.5px;color:#5A5648;margin-top:2px"},
          (r.date ? "Souhaité : " + r.date + (r.heure ? " à " + r.heure : "") : "Aucune date précisée")),
        r.message ? h("div",{style:"font-size:12px;color:#9a9a85;margin-top:8px;font-style:italic"}, "\"" + r.message + "\"") : null
      )
    ));
    const actions = h("div",{style:"display:flex;gap:8px;margin-top:12px"});
    const confirmBtn = h("button",{class:"btn-sm",style:"border-color:#4a9e6a44;color:#4a9e6a"},"✓ Confirmer");
    const rejectBtn = h("button",{class:"btn-sm",style:"border-color:#d0707044;color:#d07070"},"✕ Rejeter");
    function bloquerBoutons(txtConfirm, txtReject) {
      confirmBtn.disabled = true; rejectBtn.disabled = true;
      if (txtConfirm) confirmBtn.textContent = txtConfirm;
      if (txtReject) rejectBtn.textContent = txtReject;
    }
    function debloquerBoutons(err) {
      confirmBtn.disabled = false; rejectBtn.disabled = false;
      confirmBtn.textContent = "✓ Confirmer"; rejectBtn.textContent = "✕ Rejeter";
      if (err) {
        const errMsg = h("div",{style:"color:#d07070;font-size:12px;margin-top:6px"}, "Échec : " + err.message);
        card.appendChild(errMsg);
      }
    }
    confirmBtn.addEventListener("click", () => {
      bloquerBoutons("Confirmation…", null);
      RdvRequests.setStatus(r.id, "confirme", (err) => { if (err) debloquerBoutons(err); });
    });
    rejectBtn.addEventListener("click", () => {
      bloquerBoutons(null, "Rejet…");
      RdvRequests.setStatus(r.id, "rejete", (err) => { if (err) debloquerBoutons(err); });
    });
    actions.appendChild(confirmBtn); actions.appendChild(rejectBtn);
    card.appendChild(actions);
    wrap.appendChild(card);
  });

  if (traites.length) {
    wrap.appendChild(h("div",{style:"font-weight:700;font-size:13px;color:#5A5648;margin:18px 0 10px"}, "Traitées"));
    traites.slice(0,10).forEach(r => {
      const col = r.status === "confirme" ? "#4a9e6a" : (r.status === "annule" ? "#d0a070" : "#d07070");
      const label = r.status === "confirme" ? "Confirmé" : (r.status === "annule" ? "Annulé" : "Rejeté");
      const row = h("div",{style:"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #D8CBA8;font-size:12.5px;gap:10px"});
      row.appendChild(h("div",{style:"color:#2E2A20;flex:1"}, r.prenom + " " + r.nom + " — " + r.motif));
      row.appendChild(h("span",{style:"color:"+col}, label));
      if (r.status === "confirme") {
        const cancelBtn = h("button",{class:"btn-sm",style:"border-color:#d0707044;color:#d07070;padding:4px 10px;font-size:13.5px"},"✕ Annuler");
        cancelBtn.addEventListener("click", () => {
          if (!confirm("Annuler ce rendez-vous et libérer le créneau ?")) return;
          cancelBtn.disabled = true;
          cancelBtn.textContent = "Annulation…";
          RdvRequests.annuler(r.id, (err) => {
            if (err) {
              cancelBtn.disabled = false;
              cancelBtn.textContent = "✕ Annuler";
              cancelBtn.style.background = "#d0707022";
              const errMsg = h("div",{style:"color:#d07070;font-size:11px;margin-top:4px"}, "Échec : " + err.message);
              row.appendChild(errMsg);
            }
          });
        });
        row.appendChild(cancelBtn);
      }
      wrap.appendChild(row);
    });
  }

  return wrap;
}

function clampNum(val, min, max, fallback) {
  var n = parseInt(val, 10);
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.firstElementChild || d;
}

function profileColor(p) { return PC[p] || "#4a9e6a"; }

function badgeProfil(p) {
  const col = profileColor(p);
  return h("span",{class:"badge-profil",style:`background:${col}22;color:${col};border:1px solid ${col}44`}, p);
}

function badgeStatus(s) {
  const col = s==="actif"?"#4a9e6a":s==="pause"?"#d4885a":"#6B6355";
  return h("span",{class:"status-badge",style:`background:${col}18;color:${col};border:1px solid ${col}33`}, s);
}

function badgeCat(c) {
  const col = CAT_COLORS[c] || "#5A5648";
  return h("span",{class:"cat-badge",style:`background:${col}1a;color:${col};border:1px solid ${col}33`}, c);
}

function avatar(name, profile, size) {
  size = size || 44;
  const col = profileColor(profile);
  return h("div",{class:"avatar",style:`width:${size}px;height:${size}px;background:${col}25;color:${col};font-size:${size*0.4}px`}, (name||"?")[0]);
}

function divider() { return h("div",{class:"divider"}); }

function card(...children) {
  return h("div",{class:"card"}, ...children);
}

function lbl(text) { return h("label",{class:"lbl"}, text); }

function inputEl(opts) {
  const el = h("input", {type:opts.type||"text", placeholder:opts.placeholder||""});
  el.value = opts.value || "";
  if (opts.onInput) el.addEventListener("input", e => opts.onInput(e.target.value));
  if (opts.onChange) el.addEventListener("change", e => opts.onChange(e.target.value));
  return el;
}

function textareaEl(opts) {
  const el = h("textarea", {placeholder:opts.placeholder||""});
  el.value = opts.value || "";
  el.style.height = opts.height || "auto";
  if (opts.onInput) el.addEventListener("input", e => opts.onInput(e.target.value));
  if (opts.onBlur) el.addEventListener("blur", e => opts.onBlur(e.target.value));
  return el;
}

function selectEl(opts) {
  const el = h("select", {});
  opts.options.forEach(o => {
    const opt = h("option", {value:o}, o);
    if (o === opts.value) opt.selected = true;
    el.appendChild(opt);
  });
  if (opts.onChange) el.addEventListener("change", e => opts.onChange(e.target.value));
  return el;
}

function field(labelText, inputElement) {
  return h("div", {}, lbl(labelText), inputElement);

function caduMoisCourant() {
  const maintenant = new Date();
  const cleMoisCourant = maintenant.getFullYear() + "-" + String(maintenant.getMonth()+1).padStart(2,"0");
  let reel = 0;
  state.clients.forEach(c => {
    (c.paiements || []).forEach(p => {
      if (p.date && p.date.slice(0,7) === cleMoisCourant && p.statut === "payé") {
        reel += Number(p.montant || 0);
      }
    });
  });
  return reel;
}

function dimensionsPourProfil(profilClient) {
  const p = (profilClient || "").toUpperCase();
  return DIMENSIONS_EVAL.filter(d =>
    d.profils.includes("all") ||
    d.profils.some(tag => p.includes(tag))
  );
}

function buildEvaluation(c) {
  const wrap = h("div",{});
  c.evaluation = c.evaluation || {};
  const dims = dimensionsPourProfil(c.profile);
  wrap.appendChild(h("h3",{style:"font-size:20px;color:#2E2A20;font-weight:600;margin-bottom:6px;font-style:italic"},"Grille d'évaluation"));
  wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;margin-bottom:6px"},"Évaluez l'intensité de chaque dimension de 0 à 10 pour obtenir un score global."));
  wrap.appendChild(h("p",{style:"color:#9C7A2E;font-size:12px;margin-bottom:20px;font-weight:600"},"Dimensions adaptées au profil : "+(c.profile||"non défini")));

  const scoreBox = h("div",{class:"card",style:"padding:20px;margin-bottom:20px;text-align:center"});
  function scoreTotal() {
    return dims.reduce((s,d)=>s+(c.evaluation[d.key]||0),0);
  }
  function zone(score) {
    const max = dims.length*10;
    const pct = max ? score/max : 0;
    if (pct < 0.33) return {label:"Zone verte", color:"#4a9e6a", txt:"Fonctionnement sain — Prévention et optimisation"};
    if (pct < 0.66) return {label:"Zone orange", color:"#c8a042", txt:"Signaux à surveiller — Ajuster le rythme"};
    return {label:"Zone rouge", color:"#d07070", txt:"Épuisement marqué — Prioriser le repos et le soutien"};
  }
  function renderScore() {
    scoreBox.innerHTML = "";
    const max = dims.length*10;
    const s = scoreTotal();
    const z = zone(s);
    scoreBox.appendChild(h("div",{style:"display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px"},
      h("div",{style:"font-size:34px;font-weight:800;color:"+z.color}, String(s)+" / "+max),
      h("span",{style:"background:"+z.color+"22;color:"+z.color+";padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700"}, z.label)
    ));
    scoreBox.appendChild(h("div",{style:"color:#5A5648;font-size:13px"}, z.txt));
  }
  renderScore();
  wrap.appendChild(scoreBox);

  dims.forEach(d => {
    const card = h("div",{class:"card",style:"padding:16px 18px;margin-bottom:10px"});
    const valSpan = h("span",{style:"color:#9C7A2E;font-weight:700"}, String(c.evaluation[d.key]||0));
    card.appendChild(h("div",{style:"display:flex;justify-content:space-between;margin-bottom:4px"},
      h("div",{style:"color:#2E2A20;font-weight:600;font-size:14.5px"}, d.label),
      valSpan
    ));
    card.appendChild(h("div",{style:"color:#5A5648;font-size:12.5px;margin-bottom:10px"}, d.desc));
    const slider = h("input",{type:"range",min:"0",max:"10",value:String(c.evaluation[d.key]||0),style:"width:100%"});
    slider.addEventListener("input", () => {
      c.evaluation[d.key] = Number(slider.value);
      valSpan.textContent = slider.value;
      renderScore();
      save();
    });
    card.appendChild(slider);
    wrap.appendChild(card);
  });

  return wrap;
}

function buildPreparerSeance(c) {
  c.prochainePrep = c.prochainePrep || { objectifsChoisis: [], outilsChoisis: [], notesPrep: "" };
  const p = c.prochainePrep;
  const wrap = h("div",{});

  wrap.appendChild(h("h3",{style:"font-size:20px;color:#2E2A20;font-weight:600;margin-bottom:6px;font-style:italic"},"📝 Préparer la prochaine séance"));
  wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;margin-bottom:4px"},
    c.nextSession ? "Séance prévue le " + c.nextSession : "Aucune date de séance programmée."));
  wrap.appendChild(h("p",{style:"color:#9C7A2E;font-size:12px;margin-bottom:20px;font-weight:600"},"Profil : "+(c.profile||"non défini")));

  // --- Fiches-types par thème ---
  const themeBox = h("div",{class:"card",style:"padding:18px;margin-bottom:16px;border-color:#9C7A2E44"});
  themeBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;margin-bottom:12px"},"📚 Charger une fiche-type par thème"));
  const themeGrid = h("div",{style:"display:grid;grid-template-columns:repeat(2,1fr);gap:8px"});
  FICHES_THEMES.forEach(ft => {
    const btn = h("button",{class:"btn-sm",style:"text-align:left;padding:10px 12px"}, ft.icon+" "+ft.theme);
    btn.addEventListener("click", () => {
      ft.objectifs.forEach(titre => {
        c.objectifs = c.objectifs || [];
        if (!c.objectifs.some(o=>o.titre===titre)) {
          c.objectifs.push({id:Date.now()+""+Math.random().toString(36).slice(2,5), titre, echeance:"", statut:"en cours"});
        }
      });
      p.notesPrep = (p.notesPrep ? p.notesPrep + "\n\n" : "") + "— Trame « " + ft.theme + " » —\n" + ft.deroule;
      save();
      render();
      notifCoach("Fiche « "+ft.theme+" » chargée : objectifs ajoutés + trame insérée.");
    });
    themeGrid.appendChild(btn);
  });
  themeBox.appendChild(themeGrid);
  wrap.appendChild(themeBox);

  // --- Objectifs à travailler ---
  const objBox = h("div",{class:"card",style:"padding:18px;margin-bottom:16px"});
  objBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;margin-bottom:12px"},"🎯 Objectifs à travailler cette séance"));
  const objs = c.objectifs || [];
  if (!objs.length) {
    objBox.appendChild(h("p",{style:"color:#5A5648;font-size:13px"},"Aucun objectif défini — charge une fiche-type ou ajoute-en dans l'onglet Objectifs."));
  } else {
    objs.forEach(o => {
      const checked = p.objectifsChoisis.includes(o.id);
      const row = h("label",{style:"display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:13.5px;color:#2E2A20"});
      const cb = h("input",{type:"checkbox"}); cb.checked = checked;
      cb.addEventListener("change",()=>{
        if (cb.checked) p.objectifsChoisis.push(o.id);
        else p.objectifsChoisis = p.objectifsChoisis.filter(id=>id!==o.id);
        save();
      });
      row.appendChild(cb); row.appendChild(document.createTextNode(o.titre + (o.statut==="atteint"?" ✓":"")));
      objBox.appendChild(row);
    });
  }
  wrap.appendChild(objBox);

  // --- Outils de la bibliothèque ---
  const outilsBox = h("div",{class:"card",style:"padding:18px;margin-bottom:16px"});
  outilsBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;margin-bottom:12px"},"▣ Outils de la bibliothèque"));

  const selectionnes = h("div",{style:"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"});
  function renderSelectionnes() {
    selectionnes.innerHTML = "";
    if (!p.outilsChoisis.length) { selectionnes.appendChild(h("span",{style:"color:#5A5648;font-size:12.5px"},"Aucun outil sélectionné pour l'instant.")); return; }
    p.outilsChoisis.forEach(id => {
      const fiche = BIBLIO.find(b=>b.id===id);
      if (!fiche) return;
      const chip = h("span",{style:"background:#9C7A2E22;color:#9C7A2E;padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px"},
        fiche.titre);
      const del = h("button",{style:"background:transparent;border:none;color:#9C7A2E;cursor:pointer;font-size:14px"},"×");
      del.addEventListener("click",()=>{ p.outilsChoisis = p.outilsChoisis.filter(x=>x!==id); save(); renderSelectionnes(); });
      chip.appendChild(del);
      selectionnes.appendChild(chip);
    });
  }
  renderSelectionnes();
  outilsBox.appendChild(selectionnes);

  const profilClient = (c.profile||"").toUpperCase();
  const suggestions = BIBLIO.filter(b => b.profil==="Tous" || profilClient.includes(b.profil.toUpperCase()));
  const listeOutils = h("div",{style:"max-height:260px;overflow-y:auto;border-top:1px solid #E4DAC0;padding-top:10px"});
  suggestions.forEach(b => {
    if (p.outilsChoisis.includes(b.id)) return;
    const row = h("div",{style:"display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;color:#2E2A20;border-bottom:1px solid #F0E9D8"});
    row.appendChild(h("div",{},h("span",{style:"font-weight:600"},b.titre), h("span",{style:"color:#5A5648;font-size:11.5px"}," — "+b.cat)));
    const addBtn = h("button",{class:"btn-sm",style:"padding:3px 10px;font-size:11.5px"},"+ Ajouter");
    addBtn.addEventListener("click",()=>{ p.outilsChoisis.push(b.id); save(); renderSelectionnes(); addBtn.disabled=true; row.style.opacity=".4"; });
    row.appendChild(addBtn);
    listeOutils.appendChild(row);
  });
  outilsBox.appendChild(listeOutils);
  wrap.appendChild(outilsBox);

  // --- Exercices / notes libres ---
  const notesBox = h("div",{class:"card",style:"padding:18px;margin-bottom:16px"});
  notesBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;margin-bottom:10px"},"✏️ Exercices et notes de préparation"));
  const ta = textareaEl({value:p.notesPrep, placeholder:"Idées, exercices personnalisés, points à aborder...", height:"140px", onInput:v=>{p.notesPrep=v; save();}});
  notesBox.appendChild(ta);
  wrap.appendChild(notesBox);

  // --- Récapitulatif ---
  const recap = h("div",{class:"card",style:"padding:18px;border-color:#9C7A2E44"});
  recap.appendChild(h("div",{style:"font-weight:700;color:#9C7A2E;margin-bottom:10px"},"📋 Plan de séance — résumé"));
  const objTxt = objs.filter(o=>p.objectifsChoisis.includes(o.id)).map(o=>o.titre).join(", ") || "—";
  const outTxt = p.outilsChoisis.map(id=>{const f=BIBLIO.find(b=>b.id===id);return f?f.titre:"";}).filter(Boolean).join(", ") || "—";
  recap.appendChild(h("p",{style:"font-size:13px;color:#2E2A20;margin-bottom:6px"}, h("b",{},"Objectifs : "), objTxt));
  recap.appendChild(h("p",{style:"font-size:13px;color:#2E2A20;margin-bottom:6px"}, h("b",{},"Outils : "), outTxt));
  if (p.notesPrep) recap.appendChild(h("p",{style:"font-size:13px;color:#2E2A20;white-space:pre-wrap"}, h("b",{},"Notes : "), p.notesPrep));
  wrap.appendChild(recap);

  return wrap;
}

const PROGRAMME_90J = ["p90-1","p90-2","p90-3","p90-4","p90-5","p90-6","p90-7","p90-8","p90-9","p90-10","p90-11","p90-12"];

function buildProgramme90(c) {
  const wrap = h("div",{});
  wrap.appendChild(h("h3",{style:"font-size:20px;color:#2E2A20;font-weight:600;margin-bottom:6px;font-style:italic"},"🗓️ Programme 90 jours"));

  if (!c.programme90) {
    wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;margin-bottom:16px"},"Un parcours structuré de 12 semaines, réparti sur 3 mois."));
    const startBtn = h("button",{class:"btn"},"Démarrer le programme pour ce client");
    startBtn.addEventListener("click",()=>{
      c.programme90 = { dateDebut: new Date().toISOString().slice(0,10), semainesTerminees: [] };
      save(); render();
    });
    wrap.appendChild(startBtn);
    return wrap;
  }

  const p = c.programme90;
  const pct = Math.round(p.semainesTerminees.length/12*100);
  wrap.appendChild(h("p",{style:"color:#5A5648;font-size:12.5px;margin-bottom:10px"},"Démarré le "+p.dateDebut));
  const barBg = h("div",{style:"background:#E4DAC0;border-radius:6px;height:8px;overflow:hidden;margin-bottom:6px"});
  barBg.appendChild(h("div",{style:"background:#9C7A2E;height:100%;width:"+pct+"%"}));
  wrap.appendChild(barBg);
  wrap.appendChild(h("p",{style:"color:#9C7A2E;font-size:12.5px;font-weight:700;margin-bottom:18px"}, p.semainesTerminees.length+" / 12 semaines terminées ("+pct+"%)"));

  let ouverte = null;
  const listeWrap = h("div",{});
  function renderListe() {
    listeWrap.innerHTML = "";
    PROGRAMME_90J.forEach((bid, i) => {
      const fiche = BIBLIO.find(b=>b.id===bid);
      if (!fiche) return;
      const num = i+1;
      const terminee = p.semainesTerminees.includes(bid);
      const card = h("div",{class:"card",style:"padding:14px 16px;margin-bottom:8px"});
      const hdr = h("div",{style:"display:flex;align-items:center;gap:10px;cursor:pointer"});
      const cb = h("input",{type:"checkbox"}); cb.checked = terminee;
      cb.addEventListener("click",(e)=>e.stopPropagation());
      cb.addEventListener("change",()=>{
        if (cb.checked) p.semainesTerminees.push(bid);
        else p.semainesTerminees = p.semainesTerminees.filter(x=>x!==bid);
        save(); render();
      });
      hdr.appendChild(cb);
      hdr.appendChild(h("div",{style:"flex:1;color:#2E2A20;font-size:13.5px;font-weight:600"+(terminee?";text-decoration:line-through;opacity:.55":"")}, fiche.titre));
      hdr.appendChild(h("span",{style:"color:#9C7A2E;font-size:12px"}, ouverte===bid ? "▴" : "▾"));
      hdr.addEventListener("click",()=>{ ouverte = ouverte===bid ? null : bid; renderListe(); });
      card.appendChild(hdr);
      if (ouverte===bid) {
        card.appendChild(h("div",{style:"margin-top:10px;padding-top:10px;border-top:1px solid #E4DAC0;color:#2E2A20;font-size:12.5px;white-space:pre-wrap;line-height:1.6"}, fiche.contenu));
      }
      listeWrap.appendChild(card);
    });
  }
  renderListe();
  wrap.appendChild(listeWrap);

  const stopBtn = h("button",{class:"btn-g",style:"margin-top:10px"},"Retirer ce programme");
  stopBtn.addEventListener("click",()=>{ if(confirm("Retirer le programme 90 jours de ce client ?")){ c.programme90=null; save(); render(); } });
  wrap.appendChild(stopBtn);

  return wrap;
}

function buildKitSurvie(c) {
  c.kitSurvie = c.kitSurvie || {profilCoache:"", signaux:[], outils:[], croyanceLimitante:"", croyanceRessource:"", mantras:[]};
  const k = c.kitSurvie;
  const wrap = h("div",{});

  wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;margin-bottom:20px"},"Co-construisez un plan personnalisé avec le client."));

  wrap.appendChild(h("div",{class:"card",style:"padding:18px;margin-bottom:16px"},
    h("div",{style:"font-weight:700;color:#2E2A20;margin-bottom:10px"},"Profil du client"),
    (() => {
      const t = textareaEl({value:k.profilCoache, placeholder:"Particularités, forces, sensibilités...", height:"64px", onInput:v=>{k.profilCoache=v; save();}});
      return t;
    })()
  ));

  function listeEditable(titre, arr, placeholder) {
    const box = h("div",{class:"card",style:"padding:18px;margin-bottom:16px"});
    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"},
      h("div",{style:"font-weight:700;color:#2E2A20"},titre),
      h("button",{class:"btn-sm"},"+ Ajouter")
    );
    const list = h("div",{});
    function renderList() {
      list.innerHTML = "";
      arr.forEach((val,i) => {
        const row = h("div",{style:"display:flex;gap:8px;margin-bottom:8px"});
        const inp = inputEl({value:val, placeholder, onInput:v=>{arr[i]=v; save();}});
        const del = h("button",{style:"background:transparent;border:none;color:#d07070;cursor:pointer;font-size:16px"},"×");
        del.addEventListener("click",()=>{ arr.splice(i,1); save(); renderList(); });
        row.appendChild(inp); row.appendChild(del);
        list.appendChild(row);
      });
    }
    hdr.querySelector("button").addEventListener("click", () => { arr.push(""); save(); renderList(); });
    renderList();
    box.appendChild(hdr); box.appendChild(list);
    return box;
  }
  wrap.appendChild(listeEditable("⚠️ Signaux d'alerte", k.signaux, "Ex: irritabilité, isolement..."));
  wrap.appendChild(listeEditable("🔧 Outils préférés", k.outils, "Ex: respiration, marche..."));

  wrap.appendChild(h("div",{class:"card",style:"padding:18px;margin-bottom:16px"},
    h("div",{style:"font-weight:700;color:#2E2A20;margin-bottom:10px"},"🔄 Croyances transformées"),
    field("Croyance limitante", inputEl({value:k.croyanceLimitante, placeholder:"Ex: Je dois être parfait", onInput:v=>{k.croyanceLimitante=v; save();}})),
    h("div",{style:"height:10px"}),
    field("Croyance ressource", inputEl({value:k.croyanceRessource, placeholder:"Ex: Le progrès vaut mieux que la perfection", onInput:v=>{k.croyanceRessource=v; save();}}))
  ));

  wrap.appendChild(listeEditable("✨ Mantras / Affirmations", k.mantras, "Ex: J'avance à mon rythme"));

  return wrap;
}

function buildFiche(c) {
  let editMode = false;
  const wrap = h("div",{});

  function showView() {
    wrap.innerHTML="";
    if (c.email || c.tel) {
      const contactBox = h("div",{style:"display:flex;gap:20px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #D8CBA8;flex-wrap:wrap"});
      if (c.email) contactBox.appendChild(h("div",{style:"font-size:13px;color:#5A5648"}, "📧 ", h("span",{style:"color:#2E2A20"}, c.email)));
      if (c.tel) contactBox.appendChild(h("div",{style:"font-size:13px;color:#5A5648"}, "📞 ", h("span",{style:"color:#2E2A20"}, c.tel)));
      wrap.appendChild(contactBox);
    }

    // --- Envoi du questionnaire d'accueil ---
    const qBox = h("div",{style:"margin-bottom:18px;padding:14px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0"});
    qBox.appendChild(h("div",{style:"font-weight:700;color:#2E2A20;font-size:13.5px;margin-bottom:10px"},"📨 Questionnaire d'accueil"));
    const lienQuest = "https://julien-coaching.vercel.app/questionnaire-accueil.html?client="+encodeURIComponent(c.id)+"&nom="+encodeURIComponent(c.name||"")+"&email="+encodeURIComponent(c.email||"");
    const msgQuest = "Bonjour "+(c.name||"")+", avant notre premier échange, je vous propose de répondre à ce petit questionnaire (5 min) : "+lienQuest;
    const btnRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap"});
    if (c.email) {
      const bMail = h("a",{class:"btn-sm",href:"mailto:"+c.email+"?subject="+encodeURIComponent("Avant notre rendez-vous")+"&body="+encodeURIComponent(msgQuest)},"✉️ Email");
      btnRow.appendChild(bMail);
    }
    if (c.tel) {
      const telClean = c.tel.replace(/[^\d+]/g,"");
      const bSms = h("a",{class:"btn-sm",href:"sms:"+telClean+"?body="+encodeURIComponent(msgQuest)},"💬 SMS");
      btnRow.appendChild(bSms);
      const telWa = telClean.replace(/^0/,"33").replace(/^\+/,"");
      const bWa = h("a",{class:"btn-sm",href:"https://wa.me/"+telWa+"?text="+encodeURIComponent(msgQuest),target:"_blank"},"🟢 WhatsApp");
      btnRow.appendChild(bWa);
    }

      ));
      forfaitBox.appendChild(h("div",{style:"font-size:14px;color:#2E2A20;margin-bottom:8px"}, c.forfaitNom));

      save(); setState({selClientId:null});

function renderBibliotheque() {
  const wrap = h("div",{class:"fade"});
  wrap.appendChild(h("div",{style:"margin-bottom:24px"},
    h("h1",{style:"font-size:30px;color:#2E2A20;font-weight:600;font-style:italic"},"Bibliothèque du Coach"),
    h("p",{style:"color:#5A5648;font-size:14px;margin-top:6px"},`${BIBLIO.length} fiches · Questions · NLP · Sophro · Burnout · Outils`)
  ));

  const CATS = [...new Set(BIBLIO.map(r=>r.cat))];

  // Filters box
  const fbox = h("div",{class:"card",style:"padding:18px;margin-bottom:16px"});
  const searchInp = inputEl({value:state.bibSearch, placeholder:"🔍 Rechercher dans la bibliothèque…", onInput:v=>{ state.bibSearch=v; rebuildList(); }});
  fbox.appendChild(h("div",{style:"margin-bottom:14px"},searchInp));

  // Cat filter
  const catRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center"});
  catRow.appendChild(h("span",{style:"color:#6B6355;font-size:13px;margin-right:4px"},"CAT."));
  ["Tous",...CATS].forEach(c => {
    const b = h("button",{class:"btn-sm"}, c);
    if (state.bibCat===c) { b.style.background="#9C7A2E22"; b.style.color="#9C7A2E"; b.style.borderColor="#9C7A2E55"; }
    b.addEventListener("click",()=>{ state.bibCat=c; rebuildList(); });
    catRow.appendChild(b);
  });
  fbox.appendChild(catRow);

  // Profil filter
  const profRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;align-items:center"});
  profRow.appendChild(h("span",{style:"color:#6B6355;font-size:13px;margin-right:4px"},"PROFIL"));
  ["Tous",...PROFILES].forEach(p => {
    const col = PC[p]||"#9C7A2E";
    const b = h("button",{class:"btn-sm"}, p);
    if (state.bibProfil===p) { b.style.background=col+"22"; b.style.color=col; b.style.borderColor=col+"55"; }
    b.addEventListener("click",()=>{ state.bibProfil=p; rebuildList(); });
    profRow.appendChild(b);
  });
  fbox.appendChild(profRow);
  wrap.appendChild(fbox);

  const count = h("div",{style:"color:#6B6355;font-size:12px;margin-bottom:12px"},"");
  wrap.appendChild(count);

  const list = h("div",{style:"display:grid;gap:10px"});
  wrap.appendChild(list);

  function rebuildList() {
    const filtered = BIBLIO.filter(r => {
      const mC = state.bibCat==="Tous" || r.cat===state.bibCat;
      const mP = state.bibProfil==="Tous" || r.profil===state.bibProfil || r.profil==="Tous";
      const mS = !state.bibSearch || r.titre.toLowerCase().includes(state.bibSearch.toLowerCase()) || r.contenu.toLowerCase().includes(state.bibSearch.toLowerCase());
      return mC && mP && mS;
    });
    count.textContent = `${filtered.length} résultat${filtered.length>1?"s":""}`;
    list.innerHTML="";

    if (!filtered.length) {
      list.appendChild(h("div",{class:"card",style:"padding:40px;text-align:center;color:#6B6355;font-size:14px"},"Aucune fiche pour ces filtres."));
      return;
    }

    filtered.forEach(r => {
      let open = false;
      const card2 = h("div",{class:"card",style:"padding:16px 20px"});

      const body = h("div",{class:"fiche-body"}, r.contenu);

      const hdr2 = h("div",{style:"display:flex;align-items:center;gap:12px;cursor:pointer"});
      const info = h("div",{style:"flex:1"},
        h("div",{style:"color:#2E2A20;font-size:15px;font-weight:600;margin-bottom:6px"},r.titre),
        h("div",{style:"display:flex;gap:6px;flex-wrap:wrap;align-items:center"},
          badgeCat(r.cat), badgeProfil(r.profil),
          r.source?h("span",{style:"color:#6B6355;font-size:12px;font-style:italic"},"— "+r.source):null
        )
      );

      const copyBtn = h("button",{class:"btn-sm",style:"font-size:13px"},"Copier");
      copyBtn.addEventListener("click",e=>{
        e.stopPropagation();
        try { navigator.clipboard.writeText(r.titre+"\n\n"+r.contenu); } catch(e){}
        copyBtn.textContent="✓ Copié"; copyBtn.style.color="#4a9e6a"; copyBtn.style.borderColor="#4a9e6a44";
        setTimeout(()=>{ copyBtn.textContent="Copier"; copyBtn.style.color=""; copyBtn.style.borderColor=""; },2000);
      });

      const arr = h("span",{class:"arr"},"▼");
      hdr2.appendChild(info); hdr2.appendChild(copyBtn); hdr2.appendChild(arr);
      hdr2.addEventListener("click",()=>{
        open=!open;
        body.style.display=open?"block":"none";
        arr.textContent=open?"▲":"▼";
      });

      card2.appendChild(hdr2); card2.appendChild(body);
      list.appendChild(card2);
    });
  }

  rebuildList();
  return wrap;
}

        h("div",{style:"color:#2E2A20;font-size:15px;font-weight:600;margin-bottom:6px"},r.titre),

      );
      const cpBtn=h("button",{class:"btn-sm",style:"font-size:13px"},"Copier");
      cpBtn.addEventListener("click",e=>{ e.stopPropagation(); try{navigator.clipboard.writeText(r.contenu);}catch(e){}; cpBtn.textContent="✓"; setTimeout(()=>cpBtn.textContent="Copier",2000); });
      const delBtn=h("button",{class:"btn-sm",style:"font-size:13px;color:#d07070;border-color:#d0707044"},"×");
      delBtn.addEventListener("click",e=>{ e.stopPropagation(); if(confirm("Supprimer ?")){state.ressources=state.ressources.filter(x=>x.id!==r.id);save();setState({tab:"ressources"});} });
      const arr=h("span",{class:"arr"},"▼");
      hdr2.addEventListener("click",()=>{ open=!open; body.style.display=open?"block":"none"; arr.textContent=open?"▲":"▼"; });
      hdr2.appendChild(info); hdr2.appendChild(cpBtn); hdr2.appendChild(delBtn); hdr2.appendChild(arr);
      c2.appendChild(hdr2); c2.appendChild(body);
      list.appendChild(c2);
    });
    wrap.appendChild(list);
  }
  return wrap;
