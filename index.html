<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:#080f0a;color:#ede8d8}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0a1710}::-webkit-scrollbar-thumb{background:#2d4533;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .25s ease}
input,textarea,select{font-family:inherit;color:#ede8d8;background:#0d1c10;border:1px solid #2a4535;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#c8a042}
input::placeholder,textarea::placeholder{color:#4a6a52}
select option{background:#162b1e}
textarea{resize:vertical}
button{cursor:pointer;font-family:inherit;border:none;transition:opacity .15s,background .15s}
.btn{background:#c8a042;color:#080f0a;border-radius:8px;padding:9px 20px;font-weight:700;font-size:14px}
.btn:hover{opacity:.85}
.btn-g{background:transparent;color:#7a9a80;border:1px solid #2a4535;border-radius:8px;padding:9px 16px;font-size:13px}
.btn-g:hover{background:#192a1c}
.btn-sm{background:transparent;color:#7a9a80;border:1px solid #2a4535;border-radius:7px;padding:4px 11px;font-size:12px}
.btn-sm:hover{background:#192a1c}
.card{background:#121f15;border:1px solid #1e3322;border-radius:14px}
.lbl{color:#7a9a80;font-size:11px;display:block;margin-bottom:4px;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
#app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
#sidebar{width:224px;background:#0d1c10;border-right:1px solid #1e3322;display:flex;flex-direction:column;padding:22px 10px;flex-shrink:0;transition:width .25s ease,padding .25s ease;overflow:hidden}
#sidebar.collapsed{width:52px;padding:12px 8px}
#sidebar.collapsed .brand,#sidebar.collapsed .sidebar-foot,#sidebar.collapsed .nav-label,#sidebar.collapsed .dot,#sidebar.collapsed .badge,#sidebar.collapsed .divider{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px;font-size:17px}
#sidebar.collapsed .toggle-btn{margin:0 auto}
.brand{padding-left:8px;margin-bottom:28px}
.brand h1{font-size:22px;color:#ede8d8;font-weight:700}.brand h1 span{color:#c8a042}
.brand p{color:#4a6a52;font-size:10px;letter-spacing:.12em;margin-top:3px}
.divider{height:1px;background:#1e3322;margin:8px 0}
nav{flex:1}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:10px;border:none;background:transparent;color:#7a9a80;font-size:13.5px;font-weight:400;margin-bottom:3px;text-align:left;white-space:nowrap}
.nav-item:hover{background:#192a1c;color:#ede8d8}
.nav-item.active{background:#c8a04218;color:#c8a042;font-weight:700}
.nav-item .dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:#c8a042;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:#c8a04230;color:#c8a042;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;flex-shrink:0}
.sidebar-foot{padding-left:8px;padding-top:12px;color:#4a6a52;font-size:10px;line-height:1.7}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #2a4535;background:transparent;color:#7a9a80;font-size:15px;cursor:pointer;transition:background .15s,color .15s;flex-shrink:0}
.toggle-btn:hover{background:#192a1c;color:#c8a042}
.toggle-row{display:flex;justify-content:flex-end;margin-bottom:16px}
/* Main */
#main{flex:1;overflow-y:auto;padding:32px 36px}
/* Badges */
.badge-profil{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700}
.status-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:600}
.cat-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700}
/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
/* Lists */
.client-row{padding:15px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:background .15s}
.client-row:hover{background:#192a1c}
/* Subtabs */
.subtabs{display:flex;margin-bottom:20px;border-bottom:1px solid #1e3322}
.subtab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:#7a9a80;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.active{color:#c8a042;font-weight:700;border-bottom-color:#c8a042}
/* Stat cards */
.stat-card{padding:18px;display:flex;align-items:center;gap:14px}
.stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:#7a9a80;margin-top:3px}
/* Biblio */
.fiche-body{margin-top:16px;padding:16px 18px;background:#0d1c10;border-radius:10px;border:1px solid #1e3322;color:#7a9a80;font-size:13.5px;line-height:2;white-space:pre-wrap;display:none}
.fiche-body.open{display:block}
/* Session row */
.sess-row{display:flex;gap:12px;padding:12px 16px;background:#0d1c10;border-radius:10px;border:1px solid #1e3322;margin-bottom:8px}
.sess-num{width:26px;height:26px;border-radius:50%;background:#c8a04218;color:#c8a042;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
/* Obj row */
.obj-row{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#0d1c10;border-radius:10px;border:1px solid #1e3322;margin-bottom:8px}
.obj-check{width:22px;height:22px;border-radius:6px;border:2px solid;background:transparent;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;cursor:pointer}
/* Progress bar */
.prog-track{height:3px;background:#1e3322;border-radius:4px;margin-top:4px}
.prog-bar{height:3px;border-radius:4px}
/* Action buttons on dashboard */
.action-card{padding:18px;cursor:pointer;text-align:center;border-radius:14px;border:1px dashed;transition:background .15s}
/* Quick form */
.qform{padding:24px;margin-bottom:20px;border-radius:14px;border:1px solid #c8a04244;background:#121f15}
/* Notes textarea */
#notesArea{flex:1;line-height:1.9;padding:22px;font-size:14px;border-radius:14px;min-height:0}
/* Tooltip */
.copied{color:#4a9e6a!important;border-color:#4a9e6a44!important}
/* Accordion arrow */
.arr{color:#4a6a52;font-size:18px;user-select:none}
</style>

<script>

const PC = {HPI:"#9880d0",HSP:"#d4885a",TDAH:"#5aaec8","HPI+HSP":"#b87898","HPI+TDAH":"#8090c8","HSP+TDAH":"#88a8b0",Mixte:"#4a9e6a"};
const PROFILES = ["HPI","HSP","TDAH","HPI+HSP","HPI+TDAH","HSP+TDAH","Mixte"];
const CAT_COLORS = {"Questions puissantes":"#c8a042","NLP":"#9880d0","Sophrologie & somatique":"#5ab8a8","Protocole burnout":"#d07070","Outils pratiques":"#4a9e6a","Communication assertive":"#5aaec8","Régulation émotionnelle":"#d4885a"};

const SAMPLE = [
  {id:"s1",name:"Sophie M.",profile:"HPI+HSP",age:34,objective:"Gestion du burnout et reconnexion à soi",sessions:4,nextSession:"2026-03-18",status:"actif",notes:"Très analytique. Réagit bien aux métaphores.",sessionHistory:["Séance 1 — Accueil, exploration burnout","Séance 2 — Croyances limitantes (NLP)","Séance 3 — Roue de vie","Séance 4 — Plan de reconnexion"],objectifs:[{id:"o1",titre:"Poser des limites avec sa hiérarchie",echeance:"2026-04-01",statut:"en cours"},{id:"o2",titre:"Cohérence cardiaque chaque matin",echeance:"",statut:"atteint"}]},
  {id:"s2",name:"Thomas K.",profile:"TDAH",age:28,objective:"Organisation et gestion du temps",sessions:2,nextSession:"2026-03-20",status:"actif",notes:"Préfère les outils visuels et étapes courtes.",sessionHistory:["Séance 1 — Exploration TDAH","Séance 2 — Système 3 blocs"],objectifs:[{id:"o3",titre:"Appliquer le système 3 blocs 2 semaines",echeance:"2026-04-05",statut:"en cours"}]},
];

const BIBLIO = [
  {id:"q1",cat:"Questions puissantes",profil:"Tous",titre:"Ouverture & exploration",source:"Meta-Coaching — Hall & Duval",
   contenu:`1. Qu'est-ce qui est le plus important pour toi là, maintenant ?
2. Si tu n'avais aucune limite, que ferais-tu ?
3. Qu'est-ce que cette situation te coûte de ne pas changer ?
4. De quoi as-tu besoin pour avancer ?
5. Qu'est-ce qui serait différent si ce problème était résolu ?
6. Qu'est-ce que tu sais déjà, au fond de toi ?
7. Quel serait le premier petit pas possible aujourd'hui ?`},
  {id:"q2",cat:"Questions puissantes",profil:"HPI",titre:"Décélération & ancrage (HPI)",source:"Assenheim — Mon Cerveau est Hyper",
   contenu:`1. Parmi toutes ces idées, laquelle résonne le plus avec qui tu es vraiment ?
2. Si tu devais choisir UNE seule priorité cette semaine, laquelle ?
3. Qu'est-ce que tu ressens dans ton corps quand tu penses à ça ?
4. Tu analyses beaucoup — qu'est-ce que TOI tu veux vraiment ?
5. À quel moment tu t'es senti pleinement toi-même récemment ?`},
  {id:"q3",cat:"Questions puissantes",profil:"HSP",titre:"Validation & besoins (HSP)",source:"Coaching HSP — approche somatique",
   contenu:`1. Qu'est-ce que tu as absorbé des autres aujourd'hui qui n'est pas le tien ?
2. Où dans ton corps ressens-tu ça ?
3. Qu'est-ce dont tu as besoin pour te sentir en sécurité ici ?
4. Si ta sensibilité était un superpouvoir, comment tu l'utiliserais là ?
5. Quelle est la frontière que tu as du mal à maintenir en ce moment ?`},
  {id:"q4",cat:"Questions puissantes",profil:"TDAH",titre:"Focus & momentum (TDAH)",source:"Coaching TDAH — approche forces",
   contenu:`1. Quelle est la SEULE chose que tu ferais si tu ne pouvais en faire qu'une ?
2. Qu'est-ce qui te donne de l'énergie vs ce qui t'en prend ?
3. À quel moment de la journée tu es le plus efficace ?
4. C'est quoi le vrai obstacle : la tâche ou ce qu'elle représente ?
5. Comment rendre ça plus fun, plus rapide, plus stimulant ?`},
  {id:"n1",cat:"NLP",profil:"Tous",titre:"Recadrage de contenu",source:"NLP — Bandler & Grinder",
   contenu:`OBJECTIF : Changer la signification attribuée à un événement.

1. Identifier la croyance limitante : « Qu'est-ce que tu dis sur toi dans cette situation ? »
2. Questionner : « Est-ce TOUJOURS vrai ? Dans 100% des cas ? »
3. Proposer une autre perspective : « Et si ça signifiait autre chose ? »
4. Ancrer la nouvelle signification : « Si c'était une preuve de ta force ? »
5. Test : « Sur 1 à 10, comment tu te sens avec cette nouvelle façon de voir ? »

EXEMPLE : "Je suis trop sensible" → "Je perçois ce que les autres ne voient pas encore"`},
  {id:"n2",cat:"NLP",profil:"HPI",titre:"Ligne du temps — décision (HPI)",source:"NLP — Ligne du temps",
   contenu:`OBJECTIF : Débloquer une décision via la sagesse temporelle.

1. Imaginer une ligne du temps devant soi.
2. Avancer vers le FUTUR : « Imagine que tu as fait ce choix. Comment tu te sens ? »
3. Explorer les conséquences à 1 an, 5 ans, 10 ans.
4. Revenir au présent : « Depuis ce futur, quel conseil tu te donnes ? »
5. Ancrer la ressource : geste ou mot-clé associé à la clarté ressentie.

ADAPTÉ HPI : Le HPI visualise plusieurs futurs simultanément — choisir le plus ALIGNÉ, pas le plus optimal.`},
  {id:"n3",cat:"NLP",profil:"HSP",titre:"Ancrage ressource (HSP)",source:"NLP — Ancrage",
   contenu:`OBJECTIF : Créer une ancre corporelle de sécurité rapidement accessible.

1. Identifier un souvenir de sécurité absolue.
2. Immersion sensorielle : voir, entendre, ressentir dans le corps.
3. Au pic de l'état ressource : poser l'ancre (pression sur le poignet).
4. Répéter 3 fois pour renforcer.
5. Tester : activer l'ancre et vérifier le retour de l'état ressource.

ADAPTÉ HSP : Ancres discrètes (poignet, lobe de l'oreille) utilisables en public.`},
  {id:"n4",cat:"NLP",profil:"TDAH",titre:"Modélisation état de flow (TDAH)",source:"NLP + Csikszentmihalyi — Flow",
   contenu:`OBJECTIF : Reproduire volontairement un état de concentration intense.

1. « Rappelle-toi d'un moment où tu étais totalement absorbé. »
2. Mapping sensoriel : environnement, sensations, énergie.
3. Identifier les déclencheurs : heure, type de tâche, niveau de défi.
4. Créer un rituel d'entrée : musique, posture, durée (pomodoro 25 min).
5. Ancrer et tester.

ADAPTÉ TDAH : Le flow arrive quand la tâche est juste assez difficile — calibrer le défi.`},
  {id:"s1b",cat:"Sophrologie & somatique",profil:"Tous",titre:"Cohérence cardiaque 3-6-5",source:"Dr David O'Hare",
   contenu:`OBJECTIF : Réguler le système nerveux en 5 minutes.
→ 3 fois par jour / 6 respirations par minute / 5 minutes

1. S'installer, colonne droite.
2. Inspiration nasale : 5 secondes.
3. Expiration buccale : 5 secondes.
4. Maintenir 5 minutes.
5. Observer sans juger.

EFFETS : Réduction cortisol, clarté mentale, retour au calme.
CONSEIL : Matin + avant séance + avant de dormir.
ADAPTÉ TDAH : Utiliser une app de guidage visuel (RespiRelax).`},
  {id:"s2b",cat:"Sophrologie & somatique",profil:"HSP",titre:"Protocole de décharge sensorielle",source:"Peter Levine — Somatic Experiencing",
   contenu:`OBJECTIF : Libérer les tensions d'hyperstimulation.
DURÉE : 15-20 minutes

1. SCAN CORPOREL (3 min) : Balayer le corps de la tête aux pieds. Nommer les tensions sans les changer.

2. SECOUSSE CONSCIENTE (5 min) : Pieds écartés, laisser les genoux fléchir et vibrer doucement. Laisser monter progressivement.

3. EXPIRATION SONORE (3 min) : Inspirer profond, expirer avec un son (soupir, "aaah"). Répéter jusqu'au relâchement.

4. ANCRAGE (5 min) : S'allonger. Sentir le poids du corps. Nommer 5 choses vues, 4 entendues, 3 touchées.

SIGNAL : Bâillement spontané, chaleur dans les mains.`},
  {id:"s3b",cat:"Sophrologie & somatique",profil:"HPI",titre:"Scan de désaccélération mentale",source:"Jon Kabat-Zinn — MBSR",
   contenu:`OBJECTIF : Passer de la pensée arborescente à la présence.
DURÉE : 10 minutes

1. OBSERVATION (2 min) : Les pensées comme des nuages. Ne pas les suivre ni les repousser.

2. DESCENTE (3 min) : Attention sur les pieds → chevilles → mollets → bassin → ventre → poitrine → épaules → visage.

3. POINT DE GRAVITÉ (3 min) : Centre dans le bas-ventre. Respirer depuis ce centre.

4. QUESTION D'ANCRAGE (2 min) : « Qu'est-ce qui est vrai, là, maintenant ? » Laisser la réponse venir du corps.

ADAPTÉ HPI : Si les pensées s'emballent, les noter avant de commencer.`},
  {id:"s4b",cat:"Sophrologie & somatique",profil:"TDAH",titre:"Activation physique pré-séance",source:"Dr John Ratey — Spark",
   contenu:`OBJECTIF : Stimuler dopamine et noradrénaline avant un travail cognitif.
DURÉE : 5-10 minutes

1. ACTIVATION (2 min) : Tête de gauche à droite, cercles épaules, marche genoux levés.

2. CROISEMENTS (2 min) : Genou gauche + main droite, alternance rapide. Active les deux hémisphères.

3. RESPIRATION ACTIVANTE (2 min) : Inspiration 3 sec / rétention 1 sec / expiration forte. × 10.

4. INTENTION (1 min) : « Aujourd'hui je vais travailler sur… et je m'autorise à… »

POURQUOI : L'exercice augmente BDNF et dopamine, essentiels pour l'attention TDAH.`},
  {id:"b1b",cat:"Protocole burnout",profil:"Tous",titre:"Évaluation initiale burnout (5 axes)",source:"Christina Maslach + modèle CARE",
   contenu:`5 AXES À ÉVALUER (de 0 à 10) :

① ÉPUISEMENT PHYSIQUE
→ Signes : sommeil non récupérateur, douleurs, infections.

② ÉPUISEMENT ÉMOTIONNEL
→ Signes : émoussement, cynisme, irritabilité.

③ ÉPUISEMENT COGNITIF
→ Signes : brouillard mental, oublis, indécision.

④ PERTE DE SENS
→ Signes : détachement, sentiment d'inutilité.

⑤ ISOLEMENT
→ Signes : repli, évitement social, honte.

INTERPRÉTATION :
≤ 25 = vigilance
25-40 = burnout modéré
> 40 = arrêt recommandé`},
  {id:"b2b",cat:"Protocole burnout",profil:"HPI",titre:"Reconnecter au sens — post-burnout (HPI)",source:"Cathy Assenheim",
   contenu:`PHASE 1 — PERMISSION DE SE REPOSER (séances 1-2)
→ Déconstruire : "je dois produire pour avoir de la valeur"
→ Exercice : liste de 10 choses que tu ES, sans verbe d'action.

PHASE 2 — RÉINVENTAIRE DES FORCES (séances 3-4)
→ Roue de l'énergie : ce qui recharge vs ce qui vide.
→ Question : "Qu'est-ce que tu ferais si tu ne pouvais pas échouer ?"

PHASE 3 — RECONSTRUCTION DU SENS (séances 5-6)
→ Valeurs non négociables.
→ Contrat avec soi-même : 3 engagements.
→ Rituels de ressourcement quotidien.

VIGILANCE : Le HPI peut intellectualiser le burnout sans en vivre la guérison. Ancrer dans le corps.`},
  {id:"b3b",cat:"Protocole burnout",profil:"HSP",titre:"Récupération sensorielle (HSP)",source:"Elaine Aron + Somatic Experiencing",
   contenu:`SEMAINE 1-2 : DÉCONNEXION
→ Réduire stimuli, rituels de silence (10 min entre activités)
→ Journal des "voleurs d'énergie"

SEMAINE 3-4 : RESTAURATION
→ Nature, créativité, beauté
→ Cohérence cardiaque + marche 20 min/jour
→ Budget d'énergie : 10 jetons/jour

SEMAINE 5-6 : RECALIBRATION
→ Besoins fondamentaux non satisfaits
→ Zones tampon entre stimulations
→ Script de communication des besoins

QUESTION CLÉ : "Qu'est-ce que tu n'as pas le droit de ressentir selon toi ?"`},
  {id:"o1b",cat:"Outils pratiques",profil:"Tous",titre:"Roue de vie — version atypiques",source:"Adapté Wheel of Life",
   contenu:`8 DOMAINES (de 0 à 10) :

① ÉNERGIE & CORPS — Je prends soin de mon corps ?
② MENTAL & CLARTÉ — Mon esprit est clair et apaisé ?
③ ÉMOTIONS — Je reconnais et exprime mes émotions ?
④ RELATIONS — Mes relations me nourrissent ?
⑤ TRAVAIL & SENS — Mon travail a du sens ?
⑥ CRÉATIVITÉ — J'explore, je crée, j'apprends ?
⑦ LIMITES — Je sais dire non ?
⑧ PLAISIR — Je ris, je joue, je savoure ?

UTILISATION :
1. Client note chaque domaine (5 min)
2. Domaine le plus bas : "Que se passerait-il si ça montait de 1 ?"
3. Domaine le plus haut : "Comment cette force peut-elle aider les autres ?"
4. 1 action concrète pour la semaine.`},
  {id:"o2b",cat:"Outils pratiques",profil:"HPI",titre:"Journal de décélération (HPI)",source:"Journaling adapté HPI",
   contenu:`FORMAT QUOTIDIEN — 10 minutes le soir

① CE QUI S'EST PASSÉ (2 min) — Faits bruts, sans analyse.

② CE QUE J'AI RESSENTI (3 min) — Émotions, sensations corporelles.

③ CE QUE J'AI APPRIS (2 min) — 1 seule chose. Pas une liste.

④ BESOIN DE DEMAIN (1 min) — 1 besoin, 1 action.

⑤ GRATITUDE (2 min) — 1 chose concrète, ressentie dans le corps.

RÈGLE DU JEU : Interdiction d'analyser. Juste décrire et ressentir.`},
  {id:"o3b",cat:"Outils pratiques",profil:"TDAH",titre:"Système des 3 blocs (TDAH)",source:"Dr Ned Hallowell + Russell Barkley",
   contenu:`MATIN — BLOC COGNITIF (pic dopamine)
→ Tâches de concentration max
→ 90 min max, pauses de 10 min
→ UNE tâche à la fois, téléphone en mode avion

APRÈS-MIDI — BLOC CRÉATIF & RELATIONNEL
→ Réunions, appels, créativité
→ Blocs de 45 min

FIN DE JOURNÉE — BLOC ADMINISTRATIF
→ Emails, rangement, planification du lendemain
→ 30-45 min max

RITUELS DE TRANSITION :
→ 10 min de marche entre chaque bloc
→ Début : "Mon intention pour ce bloc est…"
→ Fin : noter ce qui reste (vider la RAM)`},
  {id:"o4b",cat:"Outils pratiques",profil:"HSP",titre:"Carte des déclencheurs sensoriels",source:"Elaine Aron — The Highly Sensitive Person",
   contenu:`À REMPLIR AVEC LE CLIENT :

DÉCLENCHEURS SONORES
→ Ce qui épuise : _____ Ce qui ressource : _____

DÉCLENCHEURS VISUELS

function exportBackup() {
  const payload = {
    version: "cs4",
    exportedAt: new Date().toISOString(),
    clients: state.clients,
    ressources: state.ressources,
    notes: state.notes
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `coachingstudio-sauvegarde-${d}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert("Fichier invalide : impossible de lire ce JSON.");
      return;
    }
    if (!data.clients || !Array.isArray(data.clients)) {
      alert("Fichier invalide : format de sauvegarde non reconnu.");
      return;
    }
    if (!confirm(`Restaurer cette sauvegarde va REMPLACER les données actuelles (${state.clients.length} client(s) actuel(s) → ${data.clients.length} client(s) dans la sauvegarde). Continuer ?`)) return;
    state.clients = data.clients;
    state.ressources = data.ressources || [];
    state.notes = data.notes || "";
    save();
    setState({tab:"dashboard", selClientId:null});
    alert("Sauvegarde restaurée avec succès.");
  };
  reader.readAsText(file);
}

document.addEventListener("DOMContentLoaded", () => {
  const btnExport = document.getElementById("btnExport");
  const btnImport = document.getElementById("btnImport");
  const fileImport = document.getElementById("fileImport");
  if (btnExport) btnExport.addEventListener("click", exportBackup);
  if (btnImport) btnImport.addEventListener("click", () => fileImport.click());
  if (fileImport) fileImport.addEventListener("change", (e) => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    fileImport.value = "";
  });
});

const CoachLink = {
  user: null,
  linkedFamilies: JSON.parse(localStorage.getItem("cs4-linkedFamilies") || "[]"),
  familyData: {},
  unsubs: {},

  init() {
    firebase.auth().onAuthStateChanged(u => {
      this.user = u;
      if (u) this.linkedFamilies.forEach(code => this.listen(code));
      if (state.tab === "clairiere") render();
    });
  },

  login(email, password) {
    return firebase.auth().signInWithEmailAndPassword(email, password)
      .catch(e => { notifCoach(traduireErreurAuth(e.code)); throw e; });
  },

  logout() { firebase.auth().signOut(); },

  claimShareCode(shareCode, cb) {
    const code = (shareCode || "").trim().toUpperCase();
    if (!code) return;
    const db = firebase.firestore();
    db.collection("coachLinks").doc(code).get().then(snap => {
      if (!snap.exists) { notifCoach("Code invalide ou déjà utilisé."); return; }
      const familyCode = snap.data().familyCode;
      const famRef = db.collection("familles").doc(familyCode);
      famRef.get().then(famSnap => {
        if (!famSnap.exists) { notifCoach("Famille introuvable."); return; }
        const current = famSnap.data().authorizedCoaches || [];
        const currentUids = famSnap.data().authorizedCoachUids || [];
        if (current.some(c => c.uid === this.user.uid)) {
          notifCoach("Vous êtes déjà autorisé pour cette famille.");
        } else {
          famRef.update({
            authorizedCoaches: current.concat([{ uid: this.user.uid, email: this.user.email, addedAt: new Date().toISOString() }]),
            authorizedCoachUids: currentUids.concat([this.user.uid])
          }).then(() => {
            db.collection("coachLinks").doc(code).delete().catch(()=>{});
            if (!this.linkedFamilies.includes(familyCode)) {
              this.linkedFamilies.push(familyCode);
              localStorage.setItem("cs4-linkedFamilies", JSON.stringify(this.linkedFamilies));
            }
            this.listen(familyCode);
            notifCoach("✅ Famille liée avec succès.");
            cb && cb();
          }).catch(e => notifCoach("Erreur : " + e.message));
        }
      });
    }).catch(e => notifCoach("Erreur : " + e.message));
  },

  listen(familyCode) {
    if (this.unsubs[familyCode]) return;
    const ref = firebase.firestore().collection("familles").doc(familyCode);
    this.unsubs[familyCode] = ref.onSnapshot(snap => {
      if (snap.exists) this.familyData[familyCode] = snap.data();
      if (state.tab === "clairiere") render();
    }, e => console.error("listen family:", e));
  },

  unlink(familyCode) {
    if (this.unsubs[familyCode]) { this.unsubs[familyCode](); delete this.unsubs[familyCode]; }
    this.linkedFamilies = this.linkedFamilies.filter(c => c !== familyCode);
    localStorage.setItem("cs4-linkedFamilies", JSON.stringify(this.linkedFamilies));
    delete this.familyData[familyCode];
    render();
  }
};

}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.firstElementChild || d;
}

function divider() { return h("div",{class:"divider"}); }

function card(...children) {
  return h("div",{class:"card"}, ...children);
}

function lbl(text) { return h("label",{class:"lbl"}, text); }

function inputEl(opts) {
  const el = h("input", {type:opts.type||"text", placeholder:opts.placeholder||""});
  el.value = opts.value || "";
  if (opts.onInput) el.addEventListener("input", e => opts.onInput(e.target.value));
  if (opts.onChange) el.addEventListener("change", e => opts.onChange(e.target.value));
  return el;
}

function textareaEl(opts) {
  const el = h("textarea", {placeholder:opts.placeholder||""});
  el.value = opts.value || "";
  el.style.height = opts.height || "auto";
  if (opts.onInput) el.addEventListener("input", e => opts.onInput(e.target.value));
  if (opts.onBlur) el.addEventListener("blur", e => opts.onBlur(e.target.value));
  return el;
}

function selectEl(opts) {
  const el = h("select", {});
  opts.options.forEach(o => {
    const opt = h("option", {value:o}, o);
    if (o === opts.value) opt.selected = true;
    el.appendChild(opt);
  });
  if (opts.onChange) el.addEventListener("change", e => opts.onChange(e.target.value));
  return el;
}

function field(labelText, inputElement) {
  return h("div", {}, lbl(labelText), inputElement);
}

    const n = clients.filter(c=>c.profile===p).length;
    if (!n) return;
    const pct = Math.round(n/clients.length*100);
    const col = profileColor(p);
    const div = h("div",{style:"margin-bottom:12px"},
      h("div",{style:"display:flex;justify-content:space-between;margin-bottom:4px"},
        badgeProfil(p), h("span",{style:"color:#7a9a80;font-size:11px"},`${n} · ${pct}%`)
      ),
      h("div",{class:"prog-track"}, h("div",{class:"prog-bar",style:`width:${pct}%;background:${col}`}))
    );
    profCard.appendChild(div);
  });

  const midRow = h("div",{style:"display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px"});
  midRow.appendChild(sessCard); midRow.appendChild(profCard);

  // Actions
  const actions = h("div",{style:"display:grid;grid-template-columns:repeat(4,1fr);gap:12px"});
  [
    {label:"Nouveau client",     icon:"＋", color:"#c8a042", act:()=>setState({tab:"clients",selClientId:null})},
    {label:"Bibliothèque coach", icon:"▣", color:"#9880d0", act:()=>setState({tab:"bibliotheque"})},
    {label:"Mes ressources",     icon:"◇", color:"#5ab8a8", act:()=>setState({tab:"ressources"})},
    {label:"Journal de bord",    icon:"◻", color:"#5aaec8", act:()=>setState({tab:"notes"})},
  ].forEach(q => {
    const btn = h("div",{class:"action-card",style:`color:${q.color};background:${q.color}08;border-color:${q.color}44`},
      h("div",{style:"font-size:24px;margin-bottom:7px"},q.icon),
      h("div",{style:"font-size:12px;font-weight:600"},q.label)
    );
    btn.addEventListener("click", q.act);
    btn.addEventListener("mouseenter",()=>btn.style.background=q.color+"1a");
    btn.addEventListener("mouseleave",()=>btn.style.background=q.color+"08");
    actions.appendChild(btn);
  });

  const wrap = h("div",{class:"fade"},
    h("div",{style:"margin-bottom:32px"},
      h("h1",{style:"font-size:38px;color:#ede8d8;font-weight:600;font-style:italic"},"Tableau de bord ✦"),
      h("p",{style:"color:#7a9a80;font-size:15px;margin-top:6px"},"Vue d'ensemble de votre pratique")
    ),
    statsRow, midRow, actions
  );
  return wrap;
}

function renderClients() {
  if (state.selClientId) return renderClientDetail();
  return renderClientList();
}

function renderClientList() {
  const wrap = h("div",{class:"fade"});

  const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:24px"},
    h("h1",{style:"font-size:30px;color:#ede8d8;font-weight:600;font-style:italic"},"Mes Clients")
  );
  let showForm = false;

  const addBtn = h("button",{class:"btn"},  "+ Nouveau client");

  let formEl = null;
  addBtn.addEventListener("click", () => {
    showForm = !showForm;
    addBtn.textContent = showForm ? "✕ Fermer" : "+ Nouveau client";
    if (showForm && !formEl) {
      formEl = buildAddForm();
      hdr.after(formEl);
    } else if (!showForm && formEl) {
      formEl.remove(); formEl = null;
    }
  });
  hdr.appendChild(addBtn);
  wrap.appendChild(hdr);

  // Liste
  const list = h("div",{style:"display:grid;gap:10px"});
  if (!state.clients.length) {
    list.appendChild(h("div",{class:"card",style:"padding:48px;text-align:center;color:#4a6a52;font-size:14px"},"Aucun client. Ajoutez le premier ci-dessus."));
  } else {
    state.clients.forEach(c => {
      const row = h("div",{class:"card client-row"},
        avatar(c.name,c.profile),
        h("div",{style:"flex:1;min-width:0"},
          h("div",{style:"color:#ede8d8;font-size:15px;font-weight:600"},c.name),
          h("div",{style:"color:#7a9a80;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},c.objective||"Aucun objectif")
        ),
        h("div",{style:"display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0"},
          badgeProfil(c.profile),
          h("div",{style:"display:flex;gap:6px;align-items:center"},
            badgeStatus(c.status),
            h("span",{style:"color:#4a6a52;font-size:12px"},`${c.sessions} séances`)
          )
        ),
        h("span",{style:"color:#2a4535;font-size:18px"},"›")
      );
      row.addEventListener("click",()=>setState({selClientId:c.id,subTab:"fiche"}));
      list.appendChild(row);
    });
  }
  wrap.appendChild(list);
  return wrap;
}

let formData = {};
function buildAddForm() {
  formData = {name:"",profile:"HPI",age:"",objective:"",nextSession:"",notes:"",status:"actif"};
  const form = h("div",{class:"qform",style:"margin-bottom:20px"});
  form.appendChild(h("h3",{style:"color:#c8a042;font-size:21px;margin-bottom:18px;font-style:italic"},"Nouveau client"));

  const g = h("div",{class:"grid2",style:"margin-bottom:12px"});

  const nameInp = inputEl({placeholder:"Ex: Marie D.", onInput:v=>formData.name=v});
  const ageInp  = inputEl({type:"number", placeholder:"Ex: 32", onInput:v=>formData.age=v});
  const profSel = selectEl({options:PROFILES, value:"HPI", onChange:v=>formData.profile=v});
  const datInp  = inputEl({type:"date", onChange:v=>formData.nextSession=v});

  g.appendChild(field("PRÉNOM & NOM *", nameInp));
  g.appendChild(field("ÂGE", ageInp));
  g.appendChild(field("PROFIL", profSel));
  g.appendChild(field("PROCHAINE SÉANCE", datInp));
  form.appendChild(g);

  const objInp = inputEl({placeholder:"Ex: Confiance en soi, gestion du stress...", onInput:v=>formData.objective=v});
  form.appendChild(h("div",{style:"margin-bottom:12px"},field("OBJECTIF", objInp)));

  const notInp = textareaEl({placeholder:"Notes...", height:"64px", onInput:v=>formData.notes=v});
  form.appendChild(h("div",{style:"margin-bottom:18px"},field("NOTES", notInp)));

  const row = h("div",{style:"display:flex;gap:10px"});
  const saveBtn = h("button",{class:"btn"},"Ajouter");
  saveBtn.addEventListener("click",()=>{
    if (!formData.name.trim()) return;
    state.clients.push({...formData,id:Date.now()+"",sessions:0,sessionHistory:[],objectifs:[]});
    save(); setState({tab:"clients"});
  });
  const cancelBtn = h("button",{class:"btn-g"},"Annuler");
  cancelBtn.addEventListener("click",()=>setState({tab:"clients"}));
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  form.appendChild(row);
  return form;
}

function renderClientDetail() {
  const c = state.clients.find(x=>x.id===state.selClientId);
  if (!c) { setState({selClientId:null}); return renderClientList(); }

  const wrap = h("div",{class:"fade"});
  const backBtn = h("button",{class:"btn-g",style:"margin-bottom:18px"},"← Retour");
  backBtn.addEventListener("click",()=>setState({selClientId:null}));
  wrap.appendChild(backBtn);

  const box = h("div",{class:"card",style:"padding:26px"});

  // Header
  const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px"},
    h("div",{style:"display:flex;gap:16px;align-items:center"},
      avatar(c.name,c.profile,58),
      h("div",{},
        h("h2",{style:"font-size:28px;color:#ede8d8;font-weight:600;font-style:italic"},c.name),
        h("div",{style:"display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center"},
          badgeProfil(c.profile),
          c.age?h("span",{style:"color:#7a9a80;font-size:13px"},c.age+" ans"):null,
          badgeStatus(c.status)
        )
      )
    ),
    h("div",{style:"text-align:right"},
      h("div",{style:"font-size:38px;color:#c8a042;font-weight:700;line-height:1"},String(c.sessions||0)),
      h("div",{style:"color:#7a9a80;font-size:12px"},"séances")
    )
  );
  box.appendChild(hdr);

  // Subtabs
  const stabs = h("div",{class:"subtabs"});
  [["fiche","◈ Fiche"],["seances","◉ Séances"],["objectifs","◇ Objectifs"],["paiements","€ Paiements"],["notes-c","◻ Notes"]].forEach(([id,lbl])=>{
    const b = h("button",{class:"subtab"+(state.subTab===id?" active":"")},lbl);
    b.addEventListener("click",()=>{ state.subTab=id; render(); });
    stabs.appendChild(b);
  });
  box.appendChild(stabs);

  // Content
  const content = h("div",{class:"fade"});
  if (state.subTab==="fiche")     content.appendChild(buildFiche(c));
  if (state.subTab==="seances")   content.appendChild(buildSeances(c));
  if (state.subTab==="objectifs") content.appendChild(buildObjectifs(c));
  if (state.subTab==="paiements") content.appendChild(buildPaiements(c));
  if (state.subTab==="notes-c")   content.appendChild(buildNotesClient(c));
  box.appendChild(content);
  wrap.appendChild(box);
  return wrap;
}

function buildFiche(c) {
  let editMode = false;
  const wrap = h("div",{});

  function showView() {
    wrap.innerHTML="";
    const g = h("div",{class:"grid2"});
    if (c.objective) g.appendChild(h("div",{},
      h("div",{style:"color:#4a6a52;font-size:11px;letter-spacing:.08em;margin-bottom:5px"},"OBJECTIF"),
      h("div",{style:"color:#ede8d8;font-size:14px;line-height:1.6"},c.objective)
    ));
    if (c.nextSession) g.appendChild(h("div",{},
      h("div",{style:"color:#4a6a52;font-size:11px;letter-spacing:.08em;margin-bottom:5px"},"PROCHAINE SÉANCE"),
      h("div",{style:"color:#c8a042;font-size:14px;font-weight:600"},c.nextSession)
    ));
    wrap.appendChild(g);
    if (c.notes) {
      wrap.appendChild(h("div",{style:"margin-top:18px"},
        h("div",{style:"color:#4a6a52;font-size:11px;letter-spacing:.08em;margin-bottom:5px"},"NOTES"),
        h("div",{style:"color:#7a9a80;font-size:14px;line-height:1.7;background:#0d1c10;padding:12px 16px;border-radius:8px;border:1px solid #1e3322"},c.notes)
      ));
    }
    const row = h("div",{style:"display:flex;gap:10px;margin-top:22px"});
    const editBtn = h("button",{class:"btn"},"Modifier");
    editBtn.addEventListener("click",()=>{ editMode=true; showEdit(); });
    const delBtn = h("button",{class:"btn-g",style:"color:#d07070;border-color:#d0707044;margin-left:auto"},"Supprimer");
    delBtn.addEventListener("click",()=>{
      if (!confirm("Supprimer "+c.name+" ?")) return;
      state.clients = state.clients.filter(x=>x.id!==c.id);
      save(); setState({selClientId:null});
    });
    row.appendChild(editBtn); row.appendChild(delBtn);
    wrap.appendChild(row);
  }

  function showEdit() {
    wrap.innerHTML="";
    const ed = {...c};
    const g = h("div",{class:"grid2",style:"gap:12px"});
    const n = inputEl({value:c.name, onInput:v=>ed.name=v}); g.appendChild(field("PRÉNOM & NOM",n));
    const a = inputEl({type:"number",value:c.age||"", onInput:v=>ed.age=v}); g.appendChild(field("ÂGE",a));
    const p = selectEl({options:PROFILES,value:c.profile,onChange:v=>ed.profile=v}); g.appendChild(field("PROFIL",p));
    const s = selectEl({options:["actif","pause","terminé"],value:c.status,onChange:v=>ed.status=v}); g.appendChild(field("STATUT",s));
    const ob = h("div",{class:"span2"}); const oi = inputEl({value:c.objective||"",onInput:v=>ed.objective=v}); ob.appendChild(field("OBJECTIF",oi)); g.appendChild(ob);
    const db = h("div",{}); const di = inputEl({type:"date",value:c.nextSession||"",onChange:v=>ed.nextSession=v}); db.appendChild(field("PROCHAINE SÉANCE",di)); g.appendChild(db);
    wrap.appendChild(g);
    const nt = textareaEl({value:c.notes||"",height:"80px",onInput:v=>ed.notes=v});
    wrap.appendChild(h("div",{style:"margin-top:12px"},field("NOTES",nt)));
    const row = h("div",{style:"display:flex;gap:10px;margin-top:16px"});
    const sv = h("button",{class:"btn"},"Enregistrer");
    sv.addEventListener("click",()=>{
      Object.assign(c,ed);
      state.clients = state.clients.map(x=>x.id===c.id?c:x);
      save(); editMode=false; showView();
    });
    const ca = h("button",{class:"btn-g"},"Annuler");
    ca.addEventListener("click",()=>{ editMode=false; showView(); });
    row.appendChild(sv); row.appendChild(ca);
    wrap.appendChild(row);
  }

  showView();
  return wrap;
}

function buildSeances(c) {
  const wrap = h("div",{});
  let showForm = false;

  function render2() {
    wrap.innerHTML="";
    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"},
      h("span",{style:"color:#7a9a80;font-size:14px"},`${c.sessions||0} séance${(c.sessions||0)>1?"s":""}`),
    );
    const addBtn = h("button",{class:"btn-sm",style:"border-color:#c8a04244;color:#c8a042"},showForm?"✕ Annuler":"+ Nouvelle séance");
    addBtn.addEventListener("click",()=>{ showForm=!showForm; render2(); });
    hdr.appendChild(addBtn);
    wrap.appendChild(hdr);

    if (showForm) {
      const box = h("div",{class:"card",style:"padding:16px;margin-bottom:14px;border-color:#c8a04233"});
      box.appendChild(lbl("COMPTE-RENDU"));
      const ta = textareaEl({placeholder:"Points abordés, avancées, outil utilisé...",height:"76px"});
      box.appendChild(ta);
      const sv = h("button",{class:"btn",style:"margin-top:10px;padding:8px 18px;font-size:13px"},"Valider");
      sv.addEventListener("click",()=>{
        const val = ta.value.trim();
        if (!val) return;
        if (!c.sessionHistory) c.sessionHistory=[];
        c.sessions = (c.sessions||0)+1;
        c.sessionHistory.push(`Séance ${c.sessions} — ${val}`);
        state.clients = state.clients.map(x=>x.id===c.id?c:x);
        save(); showForm=false; render2();
      });
      box.appendChild(sv);
      wrap.appendChild(box);
    }

    if (!(c.sessionHistory||[]).length) {
      wrap.appendChild(h("p",{style:"color:#4a6a52;font-size:13px;padding:16px 0"},"Aucune séance enregistrée."));
    } else {
      [...c.sessionHistory].reverse().forEach((s,i,arr)=>{
        wrap.appendChild(h("div",{class:"sess-row"},
          h("div",{class:"sess-num"},String(arr.length-i)),
          h("div",{style:"color:#7a9a80;font-size:13px;line-height:1.6"},s.replace(/^Séance \d+ — /,""))
        ));
      });
    }
  }
  render2();
  return wrap;
}

function buildObjectifs(c) {
  const wrap = h("div",{});
  let showForm = false;
  let newObj = {titre:"",echeance:"",statut:"en cours"};

  function render2() {
    wrap.innerHTML="";
    if (!c.objectifs) c.objectifs=[];
    const atteints = c.objectifs.filter(o=>o.statut==="atteint").length;
    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"},
      h("span",{style:"color:#7a9a80;font-size:14px"},`${atteints}/${c.objectifs.length} atteint(s)`)
    );
    const addBtn = h("button",{class:"btn-sm",style:"border-color:#c8a04244;color:#c8a042"},showForm?"✕ Annuler":"+ Ajouter");
    addBtn.addEventListener("click",()=>{ showForm=!showForm; newObj={titre:"",echeance:"",statut:"en cours"}; render2(); });
    hdr.appendChild(addBtn);
    wrap.appendChild(hdr);

    if (showForm) {
      const box = h("div",{class:"card",style:"padding:16px;margin-bottom:14px;border-color:#c8a04233"});
      const g = h("div",{class:"grid2",style:"margin-bottom:10px"});
      const ti = inputEl({placeholder:"Ex: Poser des limites claires",onInput:v=>newObj.titre=v});
      g.appendChild(h("div",{class:"span2"},field("OBJECTIF",ti)));
      const da = inputEl({type:"date",onChange:v=>newObj.echeance=v});
      g.appendChild(field("ÉCHÉANCE",da));
      const st = selectEl({options:["en cours","atteint","suspendu"],value:"en cours",onChange:v=>newObj.statut=v});
      g.appendChild(field("STATUT",st));
      box.appendChild(g);
      const sv = h("button",{class:"btn",style:"padding:8px 18px;font-size:13px"},"Ajouter");
      sv.addEventListener("click",()=>{
        if (!newObj.titre.trim()) return;
        c.objectifs.push({...newObj,id:Date.now()+""});
        state.clients = state.clients.map(x=>x.id===c.id?c:x);
        save(); showForm=false; render2();
      });
      box.appendChild(sv);
      wrap.appendChild(box);
    }

    if (!c.objectifs.length) {
      wrap.appendChild(h("p",{style:"color:#4a6a52;font-size:13px;padding:16px 0"},"Aucun objectif défini."));
    } else {
      c.objectifs.forEach(o => {
        const col = o.statut==="atteint"?"#4a9e6a":o.statut==="suspendu"?"#4a6a52":"#5aaec8";
        const chk = h("div",{class:"obj-check",style:`border-color:${col};background:${o.statut==="atteint"?col:"transparent"};color:#080f0a`},
          o.statut==="atteint"?"✓":""
        );
        chk.addEventListener("click",()=>{
          o.statut = o.statut==="atteint"?"en cours":"atteint";
          state.clients = state.clients.map(x=>x.id===c.id?c:x);
          save(); render2();
        });
        const sbadge = h("span",{style:`padding:2px 8px;border-radius:20px;background:${col}18;color:${col};font-size:10px;font-weight:600`},o.statut);
        const del = h("button",{style:"background:transparent;border:none;cursor:pointer;color:#4a6a52;font-size:18px;padding:0 4px"},"×");
        del.addEventListener("click",()=>{
          c.objectifs = c.objectifs.filter(x=>x.id!==o.id);
          state.clients = state.clients.map(x=>x.id===c.id?c:x);
          save(); render2();
        });
        const row = h("div",{class:"obj-row"},
          chk,
          h("div",{style:"flex:1"},
            h("div",{style:`color:${o.statut==="atteint"?"#4a6a52":"#ede8d8"};font-size:14px;text-decoration:${o.statut==="atteint"?"line-through":"none"}`},o.titre),
            o.echeance?h("div",{style:"color:#4a6a52;font-size:11px;margin-top:2px"},"Échéance : "+o.echeance):null
          ),
          sbadge, del
        );
        wrap.appendChild(row);
      });
    }
  }
  render2();
  return wrap;
}

function buildPaiements(c) {
  const wrap = h("div",{});
  let showForm = false;
  let newPay = {date:"",montant:"",statut:"payé"};

  function render2() {
    wrap.innerHTML="";
    if (!c.paiements) c.paiements=[];
    const totalPaye = c.paiements.filter(p=>p.statut==="payé").reduce((s,p)=>s+Number(p.montant||0),0);
    const totalAttente = c.paiements.filter(p=>p.statut==="en attente").reduce((s,p)=>s+Number(p.montant||0),0);

    const summary = h("div",{style:"display:flex;gap:20px;margin-bottom:14px"},
      h("div",{},h("div",{style:"color:#4a6a52;font-size:11px"},"ENCAISSÉ"),h("div",{style:"color:#4a9e6a;font-size:20px;font-weight:700"},totalPaye.toFixed(0)+" €")),
      h("div",{},h("div",{style:"color:#4a6a52;font-size:11px"},"EN ATTENTE"),h("div",{style:"color:#c8a042;font-size:20px;font-weight:700"},totalAttente.toFixed(0)+" €"))
    );
    const addBtn = h("button",{class:"btn-sm",style:"border-color:#c8a04244;color:#c8a042;margin-left:auto"},showForm?"✕ Annuler":"+ Ajouter");
    addBtn.addEventListener("click",()=>{ showForm=!showForm; newPay={date:"",montant:"",statut:"payé"}; render2(); });
    const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"}, summary, addBtn);
    wrap.appendChild(hdr);

    if (showForm) {
      const box = h("div",{class:"card",style:"padding:16px;margin-bottom:14px;border-color:#c8a04233"});
      const g = h("div",{class:"grid2",style:"margin-bottom:10px"});
      const da = inputEl({type:"date",onChange:v=>newPay.date=v});
      g.appendChild(field("DATE",da));
      const mo = inputEl({type:"number",placeholder:"Ex: 80",onInput:v=>newPay.montant=v});
      g.appendChild(field("MONTANT (€)",mo));
      const st = selectEl({options:["payé","en attente"],value:"payé",onChange:v=>newPay.statut=v});
      g.appendChild(field("STATUT",st));
      box.appendChild(g);
      const sv = h("button",{class:"btn",style:"padding:8px 18px;font-size:13px"},"Ajouter");
      sv.addEventListener("click",()=>{
        if (!newPay.montant || !newPay.date) return;
        c.paiements.push({...newPay,id:Date.now()+""});
        state.clients = state.clients.map(x=>x.id===c.id?c:x);
        save(); showForm=false; render2();
      });
      box.appendChild(sv);
      wrap.appendChild(box);
    }

    if (!c.paiements.length) {
      wrap.appendChild(h("p",{style:"color:#4a6a52;font-size:13px;padding:16px 0"},"Aucun paiement enregistré."));
    } else {
      [...c.paiements].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(pay => {
        const col = pay.statut==="payé" ? "#4a9e6a" : "#c8a042";
        const del = h("button",{style:"background:transparent;border:none;cursor:pointer;color:#4a6a52;font-size:18px;padding:0 4px"},"×");
        del.addEventListener("click",()=>{
          c.paiements = c.paiements.filter(x=>x.id!==pay.id);
          state.clients = state.clients.map(x=>x.id===c.id?c:x);
          save(); render2();
        });
        const badge = h("span",{style:`padding:2px 8px;border-radius:20px;background:${col}18;color:${col};font-size:10px;font-weight:600`},pay.statut);
        const row = h("div",{class:"obj-row"},
          h("div",{style:"flex:1"},
            h("div",{style:"color:#ede8d8;font-size:14px"},Number(pay.montant||0).toFixed(0)+" €"),
            h("div",{style:"color:#4a6a52;font-size:11px;margin-top:2px"},pay.date||"")
          ),
          badge, del
        );
        wrap.appendChild(row);
      });
    }
  }
  render2();
  return wrap;
}

function buildNotesClient(c) {
  const wrap = h("div",{});
  wrap.appendChild(lbl("NOTES LIBRES SUR CE CLIENT"));
  const ta = textareaEl({value:c.notes||"",placeholder:"Observations, patterns, hypothèses, outils utilisés...",height:"200px"});
  ta.addEventListener("blur",e=>{
    c.notes = e.target.value;
    state.clients = state.clients.map(x=>x.id===c.id?c:x);
    save();
  });
  wrap.appendChild(ta);
  wrap.appendChild(h("p",{style:"color:#4a6a52;font-size:12px;margin-top:8px"},"Sauvegardé à la perte de focus."));
  return wrap;
}

// ══════════════════════════════════════════
//  BIBLIOTHÈQUE
// ══════════════════════════════════════════
function renderBibliotheque() {
  const wrap = h("div",{class:"fade"});
  wrap.appendChild(h("div",{style:"margin-bottom:24px"},
    h("h1",{style:"font-size:30px;color:#ede8d8;font-weight:600;font-style:italic"},"Bibliothèque du Coach"),
    h("p",{style:"color:#7a9a80;font-size:14px;margin-top:6px"},`${BIBLIO.length} fiches · Questions · NLP · Sophro · Burnout · Outils`)
  ));

  const CATS = [...new Set(BIBLIO.map(r=>r.cat))];

  // Filters box
  const fbox = h("div",{class:"card",style:"padding:18px;margin-bottom:16px"});
  const searchInp = inputEl({value:state.bibSearch, placeholder:"🔍 Rechercher dans la bibliothèque…", onInput:v=>{ state.bibSearch=v; rebuildList(); }});
  fbox.appendChild(h("div",{style:"margin-bottom:14px"},searchInp));

  // Cat filter
  const catRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center"});
  catRow.appendChild(h("span",{style:"color:#4a6a52;font-size:11px;margin-right:4px"},"CAT."));
  ["Tous",...CATS].forEach(c => {
    const b = h("button",{class:"btn-sm"}, c);
    if (state.bibCat===c) { b.style.background="#c8a04222"; b.style.color="#c8a042"; b.style.borderColor="#c8a04255"; }
    b.addEventListener("click",()=>{ state.bibCat=c; rebuildList(); });
    catRow.appendChild(b);
  });
  fbox.appendChild(catRow);

  // Profil filter
  const profRow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;align-items:center"});
  profRow.appendChild(h("span",{style:"color:#4a6a52;font-size:11px;margin-right:4px"},"PROFIL"));
  ["Tous",...PROFILES].forEach(p => {
    const col = PC[p]||"#c8a042";
    const b = h("button",{class:"btn-sm"}, p);
    if (state.bibProfil===p) { b.style.background=col+"22"; b.style.color=col; b.style.borderColor=col+"55"; }
    b.addEventListener("click",()=>{ state.bibProfil=p; rebuildList(); });
    profRow.appendChild(b);
  });
  fbox.appendChild(profRow);
  wrap.appendChild(fbox);

  const count = h("div",{style:"color:#4a6a52;font-size:12px;margin-bottom:12px"},"");
  wrap.appendChild(count);

  const list = h("div",{style:"display:grid;gap:10px"});
  wrap.appendChild(list);

  function rebuildList() {
    const filtered = BIBLIO.filter(r => {
      const mC = state.bibCat==="Tous" || r.cat===state.bibCat;
      const mP = state.bibProfil==="Tous" || r.profil===state.bibProfil || r.profil==="Tous";
      const mS = !state.bibSearch || r.titre.toLowerCase().includes(state.bibSearch.toLowerCase()) || r.contenu.toLowerCase().includes(state.bibSearch.toLowerCase());
      return mC && mP && mS;
    });
    count.textContent = `${filtered.length} résultat${filtered.length>1?"s":""}`;
    list.innerHTML="";

    if (!filtered.length) {
      list.appendChild(h("div",{class:"card",style:"padding:40px;text-align:center;color:#4a6a52;font-size:14px"},"Aucune fiche pour ces filtres."));
      return;
    }

    filtered.forEach(r => {
      let open = false;
      const card2 = h("div",{class:"card",style:"padding:16px 20px"});

      const body = h("div",{class:"fiche-body"}, r.contenu);

      const hdr2 = h("div",{style:"display:flex;align-items:center;gap:12px;cursor:pointer"});
      const info = h("div",{style:"flex:1"},
        h("div",{style:"color:#ede8d8;font-size:15px;font-weight:600;margin-bottom:6px"},r.titre),
        h("div",{style:"display:flex;gap:6px;flex-wrap:wrap;align-items:center"},
          badgeCat(r.cat), badgeProfil(r.profil),
          r.source?h("span",{style:"color:#4a6a52;font-size:10px;font-style:italic"},"— "+r.source):null
        )
      );

      const copyBtn = h("button",{class:"btn-sm",style:"font-size:11px"},"Copier");
      copyBtn.addEventListener("click",e=>{
        e.stopPropagation();
        try { navigator.clipboard.writeText(r.titre+"\n\n"+r.contenu); } catch(e){}
        copyBtn.textContent="✓ Copié"; copyBtn.style.color="#4a9e6a"; copyBtn.style.borderColor="#4a9e6a44";
        setTimeout(()=>{ copyBtn.textContent="Copier"; copyBtn.style.color=""; copyBtn.style.borderColor=""; },2000);
      });

      const arr = h("span",{class:"arr"},"▼");
      hdr2.appendChild(info); hdr2.appendChild(copyBtn); hdr2.appendChild(arr);
      hdr2.addEventListener("click",()=>{
        open=!open;
        body.style.display=open?"block":"none";
        arr.textContent=open?"▲":"▼";
      });

      card2.appendChild(hdr2); card2.appendChild(body);
      list.appendChild(card2);
    });
  }

  rebuildList();
  return wrap;
}

// ══════════════════════════════════════════
//  RESSOURCES PERSO
// ══════════════════════════════════════════
function renderRessources() {
  const wrap = h("div",{class:"fade"});
  const CATS = [...new Set(BIBLIO.map(r=>r.cat))];

  const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:24px"},
    h("div",{},
      h("h1",{style:"font-size:30px;color:#ede8d8;font-weight:600;font-style:italic"},"Mes Ressources"),
      h("p",{style:"color:#7a9a80;font-size:13px;margin-top:4px"},"Vos outils personnalisés")
    )
  );
  let showForm = false;
  const addBtn = h("button",{class:"btn"},"+ Créer");
  let formEl2 = null;
  addBtn.addEventListener("click",()=>{
    showForm=!showForm;
    addBtn.textContent=showForm?"✕ Fermer":"+ Créer";
    if (showForm && !formEl2) {
      formEl2=buildResForm(CATS);
      hdr.after(formEl2);
    } else if (!showForm && formEl2) { formEl2.remove(); formEl2=null; }
  });
  hdr.appendChild(addBtn);
  wrap.appendChild(hdr);

  // Filters
  const frow = h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"});
  ["Tous",...PROFILES].forEach(p=>{
    const col=PC[p]||"#c8a042";
    const b=h("button",{class:"btn-sm"},p);
    if (state.resProfil===p) { b.style.background=col+"22"; b.style.color=col; b.style.borderColor=col+"55"; }
    b.addEventListener("click",()=>{ state.resProfil=p; setState({tab:"ressources"}); });
    frow.appendChild(b);
  });
  wrap.appendChild(frow);

  const filtered = state.resProfil==="Tous" ? state.ressources : state.ressources.filter(r=>r.profil===state.resProfil);

  if (!filtered.length) {
    wrap.appendChild(h("div",{class:"card",style:"padding:40px;text-align:center;color:#4a6a52;font-size:14px"},
      state.ressources.length===0?"Créez votre première ressource ci-dessus.":"Aucune ressource pour ce filtre."
    ));
  } else {
    const list = h("div",{style:"display:grid;gap:10px"});
    filtered.forEach(r => {
      let open=false;
      const c2=h("div",{class:"card",style:"padding:16px 20px"});
      const body=h("div",{class:"fiche-body"},r.contenu);
      const hdr2=h("div",{style:"display:flex;align-items:center;gap:12px;cursor:pointer"});
      const info=h("div",{style:"flex:1"},
        h("div",{style:"color:#ede8d8;font-size:15px;font-weight:600;margin-bottom:6px"},r.titre),
        h("div",{style:"display:flex;gap:6px"},badgeCat(r.cat),badgeProfil(r.profil))
      );
      const cpBtn=h("button",{class:"btn-sm",style:"font-size:11px"},"Copier");
      cpBtn.addEventListener("click",e=>{ e.stopPropagation(); try{navigator.clipboard.writeText(r.contenu);}catch(e){}; cpBtn.textContent="✓"; setTimeout(()=>cpBtn.textContent="Copier",2000); });
      const delBtn=h("button",{class:"btn-sm",style:"font-size:11px;color:#d07070;border-color:#d0707044"},"×");
      delBtn.addEventListener("click",e=>{ e.stopPropagation(); if(confirm("Supprimer ?")){state.ressources=state.ressources.filter(x=>x.id!==r.id);save();setState({tab:"ressources"});} });
      const arr=h("span",{class:"arr"},"▼");
      hdr2.addEventListener("click",()=>{ open=!open; body.style.display=open?"block":"none"; arr.textContent=open?"▲":"▼"; });
      hdr2.appendChild(info); hdr2.appendChild(cpBtn); hdr2.appendChild(delBtn); hdr2.appendChild(arr);
      c2.appendChild(hdr2); c2.appendChild(body);
      list.appendChild(c2);
    });
    wrap.appendChild(list);
  }
  return wrap;
}

function buildResForm(CATS) {
  const fd={titre:"",profil:"HPI",cat:CATS[0]||"Outils pratiques",contenu:""};
  const form=h("div",{class:"qform",style:"margin-bottom:20px"});
  form.appendChild(h("h3",{style:"color:#c8a042;font-size:21px;margin-bottom:18px;font-style:italic"},"Nouvelle ressource"));
  const g=h("div",{class:"grid2",style:"margin-bottom:12px"});
  const ti=inputEl({placeholder:"Ex: Mon protocole d'ancrage",onInput:v=>fd.titre=v});
  g.appendChild(h("div",{class:"span2"},field("TITRE",ti)));
  const ps=selectEl({options:PROFILES,value:"HPI",onChange:v=>fd.profil=v});
  g.appendChild(field("PROFIL",ps));
  const cs=selectEl({options:CATS,value:CATS[0],onChange:v=>fd.cat=v});
  g.appendChild(field("CATÉGORIE",cs));
  form.appendChild(g);
  const ct=textareaEl({placeholder:"Contenu de la ressource...",height:"120px",onInput:v=>fd.contenu=v});
  form.appendChild(h("div",{style:"margin-bottom:12px"},field("CONTENU",ct)));
  const row=h("div",{style:"display:flex;gap:10px"});
  const sv=h("button",{class:"btn"},"Ajouter");
  sv.addEventListener("click",()=>{
    if (!fd.titre.trim()) return;
    state.ressources.push({...fd,id:Date.now()+""});
    save(); setState({tab:"ressources"});
  });
  const ca=h("button",{class:"btn-g"},"Annuler");
  ca.addEventListener("click",()=>setState({tab:"ressources"}));
  row.appendChild(sv); row.appendChild(ca);
  form.appendChild(row);
  return form;
}

// ══════════════════════════════════════════
//  NOTES
// ══════════════════════════════════════════
function renderNotes() {
  const wrap = h("div",{class:"fade",style:"display:flex;flex-direction:column;height:calc(100vh - 64px)"});
  const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-shrink:0"},
    h("div",{},
      h("h1",{style:"font-size:30px;color:#ede8d8;font-weight:600;font-style:italic"},"Journal de Bord"),
      h("p",{style:"color:#7a9a80;font-size:13px;margin-top:4px"},"Notes libres, réflexions, observations de pratique")
    )
  );
  const savedLbl = h("span",{style:"color:#4a9e6a99;font-size:12px;font-style:italic"},"✓ Sauvegardé");
  hdr.appendChild(savedLbl);
  wrap.appendChild(hdr);

  const ta = document.createElement("textarea");
  ta.id = "notesArea";
  ta.value = state.notes;
  ta.placeholder = "Notes libres…\n\nIdées, réflexions, observations, formations…\n\nTout est sauvegardé automatiquement.";
  ta.style.cssText = "flex:1;line-height:1.9;padding:22px;font-size:14px;border-radius:14px;min-height:0;width:100%;background:#0d1c10;border:1px solid #2a4535;border-radius:14px;color:#ede8d8;font-family:inherit;resize:none;outline:none";
  ta.addEventListener("input", e => {
    state.notes = e.target.value;
    savedLbl.textContent = "…";
    savedLbl.style.color = "#4a6a52";
    clearTimeout(notesTimer);
    notesTimer = setTimeout(()=>{
      localStorage.setItem("cs4-notes", state.notes);
      savedLbl.textContent = "✓ Sauvegardé";
      savedLbl.style.color = "#4a9e6a99";
    }, 800);
  });
  ta.addEventListener("focus", e => { ta.style.borderColor="#c8a042"; });
  ta.addEventListener("blur", e => { ta.style.borderColor="#2a4535"; });
  wrap.appendChild(ta);
  return wrap;
}

// ══════════════════════════════════════════
//  RENDER PRINCIPAL
// ══════════════════════════════════════════
function render() {
  renderNav();
  const main = document.getElementById("main");
  main.innerHTML = "";

  let content;
  if (state.tab==="dashboard")    content = renderDashboard();
  else if (state.tab==="clients") content = renderClients();
  else if (state.tab==="clairiere") content = renderClairiereTab();
  else if (state.tab==="bibliotheque") content = renderBibliotheque();
  else if (state.tab==="ressources")   content = renderRessources();
  else if (state.tab==="notes")        content = renderNotes();
  else content = renderDashboard();

  main.appendChild(content);
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
render();

(function() {
  const sidebar = document.getElementById('sidebar');
  const btn = document.getElementById('toggleBtn');
  let collapsed = false;
  btn.addEventListener('click', function() {
    collapsed = !collapsed;
    sidebar.classList.toggle('collapsed', collapsed);
    btn.textContent = collapsed ? '›' : '‹';
    btn.title = collapsed ? 'Ouvrir le panneau' : 'Réduire le panneau';
  });
})();
