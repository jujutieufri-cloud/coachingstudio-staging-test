<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CoachingStudio</title>
<link rel="icon" type="image/svg+xml" href="img/phare.svg"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:#F7F2E7;color:#2E2A20}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#FDFBF5}::-webkit-scrollbar-thumb{background:#D8CBA8;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .25s ease}
input,textarea,select{font-family:inherit;color:#2E2A20;background:#FFFFFF;border:1px solid #D8CBA8;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#9C7A2E}
input::placeholder,textarea::placeholder{color:#6B6355}
select option{background:#FBF7EC}
textarea{resize:vertical}
button{cursor:pointer;font-family:inherit;border:none;transition:opacity .15s,background .15s}
.btn{background:#9C7A2E;color:#F7F2E7;border-radius:8px;padding:9px 20px;font-weight:700;font-size:14px}
.btn:hover{opacity:.85}
.btn-g{background:transparent;color:#5A5648;border:1px solid #D8CBA8;border-radius:8px;padding:9px 16px;font-size:13px}
.btn-g:hover{background:#F0E9D8}
.btn-sm{background:transparent;color:#5A5648;border:1px solid #D8CBA8;border-radius:7px;padding:4px 11px;font-size:12px}
.btn-sm:hover{background:#F0E9D8}
.card{background:#FFFFFF;border:1px solid #E4DAC0;border-radius:14px}
.lbl{color:#5A5648;font-size:13px;display:block;margin-bottom:4px;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:span 2}
#app{display:flex;height:100vh;overflow:hidden}
html,body{overflow-x:hidden;max-width:100vw}
#mobileMenuBtn{display:none}
#mobileOverlay{display:none}
@media(max-width:860px){
  #mobileMenuBtn{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:14px;left:14px;z-index:300;
    width:42px;height:42px;border-radius:10px;
    background:#FFFFFF;border:1px solid #E4DAC0;box-shadow:0 2px 10px rgba(0,0,0,.12);
    font-size:20px;color:#2E2A20;cursor:pointer;
  }
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:250;
    width:250px!important;padding:22px 10px!important;
    transform:translateX(-100%);transition:transform .25s ease;
    box-shadow:0 0 30px rgba(0,0,0,.25);
  }
  #sidebar.mobile-open{transform:translateX(0)}
  #sidebar.collapsed{width:250px}
  #sidebar.collapsed .brand,#sidebar.collapsed .sidebar-foot,#sidebar.collapsed .nav-label,#sidebar.collapsed .dot,#sidebar.collapsed .badge,#sidebar.collapsed .divider{display:flex!important}
  #sidebar .toggle-btn{display:none}
  #mobileOverlay.show{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:240;
  }
  #main{width:100%;padding:70px 16px 24px!important}
  .card{max-width:100%!important;box-sizing:border-box}
  .grid2{grid-template-columns:1fr!important}
}
@media(max-width:600px){
  div[style*="grid-template-columns:repeat(5,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
  div[style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
  div[style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr!important}
}

/* Sidebar */
#sidebar{width:224px;background:#FFFFFF;border-right:1px solid #E4DAC0;display:flex;flex-direction:column;padding:22px 10px;flex-shrink:0;transition:width .25s ease,padding .25s ease;overflow:hidden}
#sidebar.collapsed{width:52px;padding:12px 8px}
#sidebar.collapsed .brand,#sidebar.collapsed .sidebar-foot,#sidebar.collapsed .nav-label,#sidebar.collapsed .dot,#sidebar.collapsed .badge,#sidebar.collapsed .divider{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px;font-size:17px}
#sidebar.collapsed .toggle-btn{margin:0 auto}
.brand{padding-left:8px;margin-bottom:28px}
.brand h1{font-size:22px;color:#2E2A20;font-weight:700}.brand h1 span{color:#9C7A2E}
.brand p{color:#6B6355;font-size:12px;letter-spacing:.12em;margin-top:3px}
.divider{height:1px;background:#E4DAC0;margin:8px 0}
nav{flex:1}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:10px;border:none;background:transparent;color:#5A5648;font-size:13.5px;font-weight:400;margin-bottom:3px;text-align:left;white-space:nowrap}
.nav-cat-label{padding:14px 14px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9C7A2E;opacity:.75}
.nav-pole-label{padding:18px 14px 4px;margin-top:6px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:#4A4030;border-top:1px solid #D8CBA8}
.nav-pole-label:first-of-type{border-top:none;margin-top:0}
#sidebar.collapsed .nav-pole-label{display:none}
#sidebar.collapsed .nav-cat-label{display:none}
.nav-item:hover{background:#F0E9D8;color:#2E2A20}
.nav-item.active{background:#9C7A2E18;color:#9C7A2E;font-weight:700}
.nav-item .dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:#9C7A2E;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:#9C7A2E30;color:#9C7A2E;border-radius:20px;padding:1px 8px;font-size:13px;font-weight:700;flex-shrink:0}
.sidebar-foot{padding-left:8px;padding-top:12px;color:#6B6355;font-size:12px;line-height:1.7}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #D8CBA8;background:transparent;color:#5A5648;font-size:15px;cursor:pointer;transition:background .15s,color .15s;flex-shrink:0}
.toggle-btn:hover{background:#F0E9D8;color:#9C7A2E}
.toggle-row{display:flex;justify-content:flex-end;margin-bottom:16px}
/* Main */
#main{flex:1;overflow-y:auto;padding:32px 36px}
/* Badges */
.badge-profil{display:inline-block;border-radius:20px;padding:2px 9px;font-size:13px;font-weight:700}
.status-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.cat-badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700}
/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
/* Lists */
.client-row{padding:15px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:background .15s;flex-wrap:wrap}
@media(max-width:600px){.client-row{gap:10px}.client-row>div:last-of-type{flex-direction:row!important;align-items:center!important}}
.client-row:hover{background:#F0E9D8}
/* Subtabs */
.subtabs{display:flex;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid #E4DAC0}
.subtab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:#5A5648;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.active{color:#9C7A2E;font-weight:700;border-bottom-color:#9C7A2E}
/* Stat cards */
.stat-card{padding:18px;display:flex;align-items:center;gap:14px}
.stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.stat-lbl{font-size:13px;color:#5A5648;margin-top:3px}
/* Biblio */
.fiche-body{margin-top:16px;padding:16px 18px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;color:#5A5648;font-size:13.5px;line-height:2;white-space:pre-wrap;display:none}
.fiche-body.open{display:block}
/* Session row */
.sess-row{display:flex;gap:12px;padding:12px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;margin-bottom:8px}
.sess-num{width:26px;height:26px;border-radius:50%;background:#9C7A2E18;color:#9C7A2E;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
/* Obj row */
.obj-row{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#FFFFFF;border-radius:10px;border:1px solid #E4DAC0;margin-bottom:8px}
.obj-check{width:22px;height:22px;border-radius:6px;border:2px solid;background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;cursor:pointer}
/* Progress bar */
.prog-track{height:3px;background:#E4DAC0;border-radius:4px;margin-top:4px}
.prog-bar{height:3px;border-radius:4px}
/* Action buttons on dashboard */
.action-card{padding:18px;cursor:pointer;text-align:center;border-radius:14px;border:1px dashed;transition:background .15s}
/* Quick form */
.qform{padding:24px;margin-bottom:20px;border-radius:14px;border:1px solid #9C7A2E44;background:#FFFFFF}
/* Notes textarea */
#notesArea{flex:1;line-height:1.9;padding:22px;font-size:14px;border-radius:14px;min-height:0}
/* Tooltip */
.copied{color:#4a9e6a!important;border-color:#4a9e6a44!important}
/* Accordion arrow */
.arr{color:#6B6355;font-size:18px;user-select:none}
</style>
</head>
<body>
<button id="mobileMenuBtn" title="Menu">☰</button>
<div id="mobileOverlay"></div>
<div id="app">
  <div id="sidebar">
    <div class="toggle-row">
      <button class="toggle-btn" id="toggleBtn" title="Réduire le panneau">&#8249;</button>
    </div>
    <div class="brand" style="display:flex;align-items:center;gap:10px">
      <img src="img/logo.png" alt="Julien Coaching" style="height:50px;width:auto;flex-shrink:0">
      <div>
        <h1>Coach<span>Studio</span></h1>
        <p>PROFILS ATYPIQUES</p>
      </div>
    </div>
    <div class="divider"></div>
    <nav id="nav"></nav>
    <div class="divider"></div>
    <div class="sidebar-foot" id="sidefoot"></div>
    <div style="padding:10px 18px 16px;display:flex;gap:8px;">
      <button id="btnExport" class="btn-g" style="flex:1;font-size:13px;padding:7px 8px;">⬇ Sauvegarder</button>
      <button id="btnImport" class="btn-g" style="flex:1;font-size:13px;padding:7px 8px;">⬆ Restaurer</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
    </div>
  </div>
  <div id="main"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ══════════════════════════════════════════
//  DONNÉES & CONFIG
// ══════════════════════════════════════════
const PC = {HPI:"#9880d0",HSP:"#d4885a",TDAH:"#5aaec8","HPI+HSP":"#b87898","HPI+TDAH":"#8090c8","HSP+TDAH":"#88a8b0",Mixte:"#4a9e6a"};
const PROFILES = ["HPI","HSP","TDAH","HPI+HSP","HPI+TDAH","HSP+TDAH","Mixte"];
const CAT_COLORS = {"Questions puissantes":"#9C7A2E","NLP":"#9880d0","Sophrologie & somatique":"#5ab8a8","Protocole burnout":"#d07070","Outils pratiques":"#4a9e6a","Communication assertive":"#5aaec8","Régulation émotionnelle":"#d4885a"};

const SAMPLE = [
  {id:"s1",name:"Sophie M.",profile:"HPI+HSP",age:34,objective:"Gestion du burnout et reconnexion à soi",sessions:4,nextSession:"2026-03-18",status:"actif",notes:"Très analytique. Réagit bien aux métaphores.",sessionHistory:["Séance 1 — Accueil, exploration burnout","Séance 2 — Croyances limitantes (NLP)","Séance 3 — Roue de vie","Séance 4 — Plan de reconnexion"],objectifs:[{id:"o1",titre:"Poser des limites avec sa hiérarchie",echeance:"2026-04-01",statut:"en cours"},{id:"o2",titre:"Cohérence cardiaque chaque matin",echeance:"",statut:"atteint"}]},
  {id:"s2",name:"Thomas K.",profile:"TDAH",age:28,objective:"Organisation et gestion du temps",sessions:2,nextSession:"2026-03-20",status:"actif",notes:"Préfère les outils visuels et étapes courtes.",sessionHistory:["Séance 1 — Exploration TDAH","Séance 2 — Système 3 blocs"],objectifs:[{id:"o3",titre:"Appliquer le système 3 blocs 2 semaines",echeance:"2026-04-05",statut:"en cours"}]},
];

const BIBLIO = [
  {id:"q1",cat:"Questions puissantes",phase:"evaluation",profil:"Tous",titre:"Ouverture & exploration",source:"Meta-Coaching — Hall & Duval",
   contenu:`1. Qu'est-ce qui est le plus important pour toi là, maintenant ?
2. Si tu n'avais aucune limite, que ferais-tu ?
3. Qu'est-ce que cette situation te coûte de ne pas changer ?
4. De quoi as-tu besoin pour avancer ?
5. Qu'est-ce qui serait différent si ce problème était résolu ?
6. Qu'est-ce que tu sais déjà, au fond de toi ?
7. Quel serait le premier petit pas possible aujourd'hui ?`},
  {id:"q2",cat:"Questions puissantes",phase:"entrainement",profil:"HPI",titre:"Décélération & ancrage (HPI)",source:"Assenheim — Mon Cerveau est Hyper",
   contenu:`1. Parmi toutes ces idées, laquelle résonne le plus avec qui tu es vraiment ?
2. Si tu devais choisir UNE seule priorité cette semaine, laquelle ?
3. Qu'est-ce que tu ressens dans ton corps quand tu penses à ça ?
4. Tu analyses beaucoup — qu'est-ce que TOI tu veux vraiment ?
5. À quel moment tu t'es senti pleinement toi-même récemment ?`},
  {id:"q3",cat:"Questions puissantes",phase:"entrainement",profil:"HSP",titre:"Validation & besoins (HSP)",source:"Coaching HSP — approche somatique",
   contenu:`1. Qu'est-ce que tu as absorbé des autres aujourd'hui qui n'est pas le tien ?
2. Où dans ton corps ressens-tu ça ?
3. Qu'est-ce dont tu as besoin pour te sentir en sécurité ici ?
4. Si ta sensibilité était un superpouvoir, comment tu l'utiliserais là ?
5. Quelle est la frontière que tu as du mal à maintenir en ce moment ?`},
  {id:"q4",cat:"Questions puissantes",phase:"entrainement",profil:"TDAH",titre:"Focus & momentum (TDAH)",source:"Coaching TDAH — approche forces",
   contenu:`1. Quelle est la SEULE chose que tu ferais si tu ne pouvais en faire qu'une ?
2. Qu'est-ce qui te donne de l'énergie vs ce qui t'en prend ?
3. À quel moment de la journée tu es le plus efficace ?
4. C'est quoi le vrai obstacle : la tâche ou ce qu'elle représente ?
5. Comment rendre ça plus fun, plus rapide, plus stimulant ?`},
  {id:"n1",cat:"NLP",phase:"entrainement",profil:"Tous",titre:"Recadrage de contenu",source:"NLP — Bandler & Grinder",
   contenu:`OBJECTIF : Changer la signification attribuée à un événement.

1. Identifier la croyance limitante : « Qu'est-ce que tu dis sur toi dans cette situation ? »
2. Questionner : « Est-ce TOUJOURS vrai ? Dans 100% des cas ? »
3. Proposer une autre perspective : « Et si ça signifiait autre chose ? »
4. Ancrer la nouvelle signification : « Si c'était une preuve de ta force ? »
5. Test : « Sur 1 à 10, comment tu te sens avec cette nouvelle façon de voir ? »

EXEMPLE : "Je suis trop sensible" → "Je perçois ce que les autres ne voient pas encore"`},
  {id:"n2",cat:"NLP",phase:"entrainement",profil:"HPI",titre:"Ligne du temps — décision (HPI)",source:"NLP — Ligne du temps",
   contenu:`OBJECTIF : Débloquer une décision via la sagesse temporelle.

1. Imaginer une ligne du temps devant soi.
2. Avancer vers le FUTUR : « Imagine que tu as fait ce choix. Comment tu te sens ? »
3. Explorer les conséquences à 1 an, 5 ans, 10 ans.
4. Revenir au présent : « Depuis ce futur, quel conseil tu te donnes ? »
5. Ancrer la ressource : geste ou mot-clé associé à la clarté ressentie.

ADAPTÉ HPI : Le HPI visualise plusieurs futurs simultanément — choisir le plus ALIGNÉ, pas le plus optimal.`},
  {id:"n3",cat:"NLP",phase:"entrainement",profil:"HSP",titre:"Ancrage ressource (HSP)",source:"NLP — Ancrage",
   contenu:`OBJECTIF : Créer une ancre corporelle de sécurité rapidement accessible.

1. Identifier un souvenir de sécurité absolue.
2. Immersion sensorielle : voir, entendre, ressentir dans le corps.
3. Au pic de l'état ressource : poser l'ancre (pression sur le poignet).
4. Répéter 3 fois pour renforcer.
5. Tester : activer l'ancre et vérifier le retour de l'état ressource.

ADAPTÉ HSP : Ancres discrètes (poignet, lobe de l'oreille) utilisables en public.`},
  {id:"n4",cat:"NLP",phase:"entrainement",profil:"TDAH",titre:"Modélisation état de flow (TDAH)",source:"NLP + Csikszentmihalyi — Flow",
   contenu:`OBJECTIF : Reproduire volontairement un état de concentration intense.

1. « Rappelle-toi d'un moment où tu étais totalement absorbé. »
2. Mapping sensoriel : environnement, sensations, énergie.
3. Identifier les déclencheurs : heure, type de tâche, niveau de défi.
4. Créer un rituel d'entrée : musique, posture, durée (pomodoro 25 min).
5. Ancrer et tester.

ADAPTÉ TDAH : Le flow arrive quand la tâche est juste assez difficile — calibrer le défi.`},
  {id:"s1b",cat:"Sophrologie & somatique",phase:"entrainement",profil:"Tous",titre:"Cohérence cardiaque 3-6-5",source:"Dr David O'Hare",
   contenu:`OBJECTIF : Réguler le système nerveux en 5 minutes.
→ 3 fois par jour / 6 respirations par minute / 5 minutes

1. S'installer, colonne droite.
2. Inspiration nasale : 5 secondes.
3. Expiration buccale : 5 secondes.
4. Maintenir 5 minutes.
5. Observer sans juger.

EFFETS : Réduction cortisol, clarté mentale, retour au calme.
CONSEIL : Matin + avant séance + avant de dormir.
ADAPTÉ TDAH : Utiliser une app de guidage visuel (RespiRelax).`},
  {id:"s2b",cat:"Sophrologie & somatique",phase:"entrainement",profil:"HSP",titre:"Protocole de décharge sensorielle",source:"Peter Levine — Somatic Experiencing",
   contenu:`OBJECTIF : Libérer les tensions d'hyperstimulation.
DURÉE : 15-20 minutes

1. SCAN CORPOREL (3 min) : Balayer le corps de la tête aux pieds. Nommer les tensions sans les changer.

2. SECOUSSE CONSCIENTE (5 min) : Pieds écartés, laisser les genoux fléchir et vibrer doucement. Laisser monter progressivement.

3. EXPIRATION SONORE (3 min) : Inspirer profond, expirer avec un son (soupir, "aaah"). Répéter jusqu'au relâchement.

4. ANCRAGE (5 min) : S'allonger. Sentir le poids du corps. Nommer 5 choses vues, 4 entendues, 3 touchées.

SIGNAL : Bâillement spontané, chaleur dans les mains.`},
  {id:"s3b",cat:"Sophrologie & somatique",phase:"entrainement",profil:"HPI",titre:"Scan de désaccélération mentale",source:"Jon Kabat-Zinn — MBSR",
   contenu:`OBJECTIF : Passer de la pensée arborescente à la présence.
DURÉE : 10 minutes

1. OBSERVATION (2 min) : Les pensées comme des nuages. Ne pas les suivre ni les repousser.

2. DESCENTE (3 min) : Attention sur les pieds → chevilles → mollets → bassin → ventre → poitrine → épaules → visage.

3. POINT DE GRAVITÉ (3 min) : Centre dans le bas-ventre. Respirer depuis ce centre.

4. QUESTION D'ANCRAGE (2 min) : « Qu'est-ce qui est vrai, là, maintenant ? » Laisser la réponse venir du corps.

ADAPTÉ HPI : Si les pensées s'emballent, les noter avant de commencer.`},
  {id:"s4b",cat:"Sophrologie & somatique",phase:"entrainement",profil:"TDAH",titre:"Activation physique pré-séance",source:"Dr John Ratey — Spark",
   contenu:`OBJECTIF : Stimuler dopamine et noradrénaline avant un travail cognitif.
DURÉE : 5-10 minutes

1. ACTIVATION (2 min) : Tête de gauche à droite, cercles épaules, marche genoux levés.

2. CROISEMENTS (2 min) : Genou gauche + main droite, alternance rapide. Active les deux hémisphères.

3. RESPIRATION ACTIVANTE (2 min) : Inspiration 3 sec / rétention 1 sec / expiration forte. × 10.

4. INTENTION (1 min) : « Aujourd'hui je vais travailler sur… et je m'autorise à… »

POURQUOI : L'exercice augmente BDNF et dopamine, essentiels pour l'attention TDAH.`},
  {id:"b1b",cat:"Protocole burnout",phase:"evaluation",profil:"Tous",titre:"Évaluation initiale burnout (5 axes)",source:"Christina Maslach + modèle CARE",
   contenu:`5 AXES À ÉVALUER (de 0 à 10) :

① ÉPUISEMENT PHYSIQUE
→ Signes : sommeil non récupérateur, douleurs, infections.

② ÉPUISEMENT ÉMOTIONNEL
→ Signes : émoussement, cynisme, irritabilité.

③ ÉPUISEMENT COGNITIF
→ Signes : brouillard mental, oublis, indécision.

④ PERTE DE SENS
→ Signes : détachement, sentiment d'inutilité.

⑤ ISOLEMENT
→ Signes : repli, évitement social, honte.

INTERPRÉTATION :
≤ 25 = vigilance
25-40 = burnout modéré
> 40 = arrêt recommandé`},
  {id:"b2b",cat:"Protocole burnout",phase:"entrainement",profil:"HPI",titre:"Reconnecter au sens — post-burnout (HPI)",source:"Cathy Assenheim",
   contenu:`PHASE 1 — PERMISSION DE SE REPOSER (séances 1-2)
→ Déconstruire : "je dois produire pour avoir de la valeur"
→ Exercice : liste de 10 choses que tu ES, sans verbe d'action.

PHASE 2 — RÉINVENTAIRE DES FORCES (séances 3-4)
→ Roue de l'énergie : ce qui recharge vs ce qui vide.
→ Question : "Qu'est-ce que tu ferais si tu ne pouvais pas échouer ?"

PHASE 3 — RECONSTRUCTION DU SENS (séances 5-6)
→ Valeurs non négociables.
→ Contrat avec soi-même : 3 engagements.
→ Rituels de ressourcement quotidien.

VIGILANCE : Le HPI peut intellectualiser le burnout sans en vivre la guérison. Ancrer dans le corps.`},
  {id:"b3b",cat:"Protocole burnout",phase:"entrainement",profil:"HSP",titre:"Récupération sensorielle (HSP)",source:"Elaine Aron + Somatic Experiencing",
   contenu:`SEMAINE 1-2 : DÉCONNEXION
→ Réduire stimuli, rituels de silence (10 min entre activités)
→ Journal des "voleurs d'énergie"

SEMAINE 3-4 : RESTAURATION
→ Nature, créativité, beauté
→ Cohérence cardiaque + marche 20 min/jour
→ Budget d'énergie : 10 jetons/jour

SEMAINE 5-6 : RECALIBRATION
→ Besoins fondamentaux non satisfaits
→ Zones tampon entre stimulations
→ Script de communication des besoins

QUESTION CLÉ : "Qu'est-ce que tu n'as pas le droit de ressentir selon toi ?"`},
  {id:"b4b",cat:"Protocole burnout",phase:"entrainement",profil:"TDAH",titre:"Reconstruire un système soutenable post-burnout (TDAH)",source:"Parcours Reconversion après burn-out",
   contenu:`SEMAINE 1-2 : OBSERVER SANS CORRIGER
→ Cartographier une journée type sans jugement, repérer les voleurs de temps réels (oublis, recommencements).
→ Le pic d'énergie du jour : identifier le moment où la concentration est naturellement disponible.

SEMAINE 3-4 : UN SYSTÈME EXTERNE SIMPLE
→ Un seul support visible (pas de dispersion), échéances affichées physiquement.
→ Time-boxing en blocs courts (15-25 min) + un blanc protégé par jour, non négociable.

SEMAINE 5 : TENIR LA CHARGE SANS S'EFFONDRER
→ 3 catégories de priorité maximum (urgent / important / reportable).
→ Une phrase de refus prête à l'avance, réutilisable telle quelle.
→ Version « minimum » du planning prévue pour les jours sans énergie.

REPÈRE COACH : un système qui ne prévoit pas les jours sans énergie n'est pas un vrai système — la flexibilité planifiée fait partie de la structure.`},
  {id:"pr1",cat:"Parcours 5 semaines (reconversion)",phase:"entrainement",profil:"Tous",titre:"Organisation / gestion du temps",source:"Parcours Reconversion après burn-out",
   contenu:`S1 — Observer avant de changer : cartographier une journée type, repérer les voleurs de temps, sans encore rien corriger.
S2 — Construire un système externe : un support unique, simple, testé 2 semaines avant tout ajout.
S3 — Découper et cadencer : time-boxing, règle des 2 minutes, un blanc protégé chaque jour.
S4 — Tenir la charge dans la durée : prioriser en 3 catégories, anticiper l'imprévu, savoir dire non.
S5 — Ancrer et transmettre : formaliser le système sur une seule page, le partager, prévoir la version « semaine chargée ».

REPÈRE COACH : chaque semaine se termine par un bilan factuel, jamais un jugement de discipline.`},
  {id:"pr2",cat:"Parcours 5 semaines (reconversion)",phase:"entrainement",profil:"HSP",titre:"Régulation émotionnelle",source:"Parcours Reconversion après burn-out",
   contenu:`S1 — Observer les vagues : journal d'intensité émotionnelle (1-10), 3 fois/jour, sans intervenir.
S2 — Nommer et ralentir : verbaliser l'émotion à voix haute, pause de 90 secondes avant de réagir.
S3 — Repérer les signaux : signal corporel annonciateur (mâchoire, respiration), seuil de bascule.
S4 — Construire des espaces de régulation : lieu de retrait, personne ressource, objet apaisant — testés à l'avance.
S5 — Consolider un rythme stable : une semaine sans journal pour vérifier que les réflexes tiennent seuls.

EXERCICE COACH (S1) : relecture commentée du journal des vagues en séance (20 min) — questions ouvertes uniquement, sans interpréter à la place du client.`},
  {id:"pr3",cat:"Parcours 5 semaines (reconversion)",phase:"entrainement",profil:"Tous",titre:"Relations sociales / professionnelles",source:"Parcours Reconversion après burn-out",
   contenu:`S1 — Cartographier les interactions : lesquelles coûtent, lesquelles ressourcent, sans jugement.
S2 — Clarifier plutôt que deviner : poser la question directe au lieu de supposer une attente implicite.
S3 — Préparer les échanges à enjeu : 3 points clés écrits à l'avance, scénario de réaction difficile anticipé.
S4 — Poser des limites : décliner sans justification excessive, limiter la durée d'une interaction.
S5 — Construire un réseau soutenant durable : identifier le noyau de 3-5 personnes vraiment soutenantes.

REPÈRE COACH : la culpabilité après un refus posé est normale et attendue — ne signifie pas que la limite était injustifiée.`},
  {id:"pr4",cat:"Parcours 5 semaines (reconversion)",phase:"entrainement",profil:"HPI",titre:"Confiance en soi / estime de soi",source:"Parcours Reconversion après burn-out",
   contenu:`S1 — Collecter les faits : 3 réussites notées chaque soir, réussites passées oubliées, retours de tiers.
S2 — Distinguer fait et jugement : reformuler un échec en fait neutre, repérer les mots absolus (toujours/jamais).
S3 — Solliciter et intégrer les retours : demander un avis ciblé, accueillir un compliment sans le minimiser.
S4 — Retravailler le discours intérieur : identifier la voix critique d'origine, préparer une réponse ferme et bienveillante.
S5 — Ancrer une image de soi stable : une semaine sans relevé pour vérifier la stabilité acquise.

REPÈRE COACH : le but n'est pas la pensée positive mais une base factuelle solide face à une mémoire biaisée vers l'échec.`},
  {id:"o1b",cat:"Outils pratiques",phase:"evaluation",profil:"Tous",titre:"Roue de vie — version atypiques",source:"Adapté Wheel of Life",
   contenu:`8 DOMAINES (de 0 à 10) :

① ÉNERGIE & CORPS — Je prends soin de mon corps ?
② MENTAL & CLARTÉ — Mon esprit est clair et apaisé ?
③ ÉMOTIONS — Je reconnais et exprime mes émotions ?
④ RELATIONS — Mes relations me nourrissent ?
⑤ TRAVAIL & SENS — Mon travail a du sens ?
⑥ CRÉATIVITÉ — J'explore, je crée, j'apprends ?
⑦ LIMITES — Je sais dire non ?
⑧ PLAISIR — Je ris, je joue, je savoure ?

UTILISATION :
1. Client note chaque domaine (5 min)
2. Domaine le plus bas : "Que se passerait-il si ça montait de 1 ?"
3. Domaine le plus haut : "Comment cette force peut-elle aider les autres ?"
4. 1 action concrète pour la semaine.`},
  {id:"o2b",cat:"Outils pratiques",phase:"entrainement",profil:"HPI",titre:"Journal de décélération (HPI)",source:"Journaling adapté HPI",
   contenu:`FORMAT QUOTIDIEN — 10 minutes le soir

① CE QUI S'EST PASSÉ (2 min) — Faits bruts, sans analyse.

② CE QUE J'AI RESSENTI (3 min) — Émotions, sensations corporelles.

③ CE QUE J'AI APPRIS (2 min) — 1 seule chose. Pas une liste.

④ BESOIN DE DEMAIN (1 min) — 1 besoin, 1 action.

⑤ GRATITUDE (2 min) — 1 chose concrète, ressentie dans le corps.

RÈGLE DU JEU : Interdiction d'analyser. Juste décrire et ressentir.`},
  {id:"o3b",cat:"Outils pratiques",phase:"entrainement",profil:"TDAH",titre:"Système des 3 blocs (TDAH)",source:"Dr Ned Hallowell + Russell Barkley",
   contenu:`MATIN — BLOC COGNITIF (pic dopamine)
→ Tâches de concentration max
→ 90 min max, pauses de 10 min
→ UNE tâche à la fois, téléphone en mode avion

APRÈS-MIDI — BLOC CRÉATIF & RELATIONNEL
→ Réunions, appels, créativité
→ Blocs de 45 min

FIN DE JOURNÉE — BLOC ADMINISTRATIF
→ Emails, rangement, planification du lendemain
→ 30-45 min max

RITUELS DE TRANSITION :
→ 10 min de marche entre chaque bloc
→ Début : "Mon intention pour ce bloc est…"
→ Fin : noter ce qui reste (vider la RAM)`},
  {id:"o4b",cat:"Outils pratiques",phase:"evaluation",profil:"HSP",titre:"Carte des déclencheurs sensoriels",source:"Elaine Aron — The Highly Sensitive Person",
   contenu:`À REMPLIR AVEC LE CLIENT :

DÉCLENCHEURS SONORES
→ Ce qui épuise : _____ Ce qui ressource : _____

→ En 5 min : _____ En 30 min : _____ En 1 soirée : _____`},
  {id:"o5b",cat:"Outils pratiques",phase:"maintien",profil:"Tous",titre:"Bilan de séance structuré",source:"Meta-Coaching + supervision",
   contenu:`À REMPLIR EN FIN DE SÉANCE (10 min)

  {id:"c1b",cat:"Communication assertive",phase:"entrainement",profil:"Tous",titre:"Script DESC — Poser ses limites",source:"Sharon Bower — DESC + CNV",
   contenu:`MÉTHODE DESC

D — DÉCRIRE les faits (sans jugement)
→ "Quand… [fait précis]"

E — EXPRIMER mon ressenti (en "je")
→ "Je ressens…"

S — SPÉCIFIER ma demande (concrète)
→ "Ce dont j'ai besoin c'est…"

C — CONSÉQUENCES (positives)
→ "Ainsi…"

EXEMPLE COMPLET :
"Quand tu m'envoies des messages après 22h, je me sens envahie. J'ai besoin qu'on évite ça sauf urgence. Ainsi je serai plus disponible le jour."

ADAPTÉ HSP : Préparer le script à l'écrit avant de le dire.
ADAPTÉ HPI : Éviter de sur-justifier. Rester simple et direct.`},
  {id:"c2b",cat:"Communication assertive",phase:"entrainement",profil:"HSP",titre:"Décentrage émotionnel (HSP)",source:"Judith Orloff — The Empath's Survival Guide",
   contenu:`OBJECTIF : Ne pas absorber les émotions de l'autre.

AVANT :
1. Visualiser une bulle protectrice autour de soi.
2. "Je peux être présent(e) sans porter leur charge."
3. Ancrage : sentir ses pieds au sol.

PENDANT :
1. Observer l'émotion de l'autre sans la laisser entrer.
2. "Je comprends que c'est difficile pour toi."
3. Rester conscient(e) de son propre état.

APRÈS :
1. Se laver les mains en imaginant lâcher ce qui n'est pas sien.
2. Scanner le corps : qu'est-ce qui reste ? À qui ça appartient ?
3. Expiration longue + secouer les mains.`},
  {id:"e1b",cat:"Régulation émotionnelle",phase:"entrainement",profil:"Tous",titre:"Protocole STOP (urgence émotionnelle)",source:"Jon Kabat-Zinn — MBSR",
   contenu:`S — STOP
→ Stopper. Mains à plat sur les cuisses.

T — TAKE A BREATH
→ Inspiration 5 sec, expiration 7 sec.

O — OBSERVER
→ "Qu'est-ce qui se passe en moi ?"
→ Nommer l'émotion. La localiser dans le corps.

P — PROCEED
→ Choisir consciemment comment répondre.
→ "Quelle est la réponse la plus utile pour moi ?"

DURÉE : 60-90 secondes.
EFFET : Activation cortex préfrontal, réduction amygdale.`},
  {id:"e2b",cat:"Régulation émotionnelle",phase:"entrainement",profil:"HPI+HSP",titre:"Journal des émotions complexes",source:"Susan David — Emotional Agility",
   contenu:`FORMAT HEBDOMADAIRE

LUNDI — INVENTAIRE
→ Quelles émotions cette semaine ?
→ Lesquelles ont été les plus intenses ?

MERCREDI — EXPLORATION
→ Émotion la plus difficile :
   • Qu'est-ce qu'elle dit de mes besoins ?
   • D'où vient-elle ?

VENDREDI — INTÉGRATION
→ Comment j'ai géré ?
→ Quelle est la sagesse de cette émotion ?
→ "Chère [émotion], merci de m'avoir dit que…"

DIMANCHE — RESSOURCE
→ Quelle émotion positive cette semaine ?
→ Comment en cultiver plus ?`},
  {id:"p90-1",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S01 — La citadelle intérieure",source:"Masterclass 90 Jours — Stoïcisme (Épictète)",
   contenu:`« Ce qui trouble les hommes, ce ne sont pas les choses, mais les jugements qu'ils portent sur les choses. » — Épictète

Dichotomie du contrôle : séparer ce qui dépend de soi (actes, pensées) de ce qui n'en dépend pas.
La citadelle intérieure : créer une bulle mentale pour protéger sa concentration et son calme.
Amor Fati : transformer chaque imprévu en opportunité d'apprentissage.

Planning quotidien :
• Lundi — Désencombrement mental : Lister les irritants du jour et barrer ceux qui ne dépendent pas de vous.
• Mardi — Ancrage visuel : Placer un rappel 'Contrôlable / Incontrôlable' sur votre poste de travail.
• Mercredi — Focus unique : Traiter 1 seule tâche prioritaire le matin en immersion totale sans distraction.
• Jeudi — Mode stoïcien : Face à un retard ou couac, respirer 3 fois et appliquer une solution purement logique.
• Vendredi — Clôture sereine : Traiter et classer vos urgences pour clôturer la semaine sans charge mentale restante.
• Week-end — Recharge sensorielle : Coupure des notifications et reconnexion au calme en plein air.
Ancrage quotidien : 5 min de cohérence cardiaque au réveil + question « Est-ce sous mon contrôle direct ? »`},
  {id:"p90-2",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S02 — L'ancrage dans l'ici et maintenant",source:"Masterclass 90 Jours — Pleine conscience (Eckhart Tolle)",
   contenu:`« Rien ne s'est jamais produit dans le passé, rien ne se produira dans le futur : tout se produit dans le Présent. » — E. Tolle

Rupture de la rumination : empêcher le cerveau de voyager entre regrets et scénarios futurs.
L'Observateur Silencieux : observer ses pensées sans les juger.
Extinction du feu mental : revenir répétitivement à l'instant présent.

Planning quotidien :
• Lundi — Ancrage des 5 sens : Prendre votre premier café/thé du matin en observant 3 détails visuels et 2 odeurs sans écran.
• Mardi — Repas mono-tâche : Manger votre déjeuner sans téléphone, ni vidéo, ni lecture.
• Mercredi — Marche consciente : Effectuer 10 minutes de marche en vous concentrant uniquement sur le contact des pieds.
• Jeudi — Pause d'extinction : Faire 3 micro-pauses de 2 minutes dans la journée pour observer simplement votre respiration.
• Vendredi — Transition pro/perso : Prendre 5 minutes de silence absolu avant de basculer dans votre soirée.
• Week-end — Immersion manuelle : Bricolage, jardinage, sport ou activité manuelle avec une présence totale.
Ancrage quotidien : 10 min de silence au réveil + règle des 3 respirations avant toute nouvelle tâche.`},
  {id:"p90-3",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S03 — Le dépouillement du superflu",source:"Masterclass 90 Jours — Cynisme & minimalisme (Diogène)",
   contenu:`« Je possède tout car je ne désire rien. » — Diogène de Sinope

Dépouillement stratégique : réduire les choix quotidiens pour préserver l'énergie décisionnelle.
Indépendance sociale : se détacher du besoin de validation extérieure.
Sobriété choisie : redécouvrir la clarté de l'essentiel.

Planning quotidien :
• Lundi — Trieur numérique : Supprimer 5 applications inutiles et désactiver toutes les notifications secondaires.
• Mardi — Épure du bureau : Ne laisser sur votre plan de travail physique et digital que le dossier en cours.
• Mercredi — Journée sans dépense/distraction : Limiter la consultation des réseaux à 1 seul créneau de 15 min.
• Jeudi — To-Do List minimaliste : Réduire la liste de travail de la journée à 3 priorités absolues.
• Vendredi — Refus constructif : Dire non de façon courtoise mais ferme à une sollicitation non essentielle.
• Week-end — Tri physique : Épurer, donner ou jeter 5 objets inutiles qui encombrent votre espace de vie.
Ancrage quotidien : règle de soustraction avant tout nouvel engagement.`},
  {id:"p90-4",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S04 — L'art du lâcher-prise",source:"Masterclass 90 Jours — Stoïcisme moderne",
   contenu:`« Vous n'avez pas le contrôle sur ce qui vous arrive, mais vous avez le contrôle absolu sur la façon d'y réagir. »

Sélection des combats : économiser son attention pour l'impact réel.
Équation de la souffrance = Souci × Résistance.
Tolérance à l'inconfort : accepter le doute sans distraction réflexe.

Planning quotidien :
• Lundi — Tri des batailles : Lister 3 sujets qui vous préoccupent et décider consciemment d'en lâcher un.
• Mardi — Règle des 80/20 : Livrer une tâche dès qu'elle est efficace à 80% sans chercher la perfection ultime.
• Mercredi — Mantra de secours : Répéter 'C'est un détail, pas une urgence' face aux petits imprévus.
• Jeudi — Délégation / Simplification : Identifier 1 processus répétitif à simplifier ou automatiser.
• Vendredi — Clôture sereine : Écrire votre liste du lundi soir pour libérer complètement votre cerveau du week-end.
• Week-end — Déconnexion totale : Une journée 100% libre de tout objectif de performance.
Ancrage quotidien : technique du « Et alors ? » face au pire scénario réaliste.`},
  {id:"p90-5",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S05 — La conversion des passions en joie",source:"Masterclass 90 Jours — Spinoza",
   contenu:`« La joie est le passage de l'homme d'une moindre à une plus grande perfection. » — Spinoza

Le Conatus : l'énergie vitale qui pousse à se développer.
Joie Active vs Passion Subie : comprendre la cause de ses émotions.
Augmentation de la puissance : privilégier ce qui redonne de l'énergie.

Planning quotidien :
• Lundi — Analyse d'énergie : Identifier les 2 activités qui vous apportent le plus d'enthousiasme.
• Mardi — Action motrice : Bloquer un créneau d'hyperfocus sur un projet stimulant au début de journée.
• Mercredi — Analyse des blocages : Remplacer une frustration par la question : 'Quelle action concrète résout cela ?'
• Jeudi — Micro-succès : Noter et célébrer 3 petites victoires accomplies aujourd'hui.
• Vendredi — Partage positif : Exprimer un compliment sincère ou une gratitude à un collaborateur ou proche.
• Week-end — Projet passion : Consacrer 2h à un projet personnel stimulant sans contrainte de résultat.
Ancrage quotidien : journal de Spinoza — 3 moments de fierté/élan chaque soir.`},
  {id:"p90-6",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S06 — La sobriété heureuse & les plaisirs simples",source:"Masterclass 90 Jours — Épicurisme",
   contenu:`« Ne gâte pas ce que tu as par le désir de ce que tu n'as pas. » — Épicure

Tri des désirs : nécessaire vs superflu anxieux.
Ataraxie : tranquillité par la réduction des besoins artificiels.
Plaisir d'être : savourer l'existant.

Planning quotidien :
• Lundi — Audit des impulsions : Vérifier si un nouveau projet/achat répond à un besoin réel ou à une impulsion.
• Mardi — Pause café/thé sensorielle : Savourer une boisson en observant avec attention sa chaleur et ses arômes.
• Mercredi — Déjeuner déconnecté : Manger dans le calme et échanger de façon authentique sans écran.
• Jeudi — Marche de décompression : Faire un tour de 15 minutes en plein air sans téléphone.
• Vendredi — Valorisation des acquis : Lister 5 outils ou réussites actuelles dont vous êtes pleinement satisfait.
• Week-end — Cuisine & Convivialité : Préparer un repas simple et savoureux à partager avec vos proches.
Ancrage quotidien : « un truc à la fois » — interdire le multitâche pendant un plaisir simple.`},
  {id:"p90-7",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S07 — L'élan créateur & le mouvement",source:"Masterclass 90 Jours — Bergson",
   contenu:`« Exister consiste à changer, changer à se mûrir, se mûrir à se créer soi-même. » — Henri Bergson

L'Élan créateur : la force de vie dans la création et le renouvellement.
Sortir du temps mécanique : vivre en état de Flow.
L'intuition agissante : faire confiance aux flashs de compréhension.

Planning quotidien :
• Lundi — Casser la routine : Changer la disposition de votre bureau ou faire varier votre itinéraire habituel.
• Mardi — Brainstorming visuel : Poser toutes vos idées sur une carte mentale (MindMap) ou un tableau blanc.
• Mercredi — Action rapide : Tester une idée créative immédiatement sur un prototype ou un brouillon.
• Jeudi — Mouvement corporel : Pratiquer une séance de sport ou une marche active pour réactiver le mental.
• Vendredi — Veille inspirante : Explorer un sujet totalement nouveau hors de votre domaine habituel.
• Week-end — Création libre : Construire, concevoir, rédiger ou développer quelque chose de personnel.
Ancrage quotidien : session Flow de 25 min sans interruption ni correction.`},
  {id:"p90-8",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S08 — La révolte solidaire & l'action",source:"Masterclass 90 Jours — Camus",
   contenu:`« Je me révolte, donc nous sommes. » — Albert Camus

L'Action vs le Cynisme : donner un sens par des actes engagés.
La Révolte noble : dire non à l'injuste pour proposer une solution.
La Solidarité : mettre ses compétences au service du collectif.

Planning quotidien :
• Lundi — Clarification du Sens : Identifier le 'Pourquoi' fondamental de votre projet ou mission.
• Mardi — Correction d'inefficacité : Résoudre un dysfonctionnement récurrent qui freine l'équipe ou le quotidien.
• Mercredi — Entraide spontanée : Offrir 15 minutes d'aide ou de conseil avisé à un collègue ou un proche.
• Jeudi — Prise de position : Exprimer une idée forte avec calme et clarté lors d'un échange.
• Vendredi — Alignement éthique : Vérifier que vos projets de la semaine respectent vos valeurs profondes.
• Week-end — Bilan de mi-parcours : Évaluer le chemin parcouru sur ces 8 premières semaines.
Ancrage quotidien : remplacer chaque critique par « Voici comment on peut l'améliorer ».`},
  {id:"p90-9",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S09 — L'action sans effort (Wu Wei)",source:"Masterclass 90 Jours — Taoïsme (Lao Tseu)",
   contenu:`« Le sage agit sans rien faire et enseigne sans rien dire. » — Lao Tseu

Wu Wei (Non-Forçage) : suivre le courant plutôt que lutter.
La souplesse de l'eau : l'adaptabilité l'emporte sur la rigidité.
Alternance Yin/Yang : équilibrer action intense et repos.

Planning quotidien :
• Lundi — Lecture du flux : Identifier les tâches où vous avez du vent dans les voiles et pousser celles-ci.
• Mardi — Économie de gestes : Découvrir la méthode la plus directe et simple pour accomplir votre objectif.
• Mercredi — Écoute non-réactive : Laisser parler vos interlocuteurs sans anticiper mentalement vos réponses.
• Jeudi — Lâcher la rigidité : Si un obstacle bloque un projet, pivoter temporairement vers une autre tâche.
• Vendredi — Ralentissement mesuré : Effectuer vos tâches avec calme, régularité et précision sans courir.
• Week-end — Reconnexion nature : Passer du temps au bord de l'eau ou en forêt sans montre ni timing.
Ancrage quotidien : pause de fluidité — 5 min de respiration neutre dès qu'une résistance bloque.`},
  {id:"p90-10",cat:"Programme 90 jours",phase:"maintien",profil:"Tous",titre:"S10 — La boussole du sens & l'Ikigai",source:"Masterclass 90 Jours — Sagesse japonaise",
   contenu:`« Seul celui qui a un but peut trouver une joie constante dans son activité quotidienne. »

L'Ikigai : intersection entre Passion, Mission, Vocation et Compétences.
Le Kodawari : l'exigence et la fierté du travail bien fait.
Artisan de sa vie : façonner son quotidien comme une œuvre alignée.

Planning quotidien :
• Lundi — Analyse Passion : Lister les 3 domaines qui vous passionnent le plus en ce moment.
• Mardi — Analyse Talent : Identifier vos forces uniques (vitesse d'apprentissage, logique, créativité).
• Mercredi — Analyse Utilité : Définir comment vos compétences apportent une valeur directe aux autres.

function exportBackup() {
  const payload = {
    version: "cs4",
    exportedAt: new Date().toISOString(),
    clients: state.clients,
    ressources: state.ressources,
    notes: state.notes,
    appointments: state.appointments
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `coachingstudio-sauvegarde-${d}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert("Fichier invalide : impossible de lire ce JSON.");
      return;
    }
    if (!data.clients || !Array.isArray(data.clients)) {
      alert("Fichier invalide : format de sauvegarde non reconnu.");
      return;
    }
    if (!confirm(`Restaurer cette sauvegarde va REMPLACER les données actuelles (${state.clients.length} client(s) actuel(s) → ${data.clients.length} client(s) dans la sauvegarde). Continuer ?`)) return;
    state.clients = data.clients;
    state.ressources = data.ressources || [];
    state.notes = data.notes || "";
    state.appointments = data.appointments || [];
    save();
    setState({tab:"dashboard", selClientId:null});
    alert("Sauvegarde restaurée avec succès.");
  };
  reader.readAsText(file);
}

document.addEventListener("DOMContentLoaded", () => {
  const btnExport = document.getElementById("btnExport");
  const btnImport = document.getElementById("btnImport");
  const fileImport = document.getElementById("fileImport");
  if (btnExport) btnExport.addEventListener("click", exportBackup);
  if (btnImport) btnImport.addEventListener("click", () => fileImport.click());
  if (fileImport) fileImport.addEventListener("change", (e) => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    fileImport.value = "";
  });
});

const CoachLink = {
  user: null,
  linkedFamilies: JSON.parse(localStorage.getItem("cs4-linkedFamilies") || "[]"),
  familyData: {},
  unsubs: {},

  init() {
    firebase.auth().onAuthStateChanged(u => {
      this.user = u;
      if (u) this.linkedFamilies.forEach(code => this.listen(code));
      if (u && !CoachSettings.data) CoachSettings.listen();
      if (["clairiere","rdv","reglages"].includes(state.tab)) render();
    });
  },

  login(email, password) {
    return firebase.auth().signInWithEmailAndPassword(email, password)
      .catch(e => { notifCoach(traduireErreurAuth(e.code)); throw e; });
  },

  logout() { firebase.auth().signOut(); },

  claimShareCode(shareCode, cb) {
    const code = (shareCode || "").trim().toUpperCase();
    if (!code) return;
    const db = firebase.firestore();
    db.collection("coachLinks").doc(code).get().then(snap => {
      if (!snap.exists) { notifCoach("Code invalide ou déjà utilisé."); return; }
      const familyCode = snap.data().familyCode;
      const famRef = db.collection("familles").doc(familyCode);
      const coachEntry = { uid: this.user.uid, email: this.user.email, addedAt: new Date().toISOString() };
      famRef.update({
        authorizedCoaches: firebase.firestore.FieldValue.arrayUnion(coachEntry),
        authorizedCoachUids: firebase.firestore.FieldValue.arrayUnion(this.user.uid)
      }).then(() => {
        db.collection("coachLinks").doc(code).delete().catch(()=>{});
        if (!this.linkedFamilies.includes(familyCode)) {
          this.linkedFamilies.push(familyCode);
          localStorage.setItem("cs4-linkedFamilies", JSON.stringify(this.linkedFamilies));
        }
        this.listen(familyCode);
        notifCoach("✅ Famille liée avec succès.");
        cb && cb();
      }).catch(e => notifCoach("Erreur : " + e.message));
    }).catch(e => notifCoach("Erreur : " + e.message));
  },

  listen(familyCode) {
    if (this.unsubs[familyCode]) return;
    const ref = firebase.firestore().collection("familles").doc(familyCode);
    this.unsubs[familyCode] = ref.onSnapshot(snap => {
      if (snap.exists) this.familyData[familyCode] = snap.data();
      if (state.tab === "clairiere") render();
    }, e => console.error("listen family:", e));
  },

  unlink(familyCode) {
    if (this.unsubs[familyCode]) { this.unsubs[familyCode](); delete this.unsubs[familyCode]; }
    this.linkedFamilies = this.linkedFamilies.filter(c => c !== familyCode);
    localStorage.setItem("cs4-linkedFamilies", JSON.stringify(this.linkedFamilies));
    delete this.familyData[familyCode];
    render();
  }
};

function computeMemberInsights(data, pid) {
  const journee = data.journee || {};
  const entries = Object.keys(journee)
    .filter(k => journee[k] && journee[k].pid === pid)
    .map(k => journee[k])
    .filter(e => e.date)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(-14);

  const routinesBySlot = (data.personRoutines && data.personRoutines[pid]) || {};
  const tasksDone = data.tasksDone || {};
  const incomplete = [];
  Object.keys(routinesBySlot).forEach(slot => {
    (routinesBySlot[slot] || []).forEach(r => {
      if (r.steps && r.steps.length) {
        r.steps.forEach(s => {
          const k = pid + '_' + slot + '_' + r.id + '_' + s.id;
          if (!tasksDone[k]) incomplete.push({slot, label: r.name + ' — ' + s.name});
        });
      } else {
        const k = pid + '_' + slot + '_' + r.id;
        if (!tasksDone[k]) incomplete.push({slot, label: r.name});
      }
    });
  });

  return { entries, incomplete };
}

function svgEnergyCurve(entries) {
  if (!entries.length) return h("div",{style:"font-size:13px;color:#6B6355;padding:6px 0"},"Pas encore de données d'énergie enregistrées.");
  const w = 240, hgt = 46, pad = 4;
  const step = entries.length > 1 ? (w - pad*2) / (entries.length - 1) : 0;
  const pts = entries.map((e,i) => {
    const val = typeof e.energie === 'number' ? e.energie : 0;
    const x = pad + i*step;
    const y = hgt - pad - (val/10)*(hgt - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", w); svg.setAttribute("height", hgt); svg.setAttribute("viewBox", `0 0 ${w} ${hgt}`);
  const poly = document.createElementNS(svgNS, "polyline");
  poly.setAttribute("points", pts);
  poly.setAttribute("fill","none"); poly.setAttribute("stroke","#4a9e6a"); poly.setAttribute("stroke-width","2");
  svg.appendChild(poly);
  return svg;
}

  const { entries, incomplete } = computeMemberInsights(data, m.id);

  box.appendChild(h("div",{style:"font-size:12.5px;color:#5A5648;margin-bottom:4px"},"Énergie (14 derniers jours, /10)"));
  box.appendChild(svgEnergyCurve(entries));

  if (entries.length) {
    const moodRow = h("div",{style:"display:flex;gap:4px;margin-top:6px;flex-wrap:wrap"});
    entries.forEach(e => {
      moodRow.appendChild(h("span",{style:"font-size:14px",title:e.date+" — "+(e.humeur||'')}, MOOD_EMOJI[e.humeur] || '·'));

    box.appendChild(moodRow);

  if (incomplete.length) {

    list.appendChild(h("div",{style:"font-weight:600;margin-bottom:3px"}, "⚠️ Non complété actuellement (" + incomplete.length + ")"));
    incomplete.slice(0,5).forEach(item => {

  return box;
}

function envoyerProgramme(familyCode, memberId, templateId, prenom) {
  const t = ROUTINE_TEMPLATES.find(x => x.id === templateId);
  if (!t) return;
  const routineObj = {
    id: 'r_' + Date.now(),
    name: t.name,
    jours: JOURS_ABBR_ALL.slice(),
    steps: t.steps.map((s,i) => ({ id: 's_' + (Date.now()+i), name: s }))
  };
  const path = `personRoutines.${memberId}.${t.slot}`;
  firebase.firestore().collection("familles").doc(familyCode).update({
    [path]: firebase.firestore.FieldValue.arrayUnion(routineObj)
  }).then(() => {
    notifCoach("✅ Programme envoyé à " + (prenom||"la famille"));
  }).catch(e => notifCoach("Erreur : " + e.message));

        } else {
          plages = DEFAULT_SETTINGS.horaires[j].plages.map(p => ({...p}));

        mergedHoraires[j] = { plages };
      });
      this.data = {
        ...DEFAULT_SETTINGS,
        ...raw,
        horaires: mergedHoraires,
        dureeRdv: raw.dureeRdv || DEFAULT_SETTINGS.dureeRdv,

  save(patch) {

};

const RdvRequests = {
  items: [],
  unsub: null,
  autoTraites: new Set(),
  autoSupprimees: new Set(),
  listen() {
    if (this.unsub || !CoachLink.user) return;
    this.unsub = firebase.firestore().collection("rdvRequests")
      .orderBy("createdAt", "desc")
      .onSnapshot(snap => {
        this.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this.autoConfirmerClientsExistants();
        this.nettoyerAnciennesDemandes();
        if (state.tab === "rdv" || state.tab === "agenda") render();
      }, e => console.error("listen rdvRequests:", e));
  },
  autoConfirmerClientsExistants() {
    this.items
      .filter(r => r.status === "nouveau" && !this.autoTraites.has(r.id))
      .forEach(r => {
        const client = trouverClientExistant(r);
        if (client) {
          this.autoTraites.add(r.id);
          if (r.motif === "Séance Découverte (gratuite)") {
            // La séance découverte gratuite est réservée aux nouveaux clients.
            this.setStatus(r.id, "rejete");
            notifCoach("⛔ Séance découverte refusée automatiquement : " + client.name + " est déjà client (offre réservée aux nouveaux).");
          } else {
            this.setStatus(r.id, "confirme");
            notifCoach("✅ RDV auto-confirmé (client existant) : " + client.name);
          }
        }
      });
  },
  nettoyerAnciennesDemandes() {
    const db = firebase.firestore();
    const seuil = Date.now() - 3 * 24 * 60 * 60 * 1000; // 3 jours
    this.items
      .filter(r => r.status !== "nouveau" && r.createdAt && new Date(r.createdAt).getTime() < seuil && !this.autoSupprimees.has(r.id))
      .forEach(r => {
        this.autoSupprimees.add(r.id);
        db.collection("rdvRequests").doc(r.id).delete()
          .catch(e => console.error("nettoyage rdvRequests:", e));
      });
  },
  setStatus(id, status, callback) {
    const db = firebase.firestore();
    const req = this.items.find(r => r.id === id);
    db.collection("rdvRequests").doc(id).update({ status })
      .then(() => {
        if (status === "confirme" && req) {
          if (req.date && req.heure) {
            const slotId = req.date + "_" + req.heure;
            db.collection("bookedSlots").doc(slotId).set({ date: req.date, heure: req.heure })
              .catch(e => console.error("bookedSlots:", e));
          }
          creerOuMajClientDepuisRdv(req);
        } else if (status === "rejete" && req && req.date && req.heure) {
          // Le créneau avait été réservé automatiquement à l'envoi : on le libère.
          const slotId = req.date + "_" + req.heure;
          db.collection("bookedSlots").doc(slotId).delete()
            .catch(e => console.error("bookedSlots (liberation):", e));
        }
        if (callback) callback(null);
      })
      .catch(e => {
        notifCoach("Erreur : " + e.message);
        if (callback) callback(e);
      });
  },
  annuler(id, callback) {
    const db = firebase.firestore();
    const req = this.items.find(r => r.id === id);
    db.collection("rdvRequests").doc(id).update({ status: "annule" })
      .then(() => {
        if (req && req.date && req.heure) {
          const slotId = req.date + "_" + req.heure;
          db.collection("bookedSlots").doc(slotId).delete()
            .catch(e => console.error("bookedSlots (annulation):", e));
          state.appointments = state.appointments.filter(a =>
            !(a.source === "site" && a.date === req.date && a.heure === req.heure));
          save();
        }
        notifCoach("Rendez-vous annulé, créneau libéré.");
        if (callback) callback(null);
        render();
      })
      .catch(e => {
        notifCoach("Erreur : " + e.message);
        if (callback) callback(e);
      });
  }
};

const FORFAIT_SEANCES = {
  "Forfait Déclic": 3,
  "Programme Sérénité": 8,
  "Forfait Famille Hérisson": 4
};
const MOTIF_TARIF_KEY = {
  "Séance Découverte (gratuite)": "decouverte",
  "Forfait Déclic": "declic",
  "Programme Sérénité": "codeChaine",
  "Forfait Famille Hérisson": "famille"
};

function montantPourMotif(motif) {
  const key = MOTIF_TARIF_KEY[motif];
  if (key && CoachSettings.data && CoachSettings.data.tarifs && CoachSettings.data.tarifs[key] != null) {
    return Number(CoachSettings.data.tarifs[key]);
  }
  return 0;
}

function appliquerForfait(client, motif) {
  const total = FORFAIT_SEANCES[motif];
  if (!total) return; // séance à l'unité / découverte / autre : pas de suivi de forfait
  if (client.forfaitNom !== motif || !client.forfaitTotal) {
    client.forfaitNom = motif;
    client.forfaitTotal = total;
    client.forfaitUtilisees = 1;
  } else {
    client.forfaitUtilisees = Math.min(total, (client.forfaitUtilisees||0) + 1);
  }
}

function normalizePhone(raw) {
  if (!raw) return "";
  let d = String(raw).replace(/[^\d+]/g, "");
  if (d.startsWith("+33")) d = "0" + d.slice(3);
  else if (d.startsWith("0033")) d = "0" + d.slice(4);
  return d;
}

function ajouterRdvAgenda({ clientId, clientName, date, heure, motif, notes, source, reqId }) {
  state.appointments.push({
    id: "a" + Date.now() + Math.random().toString(36).slice(2,6),
    clientId: clientId || null,
    clientName: clientName || "Client",
    date: date || "",
    heure: heure || "",
    motif: motif || "",
    notes: notes || "",
    source: source || "manuel",
    reqId: reqId || null
  });
  save();
  if (date && heure) {
    const slotId = date + "_" + heure;
    firebase.firestore().collection("bookedSlots").doc(slotId).set({ date, heure })
      .catch(e => console.error("bookedSlots (agenda manuel):", e));
  }
}

function supprimerRdvAgenda(id) {
  const item = state.appointments.find(a => a.id === id);
  state.appointments = state.appointments.filter(a => a.id !== id);
  save();
  if (item && item.date && item.heure) {
    const slotId = item.date + "_" + item.heure;
    firebase.firestore().collection("bookedSlots").doc(slotId).delete()
      .catch(e => console.error("bookedSlots delete:", e));
  }
  if (item && item.reqId) {
    firebase.firestore().collection("rdvRequests").doc(item.reqId).update({ status: "annule" })
      .catch(e => console.error("annulation rdvRequests:", e));
  }
}

function trouverClientExistant(req) {
  const emailNorm = (req.email || "").trim().toLowerCase();
  const telNorm = normalizePhone(req.tel);
  return state.clients.find(c => {
    const sameEmail = emailNorm && (c.email||"").trim().toLowerCase() === emailNorm;
    const samePhone = telNorm && normalizePhone(c.tel) === telNorm;
    return sameEmail || samePhone;
  }) || null;
}

function creerOuMajClientDepuisRdv(req) {
  let client = trouverClientExistant(req);
  const montant = montantPourMotif(req.motif);

  if (client) {
    client.sessions = (client.sessions || 0) + 1;
    client.nextSession = req.date || client.nextSession || "";
    client.sessionHistory = client.sessionHistory || [];
    client.sessionHistory.push("Séance " + client.sessionHistory.length + 1 + " — " + (req.motif || "RDV") + (req.theme ? " (" + req.theme + ")" : "") + (req.date ? " le " + req.date : ""));
    appliquerForfait(client, req.motif);
    client.paiements = client.paiements || [];
    client.paiements.push({ id: Date.now()+"", date: req.date || new Date().toISOString().slice(0,10), montant, statut: "en attente" });
    save();
    ajouterRdvAgenda({ clientId: client.id, clientName: client.name, date: req.date, heure: req.heure, motif: req.motif, notes: req.message, source: "site", reqId: req.id });
    notifCoach("✅ Séance ajoutée à la fiche de " + client.name);
  } else {
    const nom = ((req.prenom||"") + " " + (req.nom||"")).trim() || "Nouveau client";
    const nouveauClient = {
      id: "c" + Date.now(),
      name: nom,
      email: req.email || "",
      tel: req.tel || "",
      profile: "À définir",
      age: null,
      objective: req.motif || "",
      sessions: 1,
      nextSession: req.date || "",
      status: "actif",
      notes: req.message || "",
      sessionHistory: ["Séance 1 — " + (req.motif || "RDV") + (req.theme ? " (" + req.theme + ")" : "") + (req.date ? " le " + req.date : "")],
      objectifs: [],
      paiements: [{ id: Date.now()+"", date: req.date || new Date().toISOString().slice(0,10), montant, statut: "en attente" }]
    };
    appliquerForfait(nouveauClient, req.motif);
    state.clients.push(nouveauClient);
    save();
    ajouterRdvAgenda({ clientId: nouveauClient.id, clientName: nom, date: req.date, heure: req.heure, motif: req.motif, notes: req.message, source: "site", reqId: req.id });
    notifCoach("✅ Nouvelle fiche client créée : " + nom);
  }
}

function isoDate(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function startOfWeekMonday(d) { const day = d.getDay(); const diff = (day===0?-6:1-day); const r = new Date(d); r.setDate(d.getDate()+diff); return r; }
const JOURS_COURT = ["lun","mar","mer","jeu","ven","sam","dim"];

function appointmentsForDate(dateStr) {
  return state.appointments.filter(a => a.date === dateStr).sort((a,b) => (a.heure||"").localeCompare(b.heure||""));
}

function resynchroniserCreneaux() {
  const avecCreneau = state.appointments.filter(a => a.date && a.heure);
  if (!avecCreneau.length) { notifCoach("Aucun rendez-vous avec créneau à synchroniser."); return; }
  const db = firebase.firestore();
  let fait = 0;
  const total = avecCreneau.length;
  avecCreneau.forEach(a => {
    const slotId = a.date + "_" + a.heure;
    db.collection("bookedSlots").doc(slotId).set({ date: a.date, heure: a.heure })
      .then(() => { fait++; if (fait === total) notifCoach("✅ " + total + " créneau(x) resynchronisé(s)."); })
      .catch(e => console.error("resync bookedSlots:", e));
  });
}

function renderAgendaTab() {
  const wrap = h("div",{class:"fade"});
  const hdr = h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px"},
    h("div",{},
      h("h1",{style:"font-size:30px;color:#2E2A20;font-weight:600;font-style:italic"},"Agenda"),
      h("p",{style:"color:#5A5648;font-size:13px;margin-top:4px"},"Tous les rendez-vous, issus du site ou ajoutés manuellement")
    )
  );
  let showForm = false;
  const addBtn = h("button",{class:"btn"},"+ Nouveau rendez-vous");
  let formEl3 = null;
  addBtn.addEventListener("click", () => {
    showForm = !showForm;
    addBtn.textContent = showForm ? "✕ Fermer" : "+ Nouveau rendez-vous";
    if (showForm && !formEl3) {
      formEl3 = buildAgendaForm();
      hdr.after(formEl3);
    } else if (!showForm && formEl3) {
      formEl3.remove(); formEl3 = null;
    }
  });
  hdr.appendChild(addBtn);
  const syncBtn = h("button",{class:"btn-g"},"↻ Resynchroniser les créneaux");
  syncBtn.addEventListener("click", () => resynchroniserCreneaux());
  hdr.appendChild(syncBtn);
  wrap.appendChild(hdr);

  // --- Sélecteur de vue ---
  const viewRow = h("div",{style:"display:flex;gap:8px;margin-bottom:18px"});
  [["liste","☰ Liste"],["semaine","▦ Semaine"],["mois","▤ Mois"]].forEach(([id,label]) => {
    const b = h("button",{class:"btn-sm"}, label);
    if (state.agendaView === id) { b.style.background="#9C7A2E22"; b.style.color="#9C7A2E"; b.style.borderColor="#9C7A2E55"; }
    b.addEventListener("click", () => { state.agendaView = id; state.agendaSelectedDay = null; render(); });
    viewRow.appendChild(b);
  });
  wrap.appendChild(viewRow);

  if (state.agendaView === "semaine") wrap.appendChild(renderAgendaSemaine());
  else if (state.agendaView === "mois") wrap.appendChild(renderAgendaMois());
  else wrap.appendChild(renderAgendaListe());

  return wrap;
}

function appointmentRow(a) {
  const todayStr = isoDate(new Date());
  const isPast = a.date && a.date < todayStr;
  const row = h("div",{class:"card",style:"padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:14px"+(isPast?";opacity:0.55":"")});
  const dateBox = h("div",{style:"min-width:78px;text-align:center"},
    h("div",{style:"font-size:13px;font-weight:700;color:#9C7A2E"}, a.date || "—"),
    h("div",{style:"font-size:13px;color:#5A5648;margin-top:2px"}, a.heure || "")
  );
  const info = h("div",{style:"flex:1;min-width:0"},
    h("div",{style:"color:#2E2A20;font-size:14px;font-weight:600"}, a.clientName),
    h("div",{style:"color:#5A5648;font-size:12px;margin-top:2px"}, a.motif || "Rendez-vous")
  );
  const srcBadge = h("span",{style:`font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:${a.source==="site"?"#5aaec822":"#9880d022"};color:${a.source==="site"?"#5aaec8":"#9880d0"}`}, a.source==="site" ? "site" : "manuel");
  const delBtn = h("button",{style:"background:transparent;border:none;cursor:pointer;color:#6B6355;font-size:18px;padding:0 4px"},"×");
  delBtn.addEventListener("click", () => {
    if (!confirm("Supprimer ce rendez-vous ?")) return;
    supprimerRdvAgenda(a.id);
    render();
  });
  row.appendChild(dateBox); row.appendChild(info); row.appendChild(srcBadge); row.appendChild(delBtn);
  return row;
}

function renderAgendaListe() {
  const wrap = h("div",{});
  const todayStr = isoDate(new Date());
  const items = [...state.appointments].sort((a,b) => (a.date+((a.heure||"00:00"))).localeCompare(b.date+(b.heure||"00:00")));
  const upcoming = items.filter(a => !a.date || a.date >= todayStr);
  const past = items.filter(a => a.date && a.date < todayStr).reverse();

  wrap.appendChild(h("div",{style:"font-weight:700;font-size:14px;color:#2E2A20;margin-bottom:10px"}, "À venir (" + upcoming.length + ")"));
  if (!upcoming.length) wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;padding:10px 0"},"Aucun rendez-vous à venir."));
  upcoming.forEach(a => wrap.appendChild(appointmentRow(a)));

  if (past.length) {
    wrap.appendChild(h("div",{style:"font-weight:700;font-size:13px;color:#5A5648;margin:22px 0 10px"}, "Passés"));
    past.slice(0,15).forEach(a => wrap.appendChild(appointmentRow(a)));
  }
  return wrap;
}

function renderAgendaSemaine() {
  const wrap = h("div",{});
  const ref = parseISO(state.agendaRef);
  const monday = startOfWeekMonday(ref);
  const days = [...Array(7)].map((_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
  const todayStr = isoDate(new Date());

  const nav = h("div",{style:"display:flex;align-items:center;gap:12px;margin-bottom:16px"});
  const prevBtn = h("button",{class:"btn-sm"},"‹ Semaine préc.");
  const nextBtn = h("button",{class:"btn-sm"},"Semaine suiv. ›");
  prevBtn.addEventListener("click", () => { const d = new Date(monday); d.setDate(d.getDate()-7); state.agendaRef = isoDate(d); render(); });
  nextBtn.addEventListener("click", () => { const d = new Date(monday); d.setDate(d.getDate()+7); state.agendaRef = isoDate(d); render(); });
  const label = MOIS_NOMS_FR[days[0].getMonth()] + " " + days[0].getDate() + " – " + (days[6].getMonth()!==days[0].getMonth() ? MOIS_NOMS_FR[days[6].getMonth()]+" " : "") + days[6].getDate() + " " + days[6].getFullYear();
  nav.appendChild(prevBtn); nav.appendChild(h("div",{style:"color:#2E2A20;font-weight:700;font-size:14px;flex:1;text-align:center"},label)); nav.appendChild(nextBtn);
  wrap.appendChild(nav);

  days.forEach(d => {
    const dStr = isoDate(d);
    const dayApts = appointmentsForDate(dStr);
    const isToday = dStr === todayStr;
    const dayCard = h("div",{class:"card",style:"padding:14px 18px;margin-bottom:10px"+(isToday?";border-color:#9C7A2E66":"")});
    dayCard.appendChild(h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"},
      h("div",{style:"color:"+(isToday?"#9C7A2E":"#2E2A20")+";font-weight:700;font-size:13px;text-transform:capitalize"}, JOURS_COURT[d.getDay()===0?6:d.getDay()-1] + " " + d.getDate()),
      h("span",{style:"color:#6B6355;font-size:13px"}, dayApts.length ? dayApts.length + " RDV" : "")
    ));
    if (!dayApts.length) {
      dayCard.appendChild(h("p",{style:"color:#6B6355;font-size:12.5px"},"Aucun rendez-vous."));
    } else {
      dayApts.forEach(a => {
        const row = h("div",{style:"display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #E4DAC0"});
        row.appendChild(h("div",{style:"min-width:44px;color:#9C7A2E;font-size:12.5px;font-weight:600"}, a.heure||"—"));
        row.appendChild(h("div",{style:"flex:1;color:#2E2A20;font-size:13px"}, a.clientName + (a.motif ? " — "+a.motif : "")));
        const delBtn = h("button",{style:"background:transparent;border:none;cursor:pointer;color:#6B6355;font-size:16px"},"×");
        delBtn.addEventListener("click", () => { if(confirm("Supprimer ce rendez-vous ?")){ supprimerRdvAgenda(a.id); render(); } });
        row.appendChild(delBtn);
        dayCard.appendChild(row);
      });
    }
    wrap.appendChild(dayCard);
  });

  return wrap;
}

function renderAgendaMois() {
  const wrap = h("div",{});
  const ref = parseISO(state.agendaRef);
  const year = ref.getFullYear(), month = ref.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startGrid = startOfWeekMonday(firstOfMonth);
  const todayStr = isoDate(new Date());

  const nav = h("div",{style:"display:flex;align-items:center;gap:12px;margin-bottom:16px"});
  const prevBtn = h("button",{class:"btn-sm"},"‹ Mois préc.");
  const nextBtn = h("button",{class:"btn-sm"},"Mois suiv. ›");
  prevBtn.addEventListener("click", () => { const d = new Date(year, month-1, 1); state.agendaRef = isoDate(d); state.agendaSelectedDay=null; render(); });
  nextBtn.addEventListener("click", () => { const d = new Date(year, month+1, 1); state.agendaRef = isoDate(d); state.agendaSelectedDay=null; render(); });
  nav.appendChild(prevBtn); nav.appendChild(h("div",{style:"color:#2E2A20;font-weight:700;font-size:14px;flex:1;text-align:center;text-transform:capitalize"}, MOIS_NOMS_FR[month]+" "+year)); nav.appendChild(nextBtn);
  wrap.appendChild(nav);

  const grid = h("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:6px"});
  JOURS_COURT.forEach(j => grid.appendChild(h("div",{style:"text-align:center;color:#6B6355;font-size:13px;font-weight:700;padding-bottom:4px;text-transform:capitalize"}, j)));

  const cursor = new Date(startGrid);
  for (let w = 0; w < 6; w++) {
    for (let i = 0; i < 7; i++) {
      const dStr = isoDate(cursor);
      const inMonth = cursor.getMonth() === month;
      const dayApts = appointmentsForDate(dStr);
      const isToday = dStr === todayStr;
      const isSelected = state.agendaSelectedDay === dStr;
      const cell = h("div",{style:`min-height:56px;border-radius:8px;padding:6px;cursor:pointer;background:${isSelected?"#9C7A2E22":"#FFFFFF"};border:1px solid ${isToday?"#9C7A2E66":"#E4DAC0"};opacity:${inMonth?1:0.35}`});
      cell.appendChild(h("div",{style:"font-size:12px;color:"+(isToday?"#9C7A2E":"#2E2A20")+";font-weight:600"}, String(cursor.getDate())));
      if (dayApts.length) {
        cell.appendChild(h("div",{style:"margin-top:4px;font-size:9.5px;color:#9C7A2E;font-weight:700"}, dayApts.length + " RDV"));
      }
      cell.addEventListener("click", () => { state.agendaSelectedDay = (state.agendaSelectedDay===dStr) ? null : dStr; render(); });
      grid.appendChild(cell);
      cursor.setDate(cursor.getDate()+1);
    }
  }
  wrap.appendChild(grid);

  if (state.agendaSelectedDay) {
    const dayApts = appointmentsForDate(state.agendaSelectedDay);
    const detail = h("div",{class:"card",style:"padding:16px 18px;margin-top:16px"});
    detail.appendChild(h("div",{style:"font-weight:700;font-size:13px;color:#2E2A20;margin-bottom:10px"}, state.agendaSelectedDay));
    if (!dayApts.length) detail.appendChild(h("p",{style:"color:#6B6355;font-size:12.5px"},"Aucun rendez-vous ce jour-là."));
    dayApts.forEach(a => detail.appendChild(appointmentRow(a)));
    wrap.appendChild(detail);
  }

  return wrap;
}

function buildAgendaForm() {
  const fd = { clientId:"", clientName:"", date:"", heure:"", motif:"", notes:"" };
  const form = h("div",{class:"qform",style:"margin-bottom:20px"});
  form.appendChild(h("h3",{style:"color:#9C7A2E;font-size:21px;margin-bottom:18px;font-style:italic"},"Nouveau rendez-vous"));

  const g = h("div",{class:"grid2",style:"margin-bottom:12px"});

  const clientOptions = ["— Nouveau / hors liste —", ...state.clients.map(c => c.name)];
  const clientSel = selectEl({ options: clientOptions, value: clientOptions[0], onChange: v => {
    fd.clientName = v === clientOptions[0] ? "" : v;
    const found = state.clients.find(c => c.name === v);
    fd.clientId = found ? found.id : "";
    if (found) { freeNameInp.style.display = "none"; } else { freeNameInp.style.display = "block"; }
  }});
  g.appendChild(field("CLIENT EXISTANT", clientSel));

  const dateInp = inputEl({ type:"date", onChange: v => fd.date = v });
  g.appendChild(field("DATE", dateInp));
  form.appendChild(g);

  const g2 = h("div",{class:"grid2",style:"margin-bottom:12px"});
  const heureInp = inputEl({ type:"time", onChange: v => fd.heure = v });
  g2.appendChild(field("HEURE", heureInp));
  const MOTIFS_AGENDA = ["Séance Découverte (gratuite)","Séance à l'unité","Forfait Déclic","Programme Sérénité","Forfait Famille Hérisson","Autre"];
  fd.motif = MOTIFS_AGENDA[0];
  const motifInp = selectEl({ options: MOTIFS_AGENDA, value: MOTIFS_AGENDA[0], onChange: v => fd.motif = v });
  g2.appendChild(field("MOTIF", motifInp));
  form.appendChild(g2);

  const freeNameInp = inputEl({ placeholder:"Nom (si nouveau ou hors liste)", onInput: v => fd.clientName = v });
  form.appendChild(h("div",{style:"margin-bottom:12px"}, field("NOM (si pas dans la liste)", freeNameInp)));

  const notesInp = textareaEl({ placeholder:"Notes...", height:"64px", onInput: v => fd.notes = v });
  form.appendChild(h("div",{style:"margin-bottom:18px"}, field("NOTES", notesInp)));

  const row = h("div",{style:"display:flex;gap:10px"});
  const saveBtn = h("button",{class:"btn"},"Ajouter au calendrier");
  saveBtn.addEventListener("click", () => {
    const nom = (fd.clientName || "").trim();
    if (!nom) { notifCoach("Merci d'indiquer un client ou un nom."); return; }
    if (!fd.date) { notifCoach("Merci d'indiquer une date."); return; }
    ajouterRdvAgenda({ clientId: fd.clientId, clientName: nom, date: fd.date, heure: fd.heure, motif: fd.motif, notes: fd.notes, source: "manuel" });

    // Si un client existant est sélectionné, on décompte la séance sur sa fiche (sessions + forfait).
    if (fd.clientId) {
      const client = state.clients.find(c => c.id === fd.clientId);
      if (client) {
        client.sessions = (client.sessions || 0) + 1;
        client.nextSession = fd.date || client.nextSession || "";
        client.sessionHistory = client.sessionHistory || [];
        client.sessionHistory.push("Séance " + client.sessionHistory.length + 1 + " — " + (fd.motif || "RDV (agenda)") + (fd.date ? " (" + fd.date + ")" : ""));
        appliquerForfait(client, fd.motif);
        save();
        notifCoach("📦 Séance décomptée pour " + client.name + (client.forfaitTotal ? " (" + client.forfaitUtilisees + "/" + client.forfaitTotal + ")" : ""));
      }
    }

    setState({ tab: "agenda" });
  });
  const cancelBtn = h("button",{class:"btn-g"},"Annuler");
  cancelBtn.addEventListener("click", () => setState({ tab: "agenda" }));
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  form.appendChild(row);
  return form;
}

function renderFinancesTab() {
  const wrap = h("div",{});

  // Agrégation de tous les paiements de tous les clients, groupés par mois
  const parMois = {}; // "2026-07" -> {reel:0, prevu:0, seances:0}
  state.clients.forEach(c => {
    (c.paiements || []).forEach(p => {
      if (!p.date) return;
      const mk = p.date.slice(0,7); // YYYY-MM
      if (!parMois[mk]) parMois[mk] = {reel:0, prevu:0, seances:0};
      const montant = Number(p.montant || 0);
      parMois[mk].prevu += montant;
      parMois[mk].seances += 1;
      if (p.statut === "payé") parMois[mk].reel += montant;
    });
  });

  const moisTries = Object.keys(parMois).sort().reverse();
  const totalReel = moisTries.reduce((s,mk) => s + parMois[mk].reel, 0);
  const totalPrevu = moisTries.reduce((s,mk) => s + parMois[mk].prevu, 0);
  const totalSeances = moisTries.reduce((s,mk) => s + parMois[mk].seances, 0);

  const maintenant = new Date();
  const cleMoisCourant = maintenant.getFullYear() + "-" + String(maintenant.getMonth()+1).padStart(2,"0");
  const dataMoisCourant = parMois[cleMoisCourant] || {reel:0, prevu:0, seances:0};
  const moisProchain = new Date(maintenant.getFullYear(), maintenant.getMonth()+1, 1);
  const cleMoisProchain = moisProchain.getFullYear() + "-" + String(moisProchain.getMonth()+1).padStart(2,"0");
  const dataMoisProchain = parMois[cleMoisProchain] || {reel:0, prevu:0, seances:0};

    wrap.appendChild(h("p",{style:"color:#5A5648;font-size:13px;padding:10px 0 20px"},"Aucun forfait en cours actuellement."));
  } else {
    clientsAvecForfait.forEach(c => {
      const utilisees = c.forfaitUtilisees || 0;
      const pct = Math.min(100, Math.round(utilisees / c.forfaitTotal * 100));

      fCard.addEventListener("click", () => setState({tab:"clients", selClientId:c.id, subTab:"fiche"}));
      fCard.appendChild(h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"},
        h("div",{style:"display:flex;align-items:center;gap:10px"},

  ));
  summary.appendChild(h("div",{class:"card",style:"padding:16px;text-align:center"},

    h("div",{style:"font-size:24px;font-weight:800;color:#9C7A2E"}, totalPrevu.toFixed(0)+" €")
  ));
  wrap.appendChild(summary);
  const summary2 = h("div",{style:"display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px"});

function renderRdvTab() {
  const wrap = h("div",{});

  }

  nouveaux.forEach(r => {

    card.appendChild(h("div",{style:"display:flex;justify-content:space-between;align-items:start"},

        h("div",{style:"font-size:13.5px;color:#5A5648;margin-top:2px"},
