<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconversion après burn-out — Parcours adaptatif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEDE4; --paper:#FAF9F4; --ink:#2E332C; --ink-soft:#6B7169;
  --line:rgba(46,51,44,0.14); --accent:#3E6E68; --accent-soft:#E7EFEC;
  --tdah:#8A5A2E; --tdah-soft:#F5EBDD;
}
*{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Work Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center;}
.wrap{width:100%; max-width:640px; padding:6vh 24px 5vh; flex:1; display:flex; flex-direction:column;}
.wrap.wide{ max-width:760px; }
.eyebrow{ display:inline-block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:#fff; background:var(--accent); padding:6px 14px; border-radius:20px; margin:0 0 20px;}
h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(28px,5.5vw,40px); line-height:1.14; margin:0 0 12px; letter-spacing:-.01em; color:var(--ink);}
.subtitle{ font-size:16px; color:var(--ink-soft); font-style:italic; margin:0 0 26px; line-height:1.5;}
.hairline{ height:1px; background:var(--line); border:0; margin:24px 0;}
.icon-badge{ width:74px; height:74px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:18px; box-shadow:0 6px 14px -4px var(--accent); }
.icon-badge svg{ width:38px; height:38px; color:#fff !important; }
.card{ background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:30px; box-shadow:0 4px 14px rgba(46,51,44,0.07); position:relative; overflow:hidden;}
.card::before{ content:""; position:absolute; top:0; left:0; right:0; height:6px; background:var(--accent); }
.objectif{ display:flex; gap:14px; align-items:flex-start; font-size:15px; line-height:1.6; padding:18px 20px; background:var(--accent-soft); border-radius:14px; margin:0 0 8px;}
.objectif::before{ content:"🎯"; font-size:22px; flex-shrink:0; width:38px; height:38px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.objectif b{ color:var(--accent); text-transform:uppercase; font-size:11px; letter-spacing:.1em; display:block; margin-bottom:6px;}
.day-body{ font-size:19px; line-height:1.65; color:var(--ink); margin:0;}
.alert{ display:flex; gap:14px; align-items:flex-start; border:none; background:var(--accent-soft); border-radius:14px; padding:18px 20px; margin-top:24px;}
.alert::before{ content:"⚠️"; font-size:20px; flex-shrink:0; width:38px; height:38px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.alert b{ display:block; font-size:13px; margin-bottom:6px; color:var(--ink);}
.alert p{ margin:0; font-size:14px; line-height:1.6; color:var(--ink-soft);}
.tdahbox{ border:none; background:var(--tdah-soft); border-radius:14px; padding:18px 20px; margin-top:16px; display:flex; gap:14px; align-items:flex-start;}
.tdahbox svg{ width:20px; height:20px; flex-shrink:0; color:#fff !important;}
.tdahbox > svg{ background:var(--tdah); border-radius:50%; padding:9px; width:38px !important; height:38px !important; box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.tdahbox div b{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; color:var(--tdah);}
.tdahbox div p{ margin:0; font-size:14.5px; line-height:1.6; color:var(--ink);}
.dots{ display:flex; gap:9px; justify-content:center; margin:32px 0 6px; padding:0; list-style:none;}
.dots button{ width:10px; height:10px; border-radius:50%; background:var(--line); display:block; border:0; padding:0; cursor:pointer;}
.dots button.active{ background:var(--accent); transform:scale(1.3);}
.dots button.done{ background:var(--ink-soft); opacity:.5;}
.nav{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:28px; font-size:14px;}
.nav button{ background:none; border:0; cursor:pointer; font-family:'Work Sans',sans-serif; padding:0; }
.nav a, .nav button.link{ color:var(--ink-soft); text-decoration:none; font-size:14px; }
.nav a:hover, .nav button.link:hover{ color:var(--accent); }
.nav .center button{ color:#fff; font-weight:700; background:var(--accent); padding:10px 20px; border-radius:20px; }
footer.foot{ width:100%; text-align:center; padding:18px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px; align-items:center;}
footer.foot .links button{ background:none;border:0;cursor:pointer;color:var(--ink-soft);font-family:'Work Sans',sans-serif;font-size:12px;text-decoration:underline; margin:0 6px;}
.tdah-toggle{ display:flex; align-items:center; gap:9px; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:7px 14px 7px 7px; cursor:pointer; font-family:'Work Sans',sans-serif; font-size:12.5px; color:var(--ink);}
.tdah-toggle .switch{ width:32px; height:18px; border-radius:20px; background:var(--line); position:relative; transition:background .15s; flex-shrink:0;}
.tdah-toggle .switch.on{ background:var(--tdah); }
.tdah-toggle .switch .knob{ position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left .15s;}
.tdah-toggle .switch.on .knob{ left:16px; }
.week-list{ counter-reset:dayctr; display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:12px; margin-bottom:4px;}
.day-row{ counter-increment:dayctr; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:20px 18px; text-decoration:none; text-align:left; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:16px; transition:transform .15s, box-shadow .15s; cursor:pointer; width:100%; font-family:'Work Sans',sans-serif; position:relative; box-shadow:0 3px 8px rgba(46,51,44,0.05);}
.day-row::before{ content:counter(dayctr); width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 6px -1px var(--accent);}
.day-row:hover{ transform:translateY(-3px); box-shadow:0 8px 16px rgba(46,51,44,0.1);}
.day-row .dname{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700;}
.day-row .dtitle{ font-family:'Fraunces',serif; font-size:16.5px; line-height:1.3;}
.day-row .arrow{ display:none;}
.day-row .tdahdot{ position:absolute; top:14px; right:14px; width:9px; height:9px; border-radius:50%; background:var(--tdah);}
.index-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
.week-card, .track-card{ display:flex; gap:16px; align-items:flex-start; text-decoration:none; text-align:left; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:24px 26px; position:relative; overflow:hidden; cursor:pointer; width:100%; font-family:'Work Sans',sans-serif; box-shadow:0 4px 12px rgba(46,51,44,0.06); transition:transform .15s, box-shadow .15s;}
.week-card:hover, .track-card:hover{ transform:translateY(-3px); box-shadow:0 10px 20px rgba(46,51,44,0.12);}
.week-card::before, .track-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:7px; background:var(--wcolor);}
.card-icon{ width:52px; height:52px; border-radius:50%; background:var(--wcolor); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:6px; box-shadow:0 4px 10px -2px var(--wcolor);}
.card-icon svg{ width:26px; height:26px; color:#fff !important;}
.card-body{ flex:1; min-width:0;}
.week-card .wk, .track-card .wk{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--wcolor); font-weight:700; margin-bottom:6px;}
.week-card h2, .track-card h2{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin:0 0 6px;}
.week-card p, .track-card p{ font-size:14px; color:var(--ink-soft); margin:0; line-height:1.5;}
.cadre{ font-size:15px; line-height:1.7; color:var(--ink-soft); margin:0 0 14px;}
.cadre b{ color:var(--ink); }
.field-label{ font-size:13px; font-weight:600; color:var(--ink); margin:0 0 6px; display:block;}
.field-input{ width:100%; font-family:'Work Sans',sans-serif; font-size:15px; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:16px;}
.field-textarea{ width:100%; font-family:'Work Sans',sans-serif; font-size:15px; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; min-height:90px; resize:vertical; line-height:1.5;}
.exercice-box{ border:none; background:var(--accent-soft); border-radius:16px; padding:20px 22px; margin:18px 0 24px;}
.exercice-box .ex-title{ font-weight:700; font-size:15px; color:var(--ink); margin-bottom:4px;}
.exercice-box .ex-meta{ font-size:12.5px; font-style:italic; color:var(--ink-soft); margin-bottom:12px;}
.exercice-box ol{ margin:0; padding-left:4px; list-style:none; counter-reset:steps;}
.exercice-box li{ counter-increment:steps; font-size:14.5px; line-height:1.6; color:var(--ink); margin-bottom:10px; padding-left:34px; position:relative;}
.exercice-box li::before{ content:counter(steps); position:absolute; left:0; top:-1px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.criterion-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:16px; box-shadow:0 3px 10px rgba(46,51,44,0.05);}
.criterion-card .c-name{ font-family:'Fraunces',serif; font-size:18px; margin:0 0 4px;}
.criterion-card .c-desc{ font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.5;}
.scale-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; margin-bottom:10px;}
.scale-opt{ display:flex; flex-direction:column; align-items:center; flex:1; cursor:pointer;}
.scale-opt input{ width:20px; height:20px; margin-bottom:6px; accent-color:var(--accent); cursor:pointer;}
.scale-opt .snum{ font-size:11px; color:var(--ink-soft); font-weight:600;}
.scale-anchors{ display:flex; justify-content:space-between; gap:10px; margin-top:2px;}
.scale-anchors span{ font-size:11.5px; color:var(--ink-soft); line-height:1.4; flex:1; text-align:center;}
.scale-anchors span:first-child{ text-align:left;}
.scale-anchors span:last-child{ text-align:right;}
.radio-line{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:14.5px; color:var(--ink); cursor:pointer;}
.radio-line input{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}
.print-btn{ background:none; border:1px solid var(--line); color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:12.5px; padding:8px 16px; border-radius:20px; cursor:pointer; margin-top:8px;}
.print-btn:hover{ border-color:var(--accent); color:var(--accent); }
@media print{ .nav, footer.foot, .print-btn, .dots{ display:none !important; } body{ background:#fff; } .card, .criterion-card, .exercice-box{ box-shadow:none; break-inside:avoid; } }
.cta{ display:inline-block; margin-top:10px; background:var(--accent); color:#fff; border:0; padding:15px 28px; border-radius:30px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Work Sans',sans-serif; box-shadow:0 6px 14px -4px var(--accent);}
.cta:hover{ opacity:.92; }
.qprog{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
.option-btn{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:12px; cursor:pointer; font-family:'Fraunces',serif; font-size:19px; color:var(--ink); transition:transform .15s, box-shadow .15s; box-shadow:0 3px 8px rgba(46,51,44,0.05);}
.option-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(46,51,44,0.1);}
.option-btn .arrow{ font-family:'Work Sans',sans-serif; color:#fff; background:var(--accent); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; margin-left:16px;}
.reason{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 24px; padding:14px 18px; background:var(--accent-soft); border-radius:12px;}
.panel-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
.panel{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px 16px; text-align:center; box-shadow:0 3px 8px rgba(46,51,44,0.05);}
.panel .p-icon{ width:44px; height:44px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 10px;}
.panel .p-icon svg{ width:22px; height:22px; color:#fff !important;}
.panel .p-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--accent); margin-bottom:6px;}
.panel .p-text{ font-size:13px; color:var(--ink); line-height:1.5;}
.section-title{ font-family:'Fraunces',serif; font-size:21px; margin:32px 0 6px; color:var(--ink);}
.section-sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;}
.timeline{ margin:0 0 8px;}
.tl-item{ display:flex; gap:14px; align-items:flex-start; position:relative; padding-bottom:20px;}
.tl-item:last-child{ padding-bottom:0;}
.tl-time{ flex-shrink:0; width:58px; text-align:right; font-weight:700; font-size:12.5px; color:var(--accent); padding-top:5px;}
.tl-line{ position:relative; width:14px; flex-shrink:0; display:flex; justify-content:center;}
.tl-line .tl-dot{ width:11px; height:11px; border-radius:50%; background:var(--accent); margin-top:6px; box-shadow:0 0 0 3px var(--accent-soft); z-index:1;}
.tl-line .tl-bar{ position:absolute; top:17px; bottom:-20px; width:2px; background:var(--line);}
.tl-item:last-child .tl-bar{ display:none;}
.tl-text{ font-size:14px; line-height:1.55; color:var(--ink); padding-top:4px;}
.week-plan{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
.wp-row{ display:flex; gap:14px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 16px; box-shadow:0 2px 6px rgba(46,51,44,0.04);}
.wp-day{ flex-shrink:0; width:80px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#fff; background:var(--accent); padding:5px 0; border-radius:8px; text-align:center;}
.wp-text{ font-size:13.5px; line-height:1.5; color:var(--ink);}
.figure-wrap{ display:flex; justify-content:center; margin:10px 0 24px;}
.figure-wrap svg{ width:230px; max-width:60%; }
.legend-row{ display:flex; gap:14px; align-items:flex-start; margin-bottom:14px;}
.legend-num{ flex-shrink:0; width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 6px -1px var(--accent);}
.legend-text{ font-size:14px; line-height:1.55; color:var(--ink); padding-top:4px;}
.legend-text b{ display:block; font-size:14.5px; margin-bottom:2px;}
@media (prefers-reduced-motion:no-preference){ .card{ animation:rise .4s ease both; } @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} } }
</style>
</head>
<body>
<div id="app"></div>

<script>
let tdahMode = false;

/* ---------------- TRACKS ---------------- */
/* day = [slug, label, shortTitle, text, tdahTip] */
const tracks = {
  a: { slug:"a", accent:"#3E6E68", accentSoft:"#E7EFEC", icon:"compass", stade:"Précontemplation / Contemplation",
    name:"Clarifier le cap",
    tagline:"Passer du flou à 2-3 pistes concrètes, sans pression de trouver LA réponse tout de suite.",
    reason:"Tu as répondu que le cap n'est pas encore clair. Ce parcours commence par explorer largement avant de trancher — sans obligation de cohérence immédiate.",
    weeks:[
      { num:1, slug:"semaine1", title:"Explorer sans trancher",
        objectif:"Lister largement ce qui attire, sans filtrer ni hiérarchiser.",
        alertTitle:"Repère de vigilance",
        alertText:"Le but n'est pas de trouver LA réponse cette semaine. C'est un espace volontairement ouvert, à l'inverse de l'urgence de « il faut savoir ».",
        days:[
          ["lundi","Lundi","Lister sans filtrer","Écrire 15 activités, sujets ou métiers qui attirent, même absurdes, sans les juger ni les hiérarchiser.","Pose un minuteur de 10 minutes visible : le but est la quantité, pas la qualité — stoppe dès qu'il sonne, même à mi-phrase."],
          ["mardi","Mardi","Ce qui donnait de l'énergie avant","Repérer 3 moments professionnels ou personnels passés où le travail donnait de l'élan plutôt que de la fatigue.","Note dès qu'un souvenir remonte, sur un post-it ou l'app, sans attendre la « bonne formulation » — le brut suffit."],
          ["mercredi","Mercredi","Ce qu'on ne veut plus","Lister ce qu'on refuse absolument de revivre dans le prochain projet (rythme, hiérarchie, isolement...).","Fais cette liste à voix haute en marchant plutôt qu'assise : verbaliser en mouvement limite la rumination."],
          ["jeudi","Jeudi","Parler à quelqu'un du métier","Contacter une personne exerçant une activité qui intrigue, pour poser 3 questions concrètes.","Écris les 3 questions à l'avance sur un support visible pendant l'appel — l'improvisation à l'oral coûte plus d'énergie attentionnelle."],
          ["vendredi","Vendredi","Regrouper par familles","Regrouper les 15 pistes en 3-4 grandes familles de sens (créer, transmettre, organiser, soigner...).","Utilise des post-it physiques à déplacer plutôt qu'un tableau texte : le geste manuel aide à fixer la catégorisation."],
          ["weekend","Week-end","Rien à trancher","Aucune décision à prendre cette fois. Laisser reposer.","Si l'envie de continuer à réfléchir arrive, note-la dans un carnet « plus tard » au lieu de la retenir en tête."],
        ]},
      { num:2, slug:"semaine2", title:"Tester à petite échelle",
        objectif:"Transformer 2-3 familles en micro-expériences concrètes et peu coûteuses.",
        alertTitle:"Repère de vigilance",
        alertText:"Une micro-expérience n'engage à rien. Le seul objectif est d'apprendre, pas de réussir.",
        days:[
          ["lundi","Lundi","Choisir 2 pistes à tester","Sélectionner 2 familles parmi celles de la semaine 1, sur un critère simple : la curiosité, pas la raison.","Fixe ce critère unique par écrit avant de commencer à choisir, pour éviter l'indécision liée à plusieurs critères en même temps."],
          ["mardi","Mardi","Une micro-expérience piste 1","Réaliser une action concrète et courte liée à la piste 1 (observation, essai, immersion d'une heure).","Programme une alarme de fin dès le départ : l'hyperfocus peut transformer une « micro »-expérience en session de plusieurs heures."],
          ["mercredi","Mercredi","Ressenti à chaud","Noter ce que cette expérience a révélé : énergie, ennui, doute, envie de continuer.","Note le ressenti dans les 15 minutes qui suivent — au-delà, la mémoire émotionnelle a tendance à s'aplatir ou se réécrire."],
          ["jeudi","Jeudi","Une micro-expérience piste 2","Réaliser le même exercice sur la piste 2.","Même consigne d'alarme de fin qu'hier. Si la piste attire moins, autorise-toi à écourter encore davantage."],
          ["vendredi","Vendredi","Comparer sans trancher","Mettre les deux ressentis côte à côte, sans obligation de choisir déjà.","Utilise un support visuel (deux colonnes, deux couleurs) plutôt qu'un texte continu : la comparaison en tête est plus fatigante."],
          ["weekend","Week-end","Digestion","Repos. Aucune lecture ni recherche supplémentaire sur les pistes.","Si des recherches en ligne démarrent « toutes seules », ferme l'onglet et note juste l'intention pour la semaine prochaine."],
        ]},
      { num:3, slug:"semaine3", title:"Resserrer le cap",
        objectif:"Arriver à 1-2 pistes prioritaires et formuler un premier cap, non définitif.",
        alertTitle:"Repère de vigilance",
        alertText:"Un cap se choisit pour avancer, pas pour être définitif. Il pourra être ajusté après les premières actions réelles.",
        days:[
          ["lundi","Lundi","Ce qui a le plus résonné","Identifier la piste qui a généré le plus d'énergie réelle (pas la plus « raisonnable »).","Fais confiance au ressenti corporel immédiat (élan, impatience) plus qu'à l'analyse différée, souvent biaisée par la peur."],
          ["mardi","Mardi","Compétences transférables","Lister les compétences déjà acquises (y compris hors travail) mobilisables sur cette piste.","Demande à un proche de citer 3 de tes forces avant ta propre liste — l'auto-évaluation sous-estime souvent les compétences automatisées."],
          ["mercredi","Mercredi","Un premier cap écrit","Formuler une phrase simple : « Je veux avancer vers... », sans garantie ni plan complet.","Écris-la à la main plutôt qu'au clavier : l'écriture manuscrite ralentit et ancre davantage un engagement à ce stade."],

olidation prend du temps — certains jours resteront plus difficiles que d'autres, sans que cela invalide les progrès faits.", "example": "Après 5 semaines, Nadia gère une dispute sans en ressentir les effets pendant 3 jours comme auparavant — la récupération est devenue bien plus rapide.", "astuce": "Garde ton kit de régulation toujours à portée de main, même une fois le parcours terminé — les rechutes ponctuelles sont normales.", "icon": "flag", "days": [["lundi", "Lundi", "Une semaine sans journal", "Traverser une semaine sans noter systématiquement les émotions, en observant si les réflexes acquis tiennent seuls.", {"tdah": "Si le réflexe de nommer une émotion ou de faire une pause reste présent sans le journal, c'est un signe de consolidation réelle.", "hpi": "Résiste à l'envie de reprendre l'analyse systématique si un jour est plus difficile — un jour ne défait pas 4 semaines de travail.", "dys": "Ce break de notation est aussi un vrai repos cognitif, à apprécier pour lui-même.", "hypers": "Observe si la régulation tient même sans les repères sensoriels préparés, ou s'ils restent nécessaires — les deux réponses sont valables."}], ["mardi", "Mardi", "Une situation difficile revisitée", "Repenser à une situation émotionnellement difficile du début du parcours et comparer la réaction d'aujourd'hui.", {"tdah": "Compare des faits concrets (délai de récupération, intensité) plutôt qu'une impression générale de mieux ou moins bien.", "hpi": "Résiste à l'envie de sur-analyser cette comparaison — un constat simple suffit.", "dys": "Cette comparaison peut se faire à l'oral, en racontant les deux situations à voix haute.", "hypers": "Compare en particulier si la capacité à distinguer tes émotions de celles des autres s'est améliorée."}], ["mercredi", "Mercredi", "Transmettre un repère", "Partager avec une personne proche un des repères qui a le plus aidé dans ce parcours.", {"tdah": "Explique ce repère simplement, en une ou deux phrases, plutôt qu'en détaillant tout le pa  environnements sur-stimulants."}], ["weekend", "Week-end", "Repos social", "Un week-end avec un minimum d'interactions choisies, sans obligation sociale.", {"tdah": "Bloque ce temps dans un agenda visible pour éviter qu'une sollicitation de dernière minute ne s'y glisse.", "hpi": "Ce temps sans interaction peut aussi être un temps sans sur-sollicitation intellectuelle.", "dys": "Profite de ce créneau pour un vrai repos sans texte à lire ni à produire.", "hypers": "Choisis un environnement pauvre en stimulations sensorielles pour ce temps, pas seulement sans interaction humaine."}]]}, {"num": 2, "slug": "semaine2", "title": "Clarifier plutôt que deviner", "objectif": "Remplacer les suppositions sur les attentes implicites par des questions directes.", "alertTitle": "Repère de vigilance", "alertText": "Poser une question directe n'est pas un aveu de faiblesse — c'est souvent ce qui évite le plus de malentendus coûteux.", "example": "Amina demande directement à son manager s'il attend une réponse immédiate ou peut attendre le lendemain — un doute qui la rongeait depuis des semaines se résout en une phrase.", "astuce": "Commence tes questions de clarification par « Pour être sûre de bien comprendre... » — une formule qui met l'autre à l'aise aussi.", "icon": "ritual", "days": [["lundi", "Lundi", "Clarifier une attente", "Choisir une situation ambiguë récente et poser directement la question plutôt que de deviner.", {"tdah": "Prépare la question à l'avance par écrit pour éviter l'oubli ou la reformulation impulsive au moment de la poser.", "hpi": "Pose la question simplement, sans sur-justifier ta démarche — la sur-explication peut complexifier un échange qui se voulait clarifiant.", "dys": "Si l'oral est plus confortable que l'écrit, privilégie un appel ou une question en direct plutôt qu'un message à rédiger.", "hypers": "Choisis un moment calme pour poser la question, pas juste après une interaction déjà chargée émotionnellement."}], ["mardi", "Mardi", "Vérifier une function renderSoucisDay(t, week, dayIdx){
  setTheme(t.accent, t.accentSoft);

  const prevD = week.days[dayIdx-1], nextD = week.days[dayIdx+1];
  const dotsHtml = `<div class="dots">${week.days.map((d,i)=>{
    const cls = i===dayIdx ? "active" : (i<dayIdx ? "done" : "");
    return `<button class="${cls}" title="${d[1]}" onclick="go('prog/${t.slug}/${week.slug}/${d[0]}')"></button>`;
  }).join("")}</div>`;
  return `<div class="wrap">
    <p class="eyebrow">${t.name} · S${week.num} · ${day[1]}</p>

      <h1>${day[2]}</h1>
      <hr class="hairline">
      <p class="day-body">${day[3]}</p>
      ${activeProfile ? `<div class="tdahbox" style="border-color:${profiles[activeProfile].accent}; background:${profiles[activeProfile].accentSoft};"><svg viewBox="0 0 64 64" fill="none" stroke="${profiles[activeProfile].accent}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ICONS.spark2}</svg><div><b style="color:${profiles[activeProfile].accent};">Adaptation ${profiles[activeProfile].name}</b><p>${day[4][activeProfile]}</p></div></div>` : ''}

  </div>
  ${footerHtml()}`;
}

  return `<div class="wrap">

    <div class="alert" style="margin-top:0; margin-bottom:24px;"><b>Repère de vigilance</b><p>Ces routines complètent un suivi médical ou thérapeutique éventuel — elles ne le remplacent pas. En cas de traitement en cours, en parler avec le prescripteur avant tout changement de rythme important.</p></div>
    ${r.categories.map(cat => routineCategoryCard(cat, r.accent)).join("")}
    <h2 class="section-title">Journée type</h2>
    <p class="section-sub">Un exemple de trame horaire — à ajuster selon les contraintes réelles, l'essentiel est la régularité, pas l'horaire exact.</p>
    ${timelineHtml(r.journeeType)}
    <h2 class="section-title">Planning de la semaine</h2>
    <p class="section-sub">Répartition indicative des routines sur 7 jours.</p>
    ${weekPlanningHtml(r.planningSemaine)}
    ${footNavHtml('routines','Autre profil', null, null, null, null)}
  </div>
  ${footerHtml()}`;
}

function renderTDAH(){
  setTheme("#8A5A2E","#F5EBDD");
  return `<div class="wrap wide">
    <p class="eyebrow">Rubrique dédiée</p>
    <div class="icon-badge">${icon("brainwave")}</div>
    <h1>TDAH &amp; Burn-out</h1>
    <p class="subtitle">Ce qui change quand le burn-out survient sur un profil attentionnel particulier</p>

    <div class="card" style="margin-bottom:18px;">
      <p class="day-body" style="font-size:16px; margin-bottom:14px;"><b>Pourquoi ce n'est pas un burn-out « comme un autre »</b></p>
      <p class="cadre">Beaucoup de profils TDAH adultes, surtout diagnostiqués tardivement, ont compensé pendant des années par du contrôle, du perfectionnisme ou une sur-préparation. Le burn-out survient souvent quand ces stratégies s'effondrent d'un coup — pas progressivement.</p>
      <p class="cadre" style="margin:0;">La charge mentale invisible (tout ce qui demande un effort supplémentaire non visible par les autres) rend la fatigue plus difficile à expliquer, y compris à soi-même.</p>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <p class="day-body" style="font-size:16px; margin-bottom:14px;"><b>Le piège du cycle hyperfocus / effondrement</b></p>
      <p class="cadre" style="margin:0;">Une phase de grande énergie peut masquer un épuisement réel, ressenti seulement après coup, brutalement. Un « bon jour » n'est pas toujours un signe de guérison — c'est aussi un signal à surveiller.</p>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <p class="day-body" style="font-size:16px; margin-bottom:10px;"><b>Sur le diagnostic</b></p>
      <p class="cadre" style="margin:0;">Une suspicion de TDAH ne se confirme pas en phase de burn-out : les symptômes se ressemblent (concentration, fatigue, irritabilité). Un bilan neuropsychologique formel, après stabilisation, permet de trancher avec un spécialiste.</p>
    </div>

    <div class="tdahbox" style="margin-bottom:26px;">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ICONS.spark2}</svg>
      <div>
        <b>Ce que fait vraiment le mode TDAH</b>
        <p>Une fois activé (bouton en bas de chaque page), une adaptation concrète et spécifique apparaît sous l'action de <b>chaque jour</b> des 4 parcours — pas un conseil générique répété, mais un ajustement pensé pour cette tâche précise ce jour-là.</p>
      </div>
    </div>
    <div style="display:flex; justify-content:center; margin-bottom:10px;">${tdahToggleHtml()}</div>

    <button class="cta" onclick="go('quiz-q1')" style="align-self:flex-start;">Aller au questionnaire</button>
  </div>
  ${footerHtml()}`;
}

/* ---------------- QUIZ ---------------- */
function optionBtn(label, hash){
  return `<button class="option-btn" onclick="go('${hash}')"><span>${label}</span><span class="arrow">→</span></button>`;
}
function renderQuizQ1(){
  setTheme("#3E6E68","#E7EFEC");
  return `<div class="wrap">
    <p class="qprog">Question 1 sur 2</p>
    <h1>Où en es-tu aujourd'hui avec ton projet de reconversion ?</h1>
    <div style="margin-top:24px;">
      ${optionBtn("Je ne sais pas encore ce que je veux faire", "a")}
      ${optionBtn("J'ai plusieurs pistes mais je n'arrive pas à choisir", "d")}
      ${optionBtn("Mon projet est clair", "quiz-q2")}
    </div>
  </div>
  ${footerHtml()}`;
}
function renderQuizQ2(){
  setTheme("#A97A4B","#F3ECE3");
  return `<div class="wrap">
    <p class="qprog">Question 2 sur 2</p>
    <h1>As-tu déjà commencé à agir dessus ?</h1>
    <div style="margin-top:24px;">
      ${optionBtn("Pas encore, je n'arrive pas à démarrer", "b")}
      ${optionBtn("J'ai commencé, mais ça devient difficile à tenir", "c")}
      ${optionBtn("J'ai commencé et ça se passe plutôt bien", "result-e")}

}
function renderResultE(){
  setTheme("#47607A","#E8ECF0");
  return `<div class="wrap">
    <p class="eyebrow">Résultat du questionnaire</p>
    <div class="icon-badge">${icon("wave")}</div>
    <h1>Tu n'as peut-être pas besoin de ce parcours maintenant</h1>
    <p class="reason">Le projet avance et ça se passe bien. Il n'y a pas d'urgence à suivre un parcours correctif — un seul repère de vigilance suffit à ce stade.</p>
    <div class="card">
      <p class="day-body" style="font-size:16px;">Le principal risque à cette étape : reproduire sans s'en rendre compte le rythme qui a mené au burn-out, simplement parce que le projet est motivant.</p>
    </div>
    <div class="alert"><b>Repère de vigilance</b><p>Fixer dès maintenant un plafond d'heures hebdomadaires, même large, avant qu'il ne devienne nécessaire de le poser dans l'urgence.</p></div>
    <div style="margin-top:24px;">
      ${optionBtn("Consulter quand même « Retrouver un rythme soutenable »", "c")}
    </div>
  </div>
  ${footerHtml()}`;
}

/* ---------------- TRACK / WEEK / DAY ---------------- */
function renderTrackIntro(track){
  setTheme(track.accent, track.accentSoft);
  const cards = track.weeks.map(w => `<button class="week-card" style="--wcolor:${track.accent}" onclick="go('${track.slug}/${w.slug}')">
      ${cardIconHtml(track.icon)}
      <div class="card-body"><div class="wk">Semaine ${w.num} sur ${track.weeks.length}</div>
      <h2>${w.title}</h2>
      <p>${w.objectif}</p></div>
    </button>`).join("");
  return `<div class="wrap wide">
    <p class="eyebrow">Parcours suggéré</p>
    <div class="icon-badge">${icon(track.icon)}</div>
    <h1>${track.name}</h1>
    <p class="subtitle">${track.tagline}</p>
    ${track.stade ? `<p style="font-size:13px;opacity:.7;margin-top:-8px;">Étape estimée : <b>${track.stade}</b> — ce repère aide à calibrer le rythme, pas à s'y enfermer.</p>` : ""}
    <p class="reason">${track.reason}</p>
    ${safetyCardHtml()}
    <div class="index-grid">${cards}</div>
  </div>
  ${footerHtml()}`;
}
function renderWeek(track, week){
  setTheme(track.accent, track.accentSoft);
  const wi = track.weeks.indexOf(week);
  const prevW = track.weeks[wi-1], nextW = track.weeks[wi+1];
  const rows = week.days.map(d => `<button class="day-row" onclick="go('${track.slug}/${week.slug}/${d[0]}')">
      <span class="dname">${d[1]}</span><span class="dtitle">${d[2]}</span>
      ${tdahMode ? '<span class="tdahdot" title="Adaptation TDAH disponible"></span>' : ''}
      <span class="arrow">→</span>
    </button>`).join("");
  return `<div class="wrap">
    <p class="eyebrow">${track.name} · Semaine ${week.num} sur ${track.weeks.length}</p>
    <div class="icon-badge">${icon(track.icon)}</div>
    <h1>${week.title}</h1>
    <div class="objectif"><b>Objectif de la semaine</b>${week.objectif}</div>
    <hr class="hairline">
    <div class="week-list">${rows}</div>
    <div class="alert"><b>${week.alertTitle}</b><p>${week.alertText}</p></div>
    ${footNavHtml(prevW?`${track.slug}/${prevW.slug}`:null, prevW?`Semaine ${prevW.num}`:null, track.slug, "Vue du parcours", nextW?`${track.slug}/${nextW.slug}`:null, nextW?`Semaine ${nextW.num}`:null)}
  </div>
  ${footerHtml()}`;
}
function renderDay(track, week, dayIdx){
  setTheme(track.accent, track.accentSoft);
  const day = week.days[dayIdx];
  const prevD = week.days[dayIdx-1], nextD = week.days[dayIdx+1];
  const dotsHtml = `<div class="dots">${week.days.map((d,i)=>{
    const cls = i===dayIdx ? "active" : (i<dayIdx ? "done" : "");
    return `<button class="${cls}" title="${d[1]}" onclick="go('${track.slug}/${week.slug}/${d[0]}')"></button>`;
  }).join("")}</div>`;
  const tip = day[4];
  return `<div class="wrap">
    <p class="eyebrow">${track.name} · Semaine ${week.num} · ${day[1]}</p>
    <div class="icon-badge">${icon(track.icon)}</div>
    <div class="card">
      <h1>${day[2]}</h1>
      <hr class="hairline">
      <p class="day-body">${day[3]}</p>
      ${tdahMode ? `<div class="tdahbox"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ICONS.spark2}</svg><div><b>Adaptation TDAH</b><p>${tip}</p></div></div>` : ''}
    </div>
    ${dotsHtml}
    ${footNavHtml(prevD?`${track.slug}/${week.slug}/${prevD[0]}`:null, prevD?prevD[1]:null, `${track.slug}/${week.slug}`, "Vue de la semaine", nextD?`${track.slug}/${week.slug}/${nextD[0]}`:null, nextD?nextD[1]:null)}
  </div>
  ${footerHtml()}`;
}

/* ---------------- ROUTER ---------------- */
function render(){
  const app = document.getElementById('app');
  const hash = location.hash.replace(/^#\/?/, '');
  if (!hash){ app.innerHTML = renderLanding(); window.scrollTo(0,0); return; }
  if (hash === 'quiz-q1'){ app.innerHTML = renderQuizQ1(); window.scrollTo(0,0); return; }
  if (hash === 'quiz-q2'){ app.innerHTML = renderQuizQ2(); window.scrollTo(0,0); return; }
  if (hash === 'result-e'){ app.innerHTML = renderResultE(); window.scrollTo(0,0); return; }
  if (hash === 'tdah'){ app.innerHTML = renderTDAH(); window.scrollTo(0,0); return; }
  if (hash === 'masterclass'){ app.innerHTML = renderMasterclassHub(); window.scrollTo(0,0); return; }
  if (hash.startsWith('masterclass/')){
    const mparts = hash.split('/');
    const m = masterclass[mparts[1]];
    if (!m){ app.innerHTML = renderMasterclassHub(); return; }
    if (mparts.length === 2){ app.innerHTML = renderMasterclassMoisIntro(mparts[1], m); window.scrollTo(0,0); return; }
    const mweek = m.weeks.find(w => w.slug === mparts[2]);
    if (!mweek){ app.innerHTML = renderMasterclassMoisIntro(mparts[1], m); return; }
    if (mparts.length === 3){ app.innerHTML = renderMasterclassWeek(mparts[1], m, mweek); window.scrollTo(0,0); return; }
    const mdayIdx = mweek.days.findIndex(x => x[0] === mparts[3]);
    if (mdayIdx === -1){ app.innerHTML = renderMasterclassWeek(mparts[1], m, mweek); return; }
    app.innerHTML = renderMasterclassDay(mparts[1], m, mweek, mdayIdx); window.scrollTo(0,0); return;
  }
  if (hash === 'routines'){ app.innerHTML = renderRoutinesHub(); window.scrollTo(0,0); return; }
  if (hash === 'routines/tdah'){ app.innerHTML = renderRoutineProfile(routines.tdah); window.scrollTo(0,0); return; }
  if (hash === 'routines/hpi'){ app.innerHTML = renderRoutineProfile(routines.hpi); window.scrollTo(0,0); return; }
  if (hash === 'routines/dys'){ app.innerHTML = renderRoutineProfile(routines.dys); window.scrollTo(0,0); return; }
  if (hash === 'routines/hypers'){ app.innerHTML = renderRoutineProfile(routines.hypers); window.scrollTo(0,0); return; }
  if (hash === 'coach'){ app.innerHTML = renderCoachHub(); window.scrollTo(0,0); return; }
  if (hash === 'coach/fiche'){ app.innerHTML = renderCoachFiche(); window.scrollTo(0,0); return; }
  if (hash === 'coach/planche'){ app.innerHTML = renderCoachPlanche(); window.scrollTo(0,0); return; }
  if (hash.startsWith('coach/s')){
    const sIdx = parseInt(hash.replace('coach/s',''), 10) - 1;
    if (sIdx >= 0 && sIdx < coachSessions.length){ app.innerHTML = renderCoachSession(sIdx); window.scrollTo(0,0); return; }
    app.innerHTML = renderCoachHub(); return;
  }
  if (hash === 'soucis'){ app.innerHTML = renderSoucisOverview(); window.scrollTo(0,0); return; }
  if (hash.startsWith('prog/')){
    const pparts = hash.split('/');
    const t = soucisTracks[pparts[1]];
    if (!t){ app.innerHTML = renderSoucisOverview(); return; }
    if (pparts.length === 2){ app.innerHTML = renderSoucisTrackIntro(t); window.scrollTo(0,0); return; }
    const week = t.weeks.find(w => w.slug === pparts[2]);
    if (!week){ app.innerHTML = renderSoucisTrackIntro(t); return; }
    if (pparts.length === 3){ app.innerHTML = renderSoucisWeek(t, week); window.scrollTo(0,0); return; }
    const dayIdx = week.days.findIndex(d => d[0] === pparts[3]);
    if (dayIdx === -1){ app.innerHTML = renderSoucisWeek(t, week); return; }
    app.innerHTML = renderSoucisDay(t, week, dayIdx); window.scrollTo(0,0); return;
  }
  if (hash === 'profil'){ app.innerHTML = renderProfilSelect(); window.scrollTo(0,0); return; }
  if (hash.startsWith('profil/')){
    const pparts = hash.split('/');
    const profile = profiles[pparts[1]];
    if (!profile){ app.innerHTML = renderProfilSelect(); return; }
    if (pparts.length === 2){ app.innerHTML = renderSouciSelect(profile); window.scrollTo(0,0); return; }
    const souci = soucis[pparts[2]];
    if (!souci){ app.innerHTML = renderSouciSelect(profile); return; }
    app.innerHTML = renderProfilResult(profile, souci); window.scrollTo(0,0); return;
  }
  const parts = hash.split('/');
  const track = tracks[parts[0]];
  if (!track){ app.innerHTML = renderLanding(); return; }
  if (parts.length === 1){ app.innerHTML = renderTrackIntro(track); window.scrollTo(0,0); return; }
  const week = track.weeks.find(w => w.slug === parts[1]);
  if (!week){ app.innerHTML = renderTrackIntro(track); return; }
  if (parts.length === 2){ app.innerHTML = renderWeek(track, week); window.scrollTo(0,0); return; }
  const dayIdx = week.days.findIndex(d => d[0] === parts[2]);
  if (dayIdx === -1){ app.innerHTML = renderWeek(track, week); return; }
  app.innerHTML = renderDay(track, week, dayIdx);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
